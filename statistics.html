<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สถิติและข้อมูลหมู่บ้าน - RONGKHEM e-VILLAGE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js สำหรับแสดงกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Noto Sans Thai -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { blue: '#113a72', light: '#e8f0fe' }
                    },
                    fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { background-color: #f0f2f5; }</style>
</head>
<body class="text-gray-800 font-sans antialiased">

    <!-- Header Navigation -->
    <nav class="bg-brand-blue text-white shadow-md sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-4 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 font-bold text-lg hover:opacity-90 transition">
                <i class="fa-solid fa-chart-column"></i>
                <span>สถิติข้อมูลหมู่บ้านร่องเข็ม หมู่ที่ 6</span>
            </a>
            <a href="index.html" class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-house"></i> หน้าแรก
            </a>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-4 py-8">
        
        <!-- Key Metrics Row -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-100 text-brand-blue flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">ประชากรรวม</p>
                    <p class="text-2xl font-bold text-brand-blue">1,247 <span class="text-xs font-normal text-gray-400">คน</span></p>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-green-100 text-green-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-house-chimney"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">ครัวเรือนทั้งหมด</p>
                    <p class="text-2xl font-bold text-brand-blue">352 <span class="text-xs font-normal text-gray-400">หลัง</span></p>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-person"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">ชาย</p>
                    <p class="text-2xl font-bold text-brand-blue">608 <span class="text-xs font-normal text-gray-400">คน</span></p>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-person-dress"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">หญิง</p>
                    <p class="text-2xl font-bold text-brand-blue">639 <span class="text-xs font-normal text-gray-400">คน</span></p>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Age Distribution Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-base font-bold text-brand-blue mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-blue-500"></i> สัดส่วนช่วงอายุประชากร
                </h3>
                <div class="h-64 relative">
                    <canvas id="ageChart"></canvas>
                </div>
            </div>

            <!-- Occupation Distribution Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-base font-bold text-brand-blue mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-briefcase text-green-500"></i> โครงสร้างการประกอบอาชีพ
                </h3>
                <div class="h-64 relative">
                    <canvas id="occupationChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Age Distribution Chart
            new Chart(document.getElementById('ageChart'), {
                type: 'doughnut',
                data: {
                    labels: ['วัยเด็ก (0-14 ปี)', 'วัยทำงาน (15-59 ปี)', 'ผู้สูงอายุ (60 ปีขึ้นไป)'],
                    datasets: [{
                        data: [180, 745, 322],
                        backgroundColor: ['#60a5fa', '#113a72', '#f59e0b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Occupation Chart
            new Chart(document.getElementById('occupationChart'), {
                type: 'bar',
                data: {
                    labels: ['เกษตรกรรม', 'รับจ้างทั่วไป', 'ค้าขาย/ธุรกิจส่วนตัว', 'ข้าราชการ/พนักงานรัฐ'],
                    datasets: [{
                        label: 'จำนวน (คน)',
                        data: [420, 310, 145, 85],
                        backgroundColor: '#10b981'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        });
    </script>
</body>
</html>
