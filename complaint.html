<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเหตุ/ร้องเรียน - RONGKHEM e-VILLAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f0f2f5; }</style>
</head>
<body class="text-gray-800">

    <nav class="bg-[#113a72] text-white shadow-md">
        <div class="max-w-[1400px] mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="font-bold text-lg flex items-center gap-2">
                <i class="fa-solid fa-house"></i> RONGKHEM e-VILLAGE
            </a>
            <a href="index.html" class="text-sm bg-white/10 px-3 py-1.5 rounded hover:bg-white/20 transition">กลับหน้าหลัก</a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
                <div class="w-10 h-10 rounded-full bg-red-100 text-red-500 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-bell text-lg"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-[#113a72]">ศูนย์รับเรื่องร้องเรียน/แจ้งเหตุ</h2>
                    <p class="text-xs text-gray-500">ส่งเรื่องตรงถึงผู้ใหญ่บ้านและคณะกรรมการหมู่บ้าน</p>
                </div>
            </div>

            <form id="complaintForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">ชื่อ-นามสกุล ผู้แจ้ง</label>
                    <input type="text" required placeholder="กรอกชื่อ-นามสกุล" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="tel" required placeholder="กรอกเบอร์โทรศัพท์" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">เรื่องที่ต้องการแจ้ง</label>
                    <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900">
                        <option>แจ้งเรื่องเดือดร้อน/ร้องเรียนทั่วไป</option>
                        <option>แจ้งเหตุฉุกเฉิน/ความไม่ปลอดภัย</option>
                        <option>เสนอแนะการพัฒนาหมู่บ้าน</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">รายละเอียดข้อความ</label>
                    <textarea rows="4" required placeholder="กรอกรายละเอียดเรื่องร้องเรียนหรือจุดเกิดเหตุ" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900"></textarea>
                </div>

                <button type="submit" class="w-full bg-[#113a72] text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-900 transition shadow-sm mt-4">
                    <i class="fa-solid fa-paper-plane mr-1"></i> ส่งข้อมูลร้องเรียน
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('complaintForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('ส่งข้อมูลเรื่องร้องเรียนเรียบร้อยแล้ว');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
