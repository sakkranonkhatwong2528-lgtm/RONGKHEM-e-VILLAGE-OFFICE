<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเรื่องร้องเรียน/แจ้งเหตุ - RONGKHEM e-VILLAGE OFFICE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { blue: '#113a72', light: '#e8f0fe', accent: '#e63946' }
                    },
                    fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f0f2f5; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white py-3 shadow-sm relative z-20">
        <div class="max-w-[1400px] mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqrlPYE49MX4zPdFaBV9bMoVC6GxNVfJqP0QURhNeka8cEWq_cvTlbfpluNGHZmfgZ4RrH8QdXEDLyKWYaDFFcO3eD2GzO-ds_kRRXCpIqJc-ycOGcOYbN4njyaiVaQsBWAVN2izFQhnzBg2sX2y7l_lMbZLICOlsbDZatIsrh2Q6h4EXInhx2Fy0N_-ntwf3Vl8KB4LyYUx9OPJOSmZQtwjeVLuo728T0pTOnEmHqOjGhgVGoURT7s9aEquEvinDDCnOSu-HEtSNN6g" alt="Logo" class="w-14 h-14 rounded-full border">
                <div>
                    <h1 class="text-brand-blue text-xl font-bold">RONGKHEM e-VILLAGE OFFICE</h1>
                    <p class="text-brand-blue text-xs font-semibold">ที่ทำการผู้ใหญ่บ้านออนไลน์ บ้านร่องเข็ม หมู่ที่ 6</p>
                </div>
            </div>
            <a href="index.html" class="bg-gray-100 text-brand-blue px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-[800px] mx-auto px-4 py-8 flex-1 w-full">
        <div class="bg-white rounded-xl shadow-sm p-6 md:p-8 border border-gray-100">
            <div class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4">
                <div class="w-10 h-10 rounded-full bg-red-100 text-red-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-brand-blue">แจ้งเรื่องร้องเรียน / แจ้งเหตุ</h2>
                    <p class="text-xs text-gray-500">กรอกข้อมูลรายละเอียดเพื่อแจ้งเรื่องร้องเรียนถึงผู้ใหญ่บ้านและคณะทำงาน</p>
                </div>
            </div>

            <form id="complaintForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">หัวข้อเรื่องร้องเรียน / แจ้งเหตุ <span class="text-red-500">*</span></label>
                    <input type="text" id="complaintTitle" required placeholder="เช่น ไฟถนนดับ, เสียงดังยามวิกาล, ขอความช่วยเหลือ" class="w-full rounded-lg border-gray-300 focus:border-brand-blue focus:ring-brand-blue text-sm p-2.5 border">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">รายละเอียด <span class="text-red-500">*</span></label>
                    <textarea id="complaintDesc" rows="4" required placeholder="ระบุรายละเอียดเหตุการณ์ สถานที่ หรือจุดสังเกต..." class="w-full rounded-lg border-gray-300 focus:border-brand-blue focus:ring-brand-blue text-sm p-2.5 border"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อ-นามสกุล ผู้แจ้ง</label>
                        <input type="text" id="reporterName" placeholder="หากไม่ต้องการระบุ ให้เว้นว่างไว้" class="w-full rounded-lg border-gray-300 focus:border-brand-blue focus:ring-brand-blue text-sm p-2.5 border">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                        <input type="tel" id="reporterPhone" placeholder="08X-XXX-XXXX" class="w-full rounded-lg border-gray-300 focus:border-brand-blue focus:ring-brand-blue text-sm p-2.5 border">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-brand-blue text-white font-semibold py-3 rounded-lg hover:bg-blue-800 transition shadow-sm text-sm">
                        <i class="fa-solid fa-paper-plane mr-2"></i> ส่งเรื่องร้องเรียน
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brand-blue text-white py-4 text-center text-xs opacity-80">
        © 2024 RONGKHEM e-VILLAGE OFFICE All rights reserved.
    </footer>

    <!-- Supabase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
