<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้านแอดมิน - สำนักงานหมู่บ้านร่องเขม</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .admin-wrapper { max-width: 1000px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #e9ecef; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-reset { background-color: #6c757d; color: white; }
        .btn-logout { background-color: #dc3545; color: white; }
        .btn-edit { background-color: #ffc107; color: #212529; padding: 6px 12px; margin-right: 4px; }
        .btn-delete { background-color: #dc3545; color: white; padding: 6px 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #dee2e6; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        .img-preview { max-width: 80px; max-height: 80px; border-radius: 4px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- แถบผู้ใช้งาน & ออกจากระบบ -->
        <div class="top-bar">
            <div>👤 ผู้ดูแลระบบ: <strong id="adminEmail">กำลังตรวจสอบ...</strong></div>
            <button type="button" class="btn-logout" id="logoutBtn">🚪 ออกจากระบบ</button>
        </div>

        <h2>⚙️ ระบบจัดการข้อมูลหลังบ้าน (Admin Management)</h2>
        
        <!-- เลือกตาราง/เมนู -->
        <div class="form-group">
            <label for="menuSelect">เลือกเมนูที่ต้องการจัดการ:</label>
            <select id="menuSelect">
                <option value="news">ข่าวสารประชาสัมพันธ์ (news)</option>
                <option value="complaint">เรื่องร้องเรียน (complaint)</option>
                <option value="elderly">ข้อมูลผู้สูงอายุ (elderly)</option>
                <option value="vulnerable">กลุ่มเปราะบาง (vulnerable)</option>
                <option value="project">โครงการหมู่บ้าน (project)</option>
                <option value="incident">เหตุการณ์/การแจ้งเตือน (incident)</option>
                <option value="activity">กิจกรรม (activity)</option>
            </select>
        </div>

        <hr>

        <!-- ฟอร์มเพิ่ม/แก้ไข -->
        <div class="form-section">
            <h3 id="formTitle">➕ เพิ่มข้อมูลใหม่</h3>
            <form id="crudForm">
                <input type="hidden" id="recordId" value="">
                <input type="hidden" id="currentImageUrl" value="">
                
                <div class="form-group">
                    <label for="titleInput">หัวข้อ / ชื่อรายการ:</label>
                    <input type="text" id="titleInput" required placeholder="ระบุหัวข้อหรือชื่อรายการ...">
                </div>
                
                <div class="form-group">
                    <label for="detailInput">รายละเอียด / เนื้อหา:</label>
                    <textarea id="detailInput" rows="4" placeholder="ระบุรายละเอียด..."></textarea>
                </div>

                <div class="form-group">
                    <label for="imageInput">รูปภาพแนบ (ถ้ามี):</label>
                    <input type="file" id="imageInput" accept="image/*">
                    <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
                        <small>รูปภาพปัจจุบัน:</small><br>
                        <img id="imagePreview" src="" class="img-preview">
                    </div>
                </div>
                
                <div class="btn-group">
                    <button type="submit" id="saveBtn" class="btn-save">บันทึกข้อมูล</button>
                    <button type="button" class="btn-reset" id="resetBtn">ล้างฟอร์ม / ยกเลิก</button>
                </div>
            </form>
        </div>

        <hr>

        <!-- ตารางแสดงข้อมูล -->
        <div class="table-section">
            <h3>📋 รายการข้อมูลในระบบ</h3>
            <table>
                <thead>
                    <tr>
                        <th style="width: 8%;">ID</th>
                        <th style="width: 15%;">รูปภาพ</th>
                        <th style="width: 27%;">หัวข้อ / ชื่อรายการ</th>
                        <th style="width: 35%;">รายละเอียด</th>
                        <th style="width: 15%; text-align: center;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" style="text-align: center;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script ควบคุมการทำงานทั้งหมด -->
    <script type="module" src="manage-admin.js"></script>
</body>
</html>
