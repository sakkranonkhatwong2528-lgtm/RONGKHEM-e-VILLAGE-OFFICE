<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>เข้าสู่ระบบผู้ดูแล</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Sarabun,Arial,sans-serif;
    background:#eef2f7;
}

.login-box{
    width:360px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#113a72;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ddd;
    border-radius:7px;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:7px;
    background:#113a72;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

#message{
    margin-top:15px;
    text-align:center;
}

</style>

</head>

<body>

<div class="login-box">

<h2>🔐 เข้าสู่ระบบแอดมิน</h2>

<form id="loginForm">

<label>อีเมล</label>

<input
type="email"
id="email"
required
placeholder="admin@email.com">

<label>รหัสผ่าน</label>

<input
type="password"
id="password"
required
placeholder="รหัสผ่าน">

<button type="submit">

เข้าสู่ระบบ

</button>

</form>

<div id="message"></div>

</div>

<script type="module">

import { supabase }
from './supabase-config.js';


const form =
document.getElementById('loginForm');


form.addEventListener(
'submit',
async (e)=>{

    e.preventDefault();

    const email =
    document.getElementById('email').value;

    const password =
    document.getElementById('password').value;

    const message =
    document.getElementById('message');

    message.textContent =
    'กำลังเข้าสู่ระบบ...';

    const {
        error
    } =
    await supabase.auth.signInWithPassword({

        email,
        password

    });

    if(error){

        message.style.color =
        'red';

        message.textContent =
        error.message;

        return;

    }

    message.style.color =
    'green';

    message.textContent =
    'เข้าสู่ระบบสำเร็จ';

    window.location.href =
    'admin.html';

});

</script>

</body>

</html>
