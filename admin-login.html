<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบแอดมิน - RONGKHEM e-VILLAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f0f2f5; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-md w-full p-8 relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-50 text-blue-900 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-blue-900/10">
                <i class="fa-solid fa-user-shield text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">เข้าสู่ระบบจัดการข้อมูล</h2>
            <p class="text-xs text-gray-500 mt-1">สำหรับผู้ใหญ่บ้านและผู้ช่วยผู้ใหญ่บ้าน หมู่ที่ 6</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-2">ชื่อผู้ใช้งาน (Username)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้งาน" class="w-full pl-10 pr-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-2">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input type="password" id="password" required placeholder="กรอกรหัสผ่าน" class="w-full pl-10 pr-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>
            </div>

            <button type="submit" class="w-full bg-[#113a72] text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-900 transition shadow-sm">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-gray-500 hover:text-blue-900 flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลักสำหรับประชาชน
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('เข้าสู่ระบบสำเร็จ (ระบบทดลอง)');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
