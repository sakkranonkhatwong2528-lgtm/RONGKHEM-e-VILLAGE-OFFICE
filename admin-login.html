<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบแอดมิน - สำนักงานหมู่บ้านร่องเขม</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 เข้าสู่ระบบแอดมิน</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="emailInput">อีเมลผู้ดูแลระบบ:</label>
                <input type="email" id="emailInput" required placeholder="admin@example.com">
            </div>
            
            <div class="form-group">
                <label for="passwordInput">รหัสผ่าน:</label>
                <input type="password" id="passwordInput" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="submitBtn">เข้าสู่ระบบ</button>
            <div id="errorMsg" class="error-message"></div>
        </form>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // 1. ตรวจสอบว่าถ้าล็อกอินอยู่แล้ว ให้ไปหน้า Dashboard ทันที
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'admin-dashboard-v2.html';
            }
        });

        // 2. จัดการการเข้าสู่ระบบ
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังเข้าสู่ระบบ...';

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMsg.innerText = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'เข้าสู่ระบบ';
            } else {
                window.location.href = 'admin-dashboard-v2.html';
            }
        });
    </script>
</body>
</html>
