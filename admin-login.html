<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบผู้ดูแล</title>

    <style>
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial,sans-serif;
            background:#f4f6f9;
        }

        .login-box{
            width:360px;
            max-width:calc(100% - 40px);
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 25px rgba(0,0,0,.12);
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            box-sizing:border-box;
            padding:12px;
            margin:7px 0 15px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            padding:12px;
            border:0;
            border-radius:6px;
            background:#1d4ed8;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        #message{
            margin-top:15px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🔐 เข้าสู่ระบบผู้ดูแล</h2>

    <form id="loginForm">

        <label>อีเมล</label>

        <input
            type="email"
            id="email"
            required
            placeholder="อีเมล">

        <label>รหัสผ่าน</label>

        <input
            type="password"
            id="password"
            required
            placeholder="รหัสผ่าน">

        <button type="submit"
                id="loginBtn">
            เข้าสู่ระบบ
        </button>

    </form>

    <div id="message"></div>

</div>

<script type="module">

import { supabase }
from './supabase-config.js';

const loginForm =
    document.getElementById('loginForm');

const message =
    document.getElementById('message');

const loginBtn =
    document.getElementById('loginBtn');


loginForm.addEventListener(
    'submit',
    async event => {

        event.preventDefault();

        const email =
            document
                .getElementById('email')
                .value
                .trim();

        const password =
            document
                .getElementById('password')
                .value;

        loginBtn.disabled = true;

        loginBtn.textContent =
            'กำลังเข้าสู่ระบบ...';

        const { error } =
            await supabase.auth
                .signInWithPassword({
                    email,
                    password
                });

        if (error) {

            message.style.color = 'red';

            message.textContent =
                'เข้าสู่ระบบไม่สำเร็จ: ' +
                error.message;

            loginBtn.disabled = false;

            loginBtn.textContent =
                'เข้าสู่ระบบ';

            return;
        }

        message.style.color = 'green';

        message.textContent =
            'เข้าสู่ระบบสำเร็จ';

        window.location.href =
            'admin.html';

    });

</script>

</body>
</html>
