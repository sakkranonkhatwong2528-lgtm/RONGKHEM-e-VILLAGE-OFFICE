<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบผู้ดูแล | RONGKHEM e-VILLAGE OFFICE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Sarabun", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow:
                0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            font-size: 54px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 24px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 10px 0 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: .9;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🏛️</div>

        <h1>RONGKHEM e-VILLAGE OFFICE</h1>

        <div class="subtitle">
            ระบบผู้ดูแลสำนักงานหมู่บ้านออนไลน์
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">
                    อีเมลผู้ดูแลระบบ
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    รหัสผ่าน
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                🔐 เข้าสู่ระบบ
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

        <div class="footer">
            RONGKHEM e-VILLAGE OFFICE<br>
            ระบบบริหารจัดการหมู่บ้านออนไลน์
        </div>

    </div>


    <script type="module">

        import { supabase }
            from './supabase-config.js';


        const loginForm =
            document.getElementById('loginForm');

        const emailInput =
            document.getElementById('email');

        const passwordInput =
            document.getElementById('password');

        const loginBtn =
            document.getElementById('loginBtn');

        const message =
            document.getElementById('message');


        function showMessage(
            text,
            type = 'error'
        ) {

            message.textContent = text;

            message.className =
                'message ' + type;

            message.style.display =
                'block';
        }


        async function checkExistingSession() {

            const {
                data: { session }
            } =
                await supabase.auth.getSession();

            if (session) {

                window.location.href =
                    'admin.html';
            }
        }


        loginForm.addEventListener(
            'submit',
            async function(event) {

                event.preventDefault();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        'กรุณากรอกอีเมลและรหัสผ่าน'
                    );

                    return;
                }


                loginBtn.disabled = true;

                loginBtn.textContent =
                    'กำลังเข้าสู่ระบบ...';

                message.style.display =
                    'none';


                try {

                    const {
                        data,
                        error
                    } =
                        await supabase.auth
                            .signInWithPassword({
                                email: email,
                                password: password
                            });


                    if (error) {

                        throw error;
                    }


                    if (!data.user) {

                        throw new Error(
                            'ไม่พบข้อมูลผู้ใช้งาน'
                        );
                    }


                    showMessage(
                        'เข้าสู่ระบบสำเร็จ กำลังเปิดระบบ...',
                        'success'
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                'admin.html';

                        },
                        500
                    );

                }

                catch (error) {

                    console.error(error);

                    showMessage(
                        'เข้าสู่ระบบไม่สำเร็จ: ' +
                        error.message
                    );

                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        '🔐 เข้าสู่ระบบ';
                }

            }
        );


        checkExistingSession();

    </script>

</body>
</html>
