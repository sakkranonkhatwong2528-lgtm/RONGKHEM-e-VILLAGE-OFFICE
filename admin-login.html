<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
  เข้าสู่ระบบผู้ดูแล
</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Sarabun,Arial,sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:35px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

h1{
  margin-top:0;
  text-align:center;
  color:#113a72;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:7px;
  background:#113a72;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

#errorMessage{
  margin-top:15px;
  color:#dc3545;
  text-align:center;
}

</style>

</head>

<body>

<div class="login-box">

  <h1>
    🔐 ระบบผู้ดูแล
  </h1>

  <form id="loginForm">

    <div class="form-group">

      <label for="email">
        อีเมล
      </label>

      <input
        type="email"
        id="email"
        required
        placeholder="กรอกอีเมล">

    </div>


    <div class="form-group">

      <label for="password">
        รหัสผ่าน
      </label>

      <input
        type="password"
        id="password"
        required
        placeholder="กรอกรหัสผ่าน">

    </div>


    <button
      type="submit"
      id="loginBtn">

      🔓 เข้าสู่ระบบ

    </button>

  </form>


  <div id="errorMessage"></div>

</div>


<script
  type="module"
  src="login.js">
</script>

</body>

</html>
