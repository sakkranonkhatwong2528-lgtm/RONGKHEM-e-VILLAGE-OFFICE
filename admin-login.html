<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแล - RONGKHEM e-VILLAGE OFFICE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Sarabun', Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #113a72;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #113a72;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #113a72;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0d2c58;
    }

    button:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    #errorMessage {
      margin-top: 15px;
      color: #dc3545;
      text-align: center;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h1>🔐 ระบบผู้ดูแลหมู่บ้าน</h1>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">อีเมล</label>
      <input
        type="email"
        id="email"
        required
        placeholder="กรอกอีเมลผู้ดูแลระบบ"
        autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">รหัสผ่าน</label>
      <input
        type="password"
        id="password"
        required
        placeholder="กรอกรหัสผ่าน"
        autocomplete="current-password">
    </div>

    <button type="submit" id="loginBtn">🔓 เข้าสู่ระบบ</button>
  </form>

  <div id="errorMessage"></div>
</div>

<!-- เรียกใช้งาน Supabase SDK & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const errorMessage = document.getElementById('errorMessage');

  // ตรวจสอบว่าหากเข้าสู่ระบบไว้อยู่แล้ว ให้เปลี่ยนหน้าไปยัง admin.html ทันที
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      if (typeof supabaseClient !== 'undefined') {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          window.location.href = 'admin.html';
        }
      }
    } catch (err) {
      console.error('Error checking session:', err);
    }
  });

  // จัดการการส่งฟอร์มเข้าสู่ระบบ
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.innerText = '⏳ กำลังเข้าสู่ระบบ...';
    errorMessage.innerText = '';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      // เมื่อล็อกอินสำเร็จ นำทางไปหน้า admin.html
      window.location.href = 'admin.html';

    } catch (err) {
      errorMessage.innerText = '❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง (' + (err.message || 'โปรดตรวจสอบข้อมูลอีกครั้ง') + ')';
      loginBtn.disabled = false;
      loginBtn.innerText = '🔓 เข้าสู่ระบบ';
    }
  });
</script>

</body>
</html>
