<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>เข้าสู่ระบบผู้ใหญ่บ้าน | RONGKHEM e-VILLAGE OFFICE</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#07111f;
  --bg2:#0f172a;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --primary:#0f766e;
  --primary2:#14b8a6;
  --danger:#dc2626;
  --success:#16a34a;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(20,184,166,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(37,99,235,.16),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      var(--bg),
      var(--bg2)
    );
}

/* ===============================
   LOGIN CARD
================================ */

.login-wrapper{
  width:100%;
  max-width:460px;
}

.login-card{
  width:100%;
  background:rgba(255,255,255,.98);

  border:
    1px solid
    rgba(255,255,255,.3);

  border-radius:28px;

  padding:
    34px 32px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.35);

  animation:
    cardIn .45s ease;
}

@keyframes cardIn{

  from{
    opacity:0;
    transform:
      translateY(15px)
      scale(.98);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

/* ===============================
   BRAND
================================ */

.logo{
  width:82px;
  height:82px;

  margin:
    0 auto 18px;

  display:grid;
  place-items:center;

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      #ccfbf1,
      #dbeafe
    );

  font-size:42px;

  box-shadow:
    0 10px 30px
    rgba(15,118,110,.15);
}

.title{
  text-align:center;

  margin:0;

  color:var(--text);

  font-size:26px;

  font-weight:800;
}

.subtitle{
  text-align:center;

  margin:
    7px 0 26px;

  color:var(--muted);

  line-height:1.6;

  font-size:14px;
}

/* ===============================
   SECURITY BADGE
================================ */

.security-badge{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  width:max-content;

  max-width:100%;

  margin:
    0 auto 25px;

  padding:
    7px 12px;

  border-radius:999px;

  background:#ecfdf5;

  color:#166534;

  font-size:12px;

  font-weight:700;
}

/* ===============================
   FORM
================================ */

.form-group{
  margin-bottom:18px;
}

label{
  display:block;

  margin-bottom:7px;

  color:#334155;

  font-size:14px;

  font-weight:700;
}

.input-wrap{
  position:relative;
}

.input-icon{

  position:absolute;

  left:14px;

  top:50%;

  transform:
    translateY(-50%);

  font-size:18px;

  pointer-events:none;
}

input{

  width:100%;

  height:52px;

  padding:
    0 45px;

  border:
    1px solid
    #cbd5e1;

  border-radius:13px;

  background:#fff;

  color:var(--text);

  font-family:inherit;

  font-size:16px;

  outline:none;

  transition:
    border-color .2s,
    box-shadow .2s;
}

input::placeholder{
  color:#94a3b8;
}

input:focus{

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 4px
    rgba(20,184,166,.12);
}

/* ===============================
   PASSWORD BUTTON
================================ */

.password-toggle{

  position:absolute;

  right:10px;

  top:50%;

  transform:
    translateY(-50%);

  width:34px;
  height:34px;

  margin:0;

  padding:0;

  border:0;

  background:transparent;

  color:#64748b;

  font-size:17px;

  cursor:pointer;
}

.password-toggle:hover{
  background:#f1f5f9;
  border-radius:8px;
}

/* ===============================
   LOGIN BUTTON
================================ */

.login-button{

  width:100%;

  height:54px;

  margin-top:5px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  font-family:inherit;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 10px 25px
    rgba(15,118,110,.22);

  transition:
    transform .15s,
    box-shadow .15s,
    opacity .15s;
}

.login-button:hover{

  transform:
    translateY(-1px);

  box-shadow:
    0 14px 30px
    rgba(15,118,110,.28);
}

.login-button:active{
  transform:translateY(0);
}

.login-button:disabled{

  opacity:.65;

  cursor:
    not-allowed;

  transform:none;

  box-shadow:none;
}

/* ===============================
   LOADING
================================ */

.loading{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:9px;
}

.spinner{

  width:18px;
  height:18px;

  border:
    2px solid
    rgba(255,255,255,.4);

  border-top-color:#fff;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

/* ===============================
   MESSAGE
================================ */

.message{

  display:none;

  margin-top:16px;

  padding:
    12px 14px;

  border-radius:12px;

  font-size:13px;

  line-height:1.5;

  text-align:center;
}

.message.show{
  display:block;
}

.message.error{

  background:#fef2f2;

  color:#991b1b;

  border:
    1px solid
    #fecaca;
}

.message.success{

  background:#f0fdf4;

  color:#166534;

  border:
    1px solid
    #bbf7d0;
}

.message.info{

  background:#eff6ff;

  color:#1e40af;

  border:
    1px solid
    #bfdbfe;
}

/* ===============================
   FOOTER
================================ */

.footer{

  margin-top:24px;

  padding-top:18px;

  border-top:
    1px solid
    var(--line);

  text-align:center;

  color:#94a3b8;

  font-size:11px;

  line-height:1.7;
}

.footer strong{
  color:#64748b;
}

/* ===============================
   MOBILE
================================ */

@media(max-width:500px){

  body{
    padding:14px;
  }

  .login-card{
    padding:
      27px 21px;

    border-radius:23px;
  }

  .title{
    font-size:23px;
  }

  .logo{
    width:72px;
    height:72px;
    font-size:36px;
  }

}

/* ===============================
   REDUCED MOTION
================================ */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation:none !important;

    transition:none !important;

  }

}
</style>
</head>

<body>

<div class="login-wrapper">

  <div class="login-card">

    <!-- LOGO -->

    <div class="logo">
      🏛️
    </div>


    <!-- TITLE -->

    <h1 class="title">
      เข้าสู่ระบบผู้ใหญ่บ้าน
    </h1>

    <div class="subtitle">

      <strong>
        RONGKHEM e-VILLAGE OFFICE
      </strong>

      <br>

      ที่ทำการผู้ใหญ่บ้านออนไลน์

    </div>


    <!-- SECURITY -->

    <div class="security-badge">

      🔒
      ระบบหลังบ้านสำหรับผู้มีสิทธิ์เท่านั้น

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <!-- USERNAME -->

      <div class="form-group">

        <label
          for="username"
        >
          ชื่อผู้ใช้
        </label>

        <div class="input-wrap">

          <span class="input-icon">
            👤
          </span>

          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="กรอกชื่อผู้ใช้"
            required
            maxlength="100"
          >

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label
          for="password"
        >
          รหัสผ่าน
        </label>

        <div class="input-wrap">

          <span class="input-icon">
            🔑
          </span>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="กรอกรหัสผ่าน"
            required
            maxlength="200"
          >

          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="แสดงรหัสผ่าน"
          >
            👁️
          </button>

        </div>

      </div>


      <!-- LOGIN -->

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        🔐 เข้าสู่ระบบ
      </button>

    </form>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
      role="alert"
    ></div>


    <!-- FOOTER -->

    <div class="footer">

      <strong>
        ระบบบริหารจัดการหมู่บ้านอัจฉริยะ
      </strong>

      <br>

      บ้านร่องเข็ม หมู่ที่ 6
      ตำบลจำป่าหวาย
      อำเภอเมืองพะเยา
      จังหวัดพะเยา

      <br><br>

      🔐 Authentication Protected

    </div>

  </div>

</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =====================================================
   SUPABASE CONFIG
   =====================================================

   ตอนนี้ยังไม่ใส่ค่า URL/KEY จริง
   เพื่อไม่ให้ผมเดาข้อมูลของโปรเจกต์คุณ

   เมื่อถึงไฟล์ config.js
   เราจะย้ายค่าพวกนี้ออกจากไฟล์นี้

===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
  document.getElementById(
    "loginForm"
  );

const username =
  document.getElementById(
    "username"
  );

const password =
  document.getElementById(
    "password"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const message =
  document.getElementById(
    "message"
  );

const togglePassword =
  document.getElementById(
    "togglePassword"
  );


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

togglePassword.addEventListener(
  "click",
  function(){

    const isPassword =
      password.type === "password";

    password.type =
      isPassword
        ? "text"
        : "password";

    togglePassword.textContent =
      isPassword
        ? "🙈"
        : "👁️";

    togglePassword.setAttribute(
      "aria-label",
      isPassword
        ? "ซ่อนรหัสผ่าน"
        : "แสดงรหัสผ่าน"
    );

  }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type="error"
){

  message.textContent =
    text;

  message.className =
    "message show " + type;

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
){

  loginButton.disabled =
    loading;

  if(loading){

    loginButton.innerHTML = `
      <span class="loading">
        <span class="spinner"></span>
        กำลังตรวจสอบ...
      </span>
    `;

  }else{

    loginButton.innerHTML =
      "🔐 เข้าสู่ระบบ";

  }

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();

    if(error){

      console.warn(
        "Session check:",
        error
      );

      return;

    }

    if(
      data &&
      data.session
    ){

      /*
       * ถ้ามี Session อยู่แล้ว
       * ไป Dashboard
       */

      window.location.replace(
        "admin-dashboard.html"
      );

    }

  }catch(error){

    console.warn(
      "Session error:",
      error
    );

  }

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const user =
      username.value
        .trim()
        .toLowerCase();

    const pass =
      password.value;


    /* =========================
       VALIDATION
    ========================= */

    if(!user){

      showMessage(
        "กรุณากรอกชื่อผู้ใช้",
        "error"
      );

      username.focus();

      return;

    }


    if(!pass){

      showMessage(
        "กรุณากรอกรหัสผ่าน",
        "error"
      );

      password.focus();

      return;

    }


    setLoading(true);

    showMessage(
      "กำลังตรวจสอบบัญชีผู้ใช้...",
      "info"
    );


    try{

      /*
       * ระบบใช้ username เป็นชื่อที่ผู้ใช้กรอก
       *
       * Supabase Auth ใช้อีเมล
       *
       * ดังนั้นบัญชี:
       *
       * sakkranon
       *
       * จะถูกสร้างใน Supabase เป็น:
       *
       * sakkranon@rongkhem.local
       */

      const email =
        user +
        "@rongkhem.local";


      /* =========================
         SUPABASE AUTH
      ========================= */

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email:
              email,

            password:
              pass

          });


      /* =========================
         LOGIN ERROR
      ========================= */

      if(error){

        console.error(
          "Login error:",
          error
        );

        showMessage(
          "❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง",
          "error"
        );

        setLoading(false);

        password.focus();

        return;

      }


      if(
        !data ||
        !data.user ||
        !data.session
      ){

        showMessage(
          "ไม่สามารถสร้าง Session ได้",
          "error"
        );

        setLoading(false);

        return;

      }


      /* =========================
         CHECK PROFILE
      ========================= */

      const {
        data:profile,
        error:profileError
      } =
        await supabaseClient

          .from(
            "profiles"
          )

          .select(
            "id,username,display_name,role,active"
          )

          .eq(
            "id",
            data.user.id
          )

          .single();


      /* =========================
         PROFILE ERROR
      ========================= */

      if(
        profileError ||
        !profile
      ){

        await supabaseClient
          .auth
          .signOut();


        showMessage(
          "⛔ ไม่พบสิทธิ์ผู้ใช้งานในระบบ",
          "error"
        );

        setLoading(false);

        return;

      }


      /* =========================
         CHECK ADMIN
      ========================= */

      if(
        profile.active !== true
        ||
        profile.role !== "admin"
      ){

        await supabaseClient
          .auth
          .signOut();


        showMessage(
          "⛔ บัญชีนี้ไม่มีสิทธิ์เข้าระบบผู้ใหญ่บ้าน",
          "error"
        );

        setLoading(false);

        return;

      }


      /* =========================
         AUDIT LOG
      ========================= */

      try{

        await supabaseClient
          .from(
            "audit_logs"
          )
          .insert({

            user_id:
              data.user.id,

            username:
              profile.username,

            action:
              "LOGIN",

            target:
              "ADMIN",

            details:{
              page:
                "admin-login"
            }

          });

      }catch(auditError){

        console.warn(
          "Audit log error:",
          auditError
        );

      }


      /* =========================
         SUCCESS
      ========================= */

      showMessage(
        "✅ เข้าสู่ระบบสำเร็จ กำลังเปิดระบบหลังบ้าน...",
        "success"
      );


      setTimeout(
        function(){

          window.location.replace(
            "admin-dashboard.html"
          );

        },
        500
      );


    }catch(error){

      console.error(
        "System error:",
        error
      );

      showMessage(
        "⚠️ ไม่สามารถเชื่อมต่อระบบได้",
        "error"
      );

      setLoading(false);

    }

  }
);


/* =====================================================
   START
===================================================== */

checkExistingSession();

</script>

</body>
</html>
