/* =========================================================

function esc(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function setStatus(message,type="ok"){

    const box=document.getElementById("status");

    if(box){

        box.className="status "+type;
        box.textContent=message;

    }

}


function mergeData(defaultData,savedData){

    if(
        typeof defaultData !== "object" ||
        defaultData === null
    ){
        return savedData ?? defaultData;
    }

    if(Array.isArray(defaultData)){
        return Array.isArray(savedData)
            ? savedData
            : defaultData;
    }

    const result={...defaultData};

    if(savedData && typeof savedData==="object"){

        Object.keys(savedData).forEach(key=>{

            if(
                typeof savedData[key] === "object" &&
                savedData[key] !== null &&
                !Array.isArray(savedData[key]) &&
                typeof defaultData[key] === "object" &&
                defaultData[key] !== null &&
                !Array.isArray(defaultData[key])
            ){

                result[key]=mergeData(
                    defaultData[key],
                    savedData[key]
                );

            }else{

                result[key]=savedData[key];

            }

        });

    }

    return result;

}


/* =========================================================
   LOAD FROM SUPABASE
   ========================================================= */

async function loadData(){

    try{

        setStatus(
            "กำลังโหลดข้อมูลจาก Supabase...",
            "loading"
        );

        const {data,error} =
            await sb
            .from(TABLE_NAME)
            .select("*")
            .eq("id",1)
            .maybeSingle();

        if(error){

            console.error(error);

            throw error;

        }

        if(data && data.data){

            D=mergeData(
                DEFAULTS,
                data.data
            );

        }

        setStatus(
            "✓ เชื่อมต่อ Supabase และโหลดข้อมูลเรียบร้อย",
            "ok"
        );

        renderMenu();

        openPage("dashboard");

    }catch(error){

        console.error(error);

        D=structuredClone(DEFAULTS);

        setStatus(
            "⚠️ ยังโหลดข้อมูลจาก Supabase ไม่สำเร็จ: "
            + error.message,
            "error"
        );

        renderMenu();

        openPage("dashboard");

    }

}


/* =========================================================
   SAVE TO SUPABASE
   ========================================================= */

async function saveData(showMessage=true){

    try{

        setStatus(
            "กำลังบันทึกข้อมูล...",
            "loading"
        );

        const {error} =
            await sb
            .from(TABLE_NAME)
            .upsert({
                id:1,
                data:D,
                updated_at:new Date().toISOString()
            });

        if(error) throw error;

        setStatus(
            "✓ บันทึกข้อมูลเรียบร้อย",
            "ok"
        );

        if(showMessage){

            alert("บันทึกข้อมูลเรียบร้อย");

        }

        return true;

    }catch(error){

        console.error(error);

        setStatus(
            "❌ บันทึกไม่สำเร็จ: "
            + error.message,
            "error"
        );

        alert(
            "บันทึกไม่สำเร็จ\n\n"
            + error.message
        );

        return false;

    }

}


/* =========================================================
   IMAGE UPLOAD
   ========================================================= */

async function uploadImage(file){

    if(!file) return "";

    try{

        const extension =
            file.name.split(".").pop();

        const filename =
            "images/"
            + Date.now()
            + "-"
            + Math.random()
            .toString(36)
            .substring(2,10)
            + "."
            + extension;

        setStatus(
            "กำลังอัปโหลดรูปภาพ...",
            "loading"
        );

        const {error} =
            await sb
            .storage
            .from(STORAGE_BUCKET)
            .upload(
                filename,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );

        if(error) throw error;

        const {data} =
            sb
            .storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(filename);

        setStatus(
            "✓ อัปโหลดรูปภาพเรียบร้อย",
            "ok"
        );

        return data.publicUrl;

    }catch(error){

        console.error(error);

        alert(
            "อัปโหลดรูปไม่สำเร็จ\n\n"
            + error.message
        );

        return "";

    }

}

            <div>

                <h1>${esc(title)}</h1>

                <p>
                    เพิ่ม แก้ไข ลบ
                    และอัปโหลดรูปภาพได้
                </p>

            </div>

            <button
                class="btn primary"
                onclick="addItem('${key}','${title}')"
            >
                + เพิ่มรายการ
            </button>

        </div>

        <div id="items"></div>

    </div>

    `;

    renderItems(key,title);

}


function renderItems(key,title){

    const box=document.getElementById("items");

    if(!D[key].length){

        box.innerHTML=`
        <div class="empty">
            ยังไม่มีข้อมูล<br>
            กด “เพิ่มรายการ”
        </div>
        `;

        return;

    }

    box.innerHTML=D[key]
    .map((item,index)=>`

    <div class="item">

        <div class="item-head">

            <b>
                รายการที่ ${index+1}
            </b>

            <button
                class="btn danger"
                onclick="deleteItem('${key}',${index},'${title}')"
            >
                🗑️ ลบ
            </button>

        </div>

        <label class="field-label">
            ชื่อ / หัวข้อ

            <input
                id="${key}_title_${index}"
                value="${esc(item.title || item.name || "")}"
            >

        </label>

        <label class="field-label">
            ตำแหน่ง

            <input
                id="${key}_role_${index}"
                value="${esc(item.role || "")}"
            >

        </label>

        <label class="field-label">
            โทรศัพท์

            <input
                id="${key}_phone_${index}"
                value="${esc(item.phone || "")}"
            >

        </label>

        <label class="field-label">
            รายละเอียด

            <textarea
                id="${key}_detail_${index}"
                rows="4"
            >${esc(item.detail || "")}</textarea>

        </label>

        <label class="field-label">
            รูปภาพ

            <input
                type="file"
                accept="image/*"
                onchange="itemImage('${key}',${index},'${title}',this)"
            >

        </label>

        ${
            item.image
            ? `
            <img
                src="${esc(item.image)}"
                class="preview"
            >
            `
            : ""
        }

        <div class="actions">

            <button
                class="btn primary"
                onclick="saveItem('${key}',${index})"
            >
                💾 บันทึก
            </button>

        </div>

    </div>

    `)
    .join("");

}


function addItem(key,title){

    D[key].push({

        title:"",
        name:"",
        role:"",
        phone:"",
        detail:"",
        image:""

    });

    collectionPage(key,title);

}


async function deleteItem(key,index,title){

    if(!confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) return;

    D[key].splice(index,1);

    await saveData(false);

    collectionPage(key,title);

}


async function saveItem(key,index){

    const titleInput=
        document.getElementById(
            `${key}_title_${index}`
        );

    const roleInput=
        document.getElementById(
            `${key}_role_${index}`
        );

    const phoneInput=
        document.getElementById(
            `${key}_phone_${index}`
        );

    const detailInput=
        document.getElementById(
            `${key}_detail_${index}`
        );

    D[key][index]={
        ...D[key][index],

        title:titleInput.value,
        name:titleInput.value,

        role:roleInput.value,

        phone:phoneInput.value,

        detail:detailInput.value
    };

    await saveData();

}


async function itemImage(
    key,
    index,
    title,
    input
){

    const file=input.files[0];

    if(!file) return;

    const url=await uploadImage(file);

    if(url){

        D[key][index].image=url;

        await saveData(false);

        collectionPage(key,title);

    }

}

async function saveSingle(key){

    D[key].title=
        document.getElementById("single_title").value;

    D[key].detail=
        document.getElementById("single_detail").value;

    const valueElement=
        document.getElementById("single_value");

    if(valueElement){

        if(key==="pm25"){

            D[key].value=valueElement.value;

        }

        if(key==="weather"){

            D[key].temperature=valueElement.value;

        }

    }

    D[key].level=
        document.getElementById("single_level").value;

    D[key].updated=
        document.getElementById("single_updated").value;

    await saveData();

}


async function singleImage(key,title,input){

    const file=input.files[0];

    if(!file) return;

    const url=await uploadImage(file);

    if(url){

        D[key].image=url;

        await saveData(false);

        singlePage(key,title);

    }

}

/* =========================================================
   BACKUP
   ========================================================= */

function backupPage(){

    document.getElementById("app").innerHTML=`

    <div class="card">

        <h1>💾 สำรอง / กู้คืนข้อมูล</h1>

        <p>
            ดาวน์โหลดข้อมูลทั้งหมดเป็นไฟล์ JSON
            หรือกู้คืนข้อมูลกลับเข้าสู่ระบบ
        </p>

        <div class="actions">

            <button
                class="btn primary"
                onclick="downloadBackup()"
            >
                ⬇️ ดาวน์โหลด Backup
            </button>

            <label class="btn light">

                📂 เลือกไฟล์กู้คืน

                <input
                    type="file"
                    accept=".json,application/json"
                    style="display:none"
                    onchange="restoreBackup(this)"
                >

            </label>

        </div>

    </div>

    `;

}


function downloadBackup(){

    const blob=new Blob(
        [
            JSON.stringify(
                D,
                null,
                2
            )
        ],
        {
            type:"application/json"
        }
    );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download=
        "rongkhem-e-village-backup.json";

    a.click();

    URL.revokeObjectURL(url);

}


function restoreBackup(input){

    const file=input.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=async function(){

        try{

            const imported=
                JSON.parse(reader.result);

            D=mergeData(
                DEFAULTS,
                imported
            );

            const success=
                await saveData(false);

            if(success){

                alert(
                    "กู้คืนข้อมูลเรียบร้อย"
                );

                openPage("dashboard");

            }

        }catch(error){

            alert(
                "ไฟล์ Backup ไม่ถูกต้อง"
            );

        }

    };

    reader.readAsText(file);

}
