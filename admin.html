<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลผู้ใหญ่บ้าน - RONGKHEM e-VILLAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f0f2f5; }</style>
</head>
<body class="text-gray-800">

    <!-- Header Panel -->
    <nav class="bg-[#113a72] text-white shadow-md">
        <div class="max-w-[1200px] mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user-shield text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">ระบบจัดการข้อมูลสำหรับผู้ใหญ่บ้าน</h1>
                    <p class="text-xs text-blue-200">บ้านร่องเข็ม หมู่ที่ 6</p>
                </div>
            </div>
            <a href="index.html" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
            </a>
        </div>
    </nav>

    <main class="max-w-[1200px] mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Form Add/Edit (Span 5) -->
            <div class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h2 id="formTitle" class="text-lg font-bold text-[#113a72] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-green-600"></i> เพิ่มข่าวสาร / กิจกรรมใหม่
                </h2>

                <form id="dataForm" class="space-y-4">
                    <input type="hidden" id="editIndex" value="-1">

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">ประเภทข้อมูล</label>
                        <select id="itemType" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
                            <option value="news">ข่าวสารและประกาศ</option>
                            <option value="activity">กิจกรรมชุมชน</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">หัวข้อ / ชื่อกิจกรรม</label>
                        <input type="text" id="itemTitle" required placeholder="กรอกหัวข้อข่าวหรือกิจกรรม" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">วันที่ดำเนินการ</label>
                        <input type="text" id="itemDate" required placeholder="เช่น 20 สิงหาคม 2569" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">URL รูปภาพประกอบ (ถ้ามี)</label>
                        <input type="url" id="itemImage" placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">รายละเอียดเนื้อหา</label>
                        <textarea id="itemDetail" rows="4" required placeholder="กรอกรายละเอียดข่าวสาร..." class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none"></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-xs transition shadow-sm">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกข้อมูล
                        </button>
                        <button type="button" id="btnCancel" onclick="resetForm()" class="hidden bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-lg font-bold text-xs transition">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- List Data Table (Span 7) -->
            <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-[#113a72] mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> รายการข้อมูลทั้งหมดในระบบ
                </h2>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100 text-xs text-gray-500">
                                <th class="p-3">ประเภท</th>
                                <th class="p-3">หัวข้อ</th>
                                <th class="p-3">วันที่</th>
                                <th class="p-3 text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="text-xs divide-y divide-gray-100">
                            <!-- Data Rendered Here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Default Mock Data
        const defaultItems = [
            { type: 'news', title: 'ประกาศการจัดเก็บภาษีที่ดิน ประจำปี 2569', date: '14 พ.ค. 2569', detail: 'ขอเชิญชวนประชาชนผู้มีหน้าที่เสียภาษี ชำระภาษีภายในกำหนด...', image: '' },
            { type: 'activity', title: 'โครงการชุมชนตำบลยั่งยืน', date: '15 พ.ค. 2569', detail: 'กิจกรรมสร้างภูมิคุ้มกันและส่งเสริมอาชีพในหมู่บ้าน...', image: '' }
        ];

        // Load or Init Data
        function getItems() {
            const data = localStorage.getItem('villageData');
            return data ? JSON.parse(data) : defaultItems;
        }

        function saveItems(data) {
            localStorage.setItem('villageData', JSON.stringify(data));
            renderTable();
        }

        // Render Table
        function renderTable() {
            const items = getItems();
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-400">ยังไม่มีข้อมูล</td></tr>`;
                return;
            }

            items.forEach((item, index) => {
                const badge = item.type === 'news' 
                    ? `<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">ข่าว</span>`
                    : `<span class="bg-green-100 text-green-600 px-2 py-0.5 rounded font-bold">กิจกรรม</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3">${badge}</td>
                        <td class="p-3 font-semibold text-gray-800">${item.title}</td>
                        <td class="p-3 text-gray-500 whitespace-nowrap">${item.date}</td>
                        <td class="p-3 text-center whitespace-nowrap space-x-1">
                            <button onclick="editItem(${index})" class="bg-blue-50 text-blue-600 hover:bg-blue-100 p-1.5 rounded transition" title="แก้ไข">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteItem(${index})" class="bg-red-50 text-red-600 hover:bg-red-100 p-1.5 rounded transition" title="ลบ">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Form Submit (Add or Save Edit)
        document.getElementById('dataForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const items = getItems();
            const editIndex = parseInt(document.getElementById('editIndex').value);

            const newItem = {
                type: document.getElementById('itemType').value,
                title: document.getElementById('itemTitle').value,
                date: document.getElementById('itemDate').value,
                image: document.getElementById('itemImage').value,
                detail: document.getElementById('itemDetail').value
            };

            if (editIndex === -1) {
                // Add New
                items.unshift(newItem);
                alert('เพิ่มข้อมูลใหม่เรียบร้อยแล้ว');
            } else {
                // Save Edit
                items[editIndex] = newItem;
                alert('บันทึกการแก้ไขเรียบร้อยแล้ว');
            }

            saveItems(items);
            resetForm();
        });

        // Edit Action
        function editItem(index) {
            const item = getItems()[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('itemType').value = item.type;
            document.getElementById('itemTitle').value = item.title;
            document.getElementById('itemDate').value = item.date;
            document.getElementById('itemImage').value = item.image || '';
            document.getElementById('itemDetail').value = item.detail;

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600"></i> แก้ไขข้อมูล`;
            document.getElementById('btnCancel').classList.remove('hidden');
        }

        // Delete Action
        function deleteItem(index) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                const items = getItems();
                items.splice(index, 1);
                saveItems(items);
                alert('ลบข้อมูลเรียบร้อยแล้ว');
            }
        }

        // Reset Form
        function resetForm() {
            document.getElementById('dataForm').reset();
            document.getElementById('editIndex').value = -1;
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-plus-circle text-green-600"></i> เพิ่มข่าวสาร / กิจกรรมใหม่`;
            document.getElementById('btnCancel').classList.add('hidden');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
