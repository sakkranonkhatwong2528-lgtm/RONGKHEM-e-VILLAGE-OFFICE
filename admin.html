body{

.header{

    position:sticky;

.header h1{

    font-size:20px;
}

.header p{
    margin:3px 0 0;
    font-size:13px;
    opacity:.75;
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.header-actions a,
.header-actions button{
    border:none;
    background:#fff;
    color:#001b3d;
    padding:10px 14px;
    border-radius:8px;
    text-decoration:none;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
}

.layout{
    max-width:1450px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:20px;
}

.sidebar,
.card{
    background:#fff;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.sidebar{
    padding:15px;
    height:max-content;
    position:sticky;
    top:90px;
}

.sidebar h3{
    margin:0 0 10px;
}

.menu-button{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    padding:11px 12px;
    border-radius:8px;
    font-family:inherit;
    cursor:pointer;
    font-size:14px;
}

.menu-button:hover,
.menu-button.active{
    background:#e0ecf9;
    color:#075ca8;
}

.card{
    padding:25px;
}

.card h2{
    margin-top:0;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
}

textarea{
    min-height:130px;
    resize:vertical;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:600;
    font-size:14px;
}

button{
    font-family:inherit;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 16px;
    font-weight:600;
    cursor:pointer;
    margin-top:15px;
}

.btn-primary{
    background:#075ca8;
    color:#fff;
}

.btn-success{
    background:#15803d;
    color:#fff;
}

.btn-danger{
    background:#b91c1c;
    color:#fff;
}

.btn-gray{
    background:#e2e8f0;
    color:#334155;
}

.item{
    border:1px solid #dbe3ec;
    border-radius:12px;
    padding:18px;
    margin-top:18px;
    background:#fafcff;
}

.item-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.preview{
    width:160px;
    max-height:140px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #ddd;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.stat-card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.stat-card h3{
    margin:0;
    font-size:14px;
    color:#64748b;
}

.stat-card strong{
    display:block;
    margin-top:10px;
    font-size:28px;
    color:#075ca8;
}

.notice{
    background:#e8f4ff;
    border:1px solid #b9dcfa;
    color:#075ca8;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.section-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

</style>

}catch(error){

}

const menu = document.getElementById("menu");

const app = document.getElementById("app");


function renderMenu(active="ภาพรวมระบบ"){

    menu.innerHTML = "";

    MENUS.forEach(function(name){

        const button = document.createElement("button");

        button.className = "menu-button";

        if(name === active){

            button.classList.add("active");

        }

        button.textContent = name;

        button.onclick = function(){

            openPage(name);

        };

        menu.appendChild(button);

    });

}

========================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(DATA)
    );

    alert("บันทึกข้อมูลเรียบร้อย");

}


/* =========================
   เปิดหน้า
========================= */

function openPage(name){

    renderMenu(name);

    if(name === "ภาพรวมระบบ"){
        dashboard();
        return;
    }

    if(name === "ข้อมูลผู้ใหญ่บ้าน"){
        leaderPage();
        return;
    }

    if(name === "ทีมผู้ช่วยผู้ใหญ่บ้าน"){
        assistantsPage();
        return;
    }

    if(name === "ข่าวประชาสัมพันธ์"){
        listPage(
            "ข่าวประชาสัมพันธ์",
            "news"
        );
        return;
    }

    if(name === "กิจกรรมเด่น"){
        listPage(
            "กิจกรรมเด่น",
            "activities"
        );
        return;
    }

    if(name === "ประกาศสำคัญ"){
        listPage(
            "ประกาศสำคัญ",
            "announcements"
        );
        return;
    }

    if(name === "สถิติหมู่บ้าน"){
        statsPage();
        return;
    }

    if(name === "สำรอง / กู้คืนข้อมูล"){
        backupPage();
        return;
    }

    sectionPage(name);

}

        <input id="leaderAddress"

        <label>คำพูด</label>

        <textarea id="leaderQuote">${escapeHtml(x.quote)}</textarea>

        <label>โทรศัพท์</label>

        value="${escapeHtml(x.phone)}">

function saveLeader(){

    DATA.leader.name =
        document.getElementById("leaderName").value;

    DATA.leader.role =
        document.getElementById("leaderRole").value;

    DATA.leader.address =
        document.getElementById("leaderAddress").value;

    DATA.leader.quote =
        document.getElementById("leaderQuote").value;

    DATA.leader.phone =
        document.getElementById("leaderPhone").value;

    saveData();

}


function uploadLeaderImage(input){

    readImage(input,function(image){

        DATA.leader.image = image;

        saveData();

        leaderPage();

    });

}

function assistantsPage(){

    app.innerHTML = `

    <div class="card">

        <div class="section-top">

            <div>

                <h2>ทีมผู้ช่วยผู้ใหญ่บ้าน</h2>

            </div>

            <button
            class="btn btn-primary"
            onclick="addAssistant()">

            + เพิ่มผู้ช่วย

            </button>

        </div>

        <div id="assistantList"></div>

    </div>

    `;

    const container =
        document.getElementById("assistantList");


    if(DATA.assistants.length === 0){

        container.innerHTML =
        `<div class="empty">
        ยังไม่มีข้อมูล
        </div>`;

        return;

    }


    DATA.assistants.forEach(function(x,index){

        const div =
        document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <label>ชื่อ</label>

            <input
            id="assistantName${index}"
            value="${escapeHtml(x.name)}">

            <label>ตำแหน่ง</label>

            <input
            id="assistantRole${index}"
            value="${escapeHtml(x.role)}">

            <label>รายละเอียด</label>

            <textarea
            id="assistantDetail${index}">${escapeHtml(x.detail)}</textarea>

            <label>โทรศัพท์</label>

            <input
            id="assistantPhone${index}"
            value="${escapeHtml(x.phone)}">

            <label>อัปโหลดรูปภาพ</label>

            <input
            type="file"
            accept="image/*"
            onchange="uploadAssistantImage(this,${index})">

            ${
                x.image
                ?
                `<img class="preview" src="${x.image}">`
                :
                ""
            }

            <div class="item-actions">

                <button
                class="btn btn-success"
                onclick="saveAssistant(${index})">

                บันทึก

                </button>

                <button
                class="btn btn-danger"
                onclick="deleteAssistant(${index})">

                ลบ

                </button>

            </div>

        `;

        container.appendChild(div);

    });

}


function addAssistant(){

    DATA.assistants.push({

        name:"",
        role:"",
        detail:"",
        phone:"",
        image:""

    });

    saveData();

    assistantsPage();

}


function saveAssistant(index){

    DATA.assistants[index].name =
        document.getElementById(
            "assistantName"+index
        ).value;

    DATA.assistants[index].role =
        document.getElementById(
            "assistantRole"+index
        ).value;

    DATA.assistants[index].detail =
        document.getElementById(
            "assistantDetail"+index
        ).value;

    DATA.assistants[index].phone =
        document.getElementById(
            "assistantPhone"+index
        ).value;

    saveData();

}


function deleteAssistant(index){

    if(!confirm("ต้องการลบข้อมูลนี้หรือไม่?")){
        return;
    }

    DATA.assistants.splice(index,1);

    saveData();

    assistantsPage();

}


function uploadAssistantImage(input,index){

    readImage(input,function(image){

        DATA.assistants[index].image =
            image;

        saveData();

        assistantsPage();

    });

}

========================= */

                    เพิ่ม แก้ไข ลบ

            </div>

            <button
            class="btn btn-primary"
            onclick="addListItem('${key}','${title}')">

            + เพิ่มรายการ

            </button>

        </div>

        <div id="listContainer"></div>

    </div>

    `;

    renderListItems(title,key);

}

        document.getElementById("listContainer");

    container.innerHTML = "";


    if(!DATA[key]){

        DATA[key] = [];

    }


    if(DATA[key].length === 0){

        container.innerHTML = `
        <div class="empty">
        ยังไม่มีรายการ
        </div>
        `;

        return;

    }


    DATA[key].forEach(function(x,index){

        const div =
        document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <label>หัวข้อ</label>

            <input
            id="${key}Title${index}"
            value="${escapeHtml(x.title || "")}">

            <label>รายละเอียด</label>

            <textarea
            id="${key}Detail${index}">${escapeHtml(x.detail || "")}</textarea>

            <label>อัปโหลดรูปภาพ</label>

            <input
            type="file"
            accept="image/*"
            onchange="uploadListImage(this,'${key}',${index})">

            ${
                x.image
                ?
                `<img class="preview" src="${x.image}">`
                :
                ""
            }

            <div class="item-actions">

                <button
                class="btn btn-success"
                onclick="saveListItem('${key}',${index})">

                บันทึก

                </button>

                <button
                class="btn btn-danger"
                onclick="deleteListItem('${key}',${index},'${title}')">

                ลบ

                </button>

            </div>

        `;

        container.appendChild(div);

    });

}


function addListItem(key,title){

    if(!DATA[key]){

        DATA[key] = [];

    }

    DATA[key].push({

        title:"",
        detail:"",
        image:""

    });

    saveData();

    listPage(title,key);

}


function saveListItem(key,index){

    DATA[key][index].title =
        document.getElementById(
            key+"Title"+index
        ).value;

    DATA[key][index].detail =
        document.getElementById(
            key+"Detail"+index
        ).value;

    saveData();

}


function deleteListItem(key,index,title){

    if(!confirm("ต้องการลบรายการนี้หรือไม่?")){
        return;
    }

    DATA[key].splice(index,1);

    saveData();

    listPage(title,key);

}


function uploadListImage(input,key,index){

    readImage(input,function(image){

        DATA[key][index].image =
            image;

        saveData();

        renderListItems(
            key === "news"
            ? "ข่าวประชาสัมพันธ์"
            :
            key === "activities"
            ? "กิจกรรมเด่น"
            :
            "ประกาศสำคัญ",
            key
        );

    });

}

/* =========================
   อ่านไฟล์รูปภาพ
========================= */

function readImage(input,callback){

    const file =
        input.files[0];

    if(!file){

        return;

    }


    if(!file.type.startsWith("image/")){

        alert("กรุณาเลือกไฟล์รูปภาพ");

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(event){

        callback(event.target.result);

    };


    reader.readAsDataURL(file);

}


/* =========================
   สำรองข้อมูล
========================= */

function backupPage(){

    app.innerHTML = `

    <div class="card">

        <h2>สำรอง / กู้คืนข้อมูล</h2>

        <div class="notice">

            คุณสามารถดาวน์โหลดข้อมูลทั้งหมด
            และนำกลับมากู้คืนภายหลังได้

        </div>


        <button
        class="btn btn-primary"
        onclick="downloadBackup()">

        ดาวน์โหลดสำรองข้อมูล

        </button>


        <label>
        กู้คืนข้อมูลจากไฟล์ JSON
        </label>


        <input
        type="file"
        accept=".json,application/json"
        onchange="restoreBackup(this)">


        <br>


        <button
        class="btn btn-danger"
        onclick="resetData()">

        รีเซ็ตข้อมูลทั้งหมด

        </button>

    </div>

    `;

}


function downloadBackup(){

    const blob =
        new Blob(

            [
                JSON.stringify(
                    DATA,
                    null,
                    2
                )
            ],

            {
                type:"application/json"
            }

        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "rongkhem-e-village-backup.json";


    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


function restoreBackup(input){

    const file =
        input.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(event){

        try{

            DATA =
                JSON.parse(
                    event.target.result
                );


            saveData();


            alert(
                "กู้คืนข้อมูลเรียบร้อย"
            );


            dashboard();

        }catch(error){

            alert(
                "ไฟล์ข้อมูลไม่ถูกต้อง"
            );

        }

    };


    reader.readAsText(file);

}


function resetData(){

    if(
        !confirm(
            "ยืนยันการรีเซ็ตข้อมูลทั้งหมด?"
        )
    ){

        return;

    }


    DATA =
        JSON.parse(
            JSON.stringify(DEFAULT_DATA)
        );


    saveData();


    dashboard();

}

function logout(){

    localStorage.removeItem(
        "rongkhemAdminLoggedIn"

    localStorage.removeItem(
        "rongkhemAdminUsername"
    );

    window.location.href =
        "login.html";

}


/* =========================
   ป้องกัน HTML พัง
========================= */

function escapeHtml(text){

    if(text === undefined || text === null){

        return "";

    }


    return String(text)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
