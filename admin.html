<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONGKHEM e-VILLAGE | หลังบ้าน</title><link rel="stylesheet" href="style.css"></head>
<body style="background:#06251f">
<div class="container" style="padding:25px 0;color:#fff">
<header style="display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px"><div><div class="eyebrow" style="color:#76d9a4">RONGKHEM e-VILLAGE OFFICE</div><h1>ระบบหลังบ้านที่ทำการผู้ใหญ่บ้าน</h1><p>แก้ไขและบันทึกข้อมูลหน้าเว็บไซต์</p></div><a href="index.html" class="green-btn">← หน้าเว็บไซต์</a></header>
<section id="loginBox" class="panel"><h2>เข้าสู่ระบบผู้ดูแล</h2><p>ใช้บัญชี Supabase Authentication</p><form id="loginForm" class="form-grid"><div class="field"><label>อีเมล</label><input type="email" name="email" required></div><div class="field"><label>รหัสผ่าน</label><input type="password" name="password" required></div><button class="submit">เข้าสู่ระบบ</button></form></section>
<section id="adminApp" style="display:none">
<div class="admin-toolbar"><button data-tab="news">📰 ข่าว</button><button data-tab="events">📅 กิจกรรม</button><button data-tab="leaders">👤 ผู้นำ</button><button data-tab="projects">🌿 โครงการ</button><button data-tab="complaints">🚨 ร้องเรียน</button><button id="logout">ออกจากระบบ</button></div>
<div id="editor"></div>
</section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const C=window.RONGKHEM_CONFIG,ready=window.supabase&&!C.SUPABASE_URL.includes("YOUR-PROJECT")&&!C.SUPABASE_ANON_KEY.includes("YOUR_"),sb=ready?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const schemas={news:[["type","ประเภท"],["title","หัวข้อ"],["detail","รายละเอียด"],["date","วันที่"]],events:[["day","วันที่"],["month","เดือน"],["title","ชื่อกิจกรรม"],["detail","รายละเอียด"]],leaders:[["name","ชื่อ"],["role","ตำแหน่ง"],["phone","โทรศัพท์"],["image","รูปภาพ URL"]],projects:[["icon","ไอคอน"],["title","ชื่อโครงการ"],["text","รายละเอียด"]]};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function editor(tab){
 if(tab==="complaints")return loadComplaints();
 const cols=schemas[tab];$("#editor").innerHTML=`<div class="panel"><div class="panel-head"><h2>จัดการ${tab==="news"?"ข่าวสาร":tab==="events"?"กิจกรรม":tab==="leaders"?"ผู้นำ":"โครงการ"}</h2><button class="green-btn" id="add">＋ เพิ่มรายการ</button></div><div id="rows">กำลังโหลด...</div></div>`;
 loadRows(tab,cols)
}
async function loadRows(tab,cols){
 if(!sb){$("#rows").innerHTML='<div class="answer">ยังไม่ได้ตั้งค่า Supabase ใน config.js</div>';return}
 const {data,error}=await sb.from(tab).select("*").order("created_at",{ascending:false});if(error){$("#rows").textContent=error.message;return}
 $("#rows").innerHTML=(data||[]).map(r=>`<div class="admin-row" data-id="${r.id}">${cols.map(c=>`<div class="field"><label>${c[1]}</label><input data-key="${c[0]}" value="${esc(r[c[0]])}"></div>`).join("")}<div><button class="save-row">บันทึก</button><button class="del-row">ลบ</button></div></div>`).join("")||"ยังไม่มีข้อมูล";
 $$("#rows .save-row").forEach(b=>b.onclick=async()=>{let row=b.closest(".admin-row"),payload={};row.querySelectorAll("[data-key]").forEach(i=>payload[i.dataset.key]=i.value);let r=await sb.from(tab).update(payload).eq("id",row.dataset.id);alert(r.error?r.error.message:"บันทึกแล้ว")});
 $$("#rows .del-row").forEach(b=>b.onclick=async()=>{if(!confirm("ลบรายการนี้?"))return;let r=await sb.from(tab).delete().eq("id",b.closest(".admin-row").dataset.id);if(r.error)alert(r.error.message);else loadRows(tab,cols)});
 $("#add").onclick=async()=>{let p={};cols.forEach(c=>p[c[0]]="");let r=await sb.from(tab).insert(p);if(r.error)alert(r.error.message);else loadRows(tab,cols)}
}
async function loadComplaints(){if(!sb)return $("#editor").innerHTML='<div class="panel">ยังไม่ได้ตั้งค่า Supabase</div>';let {data,error}=await sb.from("complaints").select("*").order("created_at",{ascending:false});$("#editor").innerHTML=`<div class="panel"><h2>เรื่องร้องเรียน</h2>${error?error.message:(data||[]).map(x=>`<div class="admin-row"><div><b>${esc(x.subject)}</b><small>${esc(x.name)} · ${esc(x.phone)}</small><p>${esc(x.detail)}</p></div><span>${esc(x.status||"รับเรื่อง")}</span></div>`).join("")||"ยังไม่มีข้อมูล"}</div>`}
$("#loginForm").onsubmit=async e=>{e.preventDefault();if(!sb)return alert("กรุณาตั้งค่า Supabase ก่อน");let f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(r.error)alert(r.error.message);else show()};
async function show(){$("#loginBox").style.display="none";$("#adminApp").style.display="block";editor("news")}
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
$$(".admin-toolbar button[data-tab]").forEach(b=>b.onclick=()=>editor(b.dataset.tab));
if(sb)sb.auth.getSession().then(({data})=>data.session&&show());
</script></body></html>
