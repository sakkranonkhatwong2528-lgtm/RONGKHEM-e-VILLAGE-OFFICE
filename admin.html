<style>
*{box-sizing:border-box}
:root{
--bg:#07111f;
--side:#081827;
--card:#0c2030;
--card2:#10293b;
--line:#24475b;
--text:#f5fbff;
--muted:#91a9b8;
--blue:#1685df;
--green:#16a065;
--red:#c64b57;
--orange:#d98a18;
}
body{
margin:0;
font-family:Prompt,sans-serif;
background:var(--bg);
color:var(--text)
}
header{
height:68px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#081827;
border-bottom:1px solid var(--line);
position:sticky;
top:0;
z-index:100
}
header h1{
font:500 21px Kanit;
margin:0
}
.top-actions{
display:flex;
gap:8px;
flex-wrap:wrap
}
.btn{
border:1px solid var(--line);
background:#112b3c;
color:white;
padding:9px 13px;
border-radius:8px;
cursor:pointer;
font-family:Prompt;
font-size:12px
}
.btn:hover{filter:brightness(1.15)}
.green{background:var(--green);border-color:var(--green)}
.red{background:var(--red);border-color:var(--red)}
.blue{background:var(--blue);border-color:var(--blue)}
.orange{background:var(--orange);border-color:var(--orange)}

.app{
display:grid;
grid-template-columns:255px 1fr;
min-height:calc(100vh - 68px)
}
aside{
background:var(--side);
border-right:1px solid var(--line);
padding:12px;
overflow:auto;
height:calc(100vh - 68px);
position:sticky;
top:68px
}
.menu-title{
font-size:10px;
color:#668292;
margin:15px 10px 6px;
text-transform:uppercase
}
.nav{
display:block;
width:100%;
text-align:left;
padding:10px 12px;
margin:2px 0;
border:0;
border-radius:8px;
background:transparent;
color:#d7e6ee;
font:400 12px Prompt;
cursor:pointer
}
.nav:hover,.nav.active{
background:#14364a;
color:white
}
main{
padding:22px;
max-width:1600px;
width:100%;
overflow:hidden
}
.page{display:none}
.page.active{display:block}
.title{
font:500 27px Kanit;
margin:0
}
.subtitle{
font-size:11px;
color:var(--muted);
margin:4px 0 18px
}
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}
.stat{
background:var(--card);
border:1px solid var(--line);
padding:16px;
border-radius:12px
}
.stat small{color:var(--muted)}
.stat b{
display:block;
font:600 30px Kanit;
margin-top:5px
}
.panel{
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:16px;
margin-bottom:15px
}
.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
margin-bottom:12px
}
.search{
max-width:300px;
margin:0!important
}
.formgrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}
label{
font-size:11px;
color:#b6cad5
}
input,textarea,select{
width:100%;
background:#06131e;
border:1px solid #2b5267;
border-radius:8px;
padding:10px;
color:white;
font:400 12px Prompt;
margin-top:5px
}
textarea{
min-height:90px;
resize:vertical
}
input[type=checkbox]{
width:auto;
transform:scale(1.2)
}
.wide{grid-column:1/-1}
.table-wrap{
overflow:auto;
border:1px solid #1d4052;
border-radius:10px
}
table{
border-collapse:collapse;
width:100%;
min-width:700px;
font-size:11px
}
th,td{
padding:10px;
text-align:left;
border-bottom:1px solid #193847
}
th{
background:#0c2637;
color:#9ed4e5
}
.actions{
display:flex;
gap:5px
}
.mini{
padding:6px 9px;
font-size:10px
}
.empty{
text-align:center;
padding:30px;
color:var(--muted)
}
.status{
font-size:11px;
padding:8px 12px;
border-radius:8px;
background:#0d2838;
margin-top:10px
}
.error{color:#ff9da7}
.success{color:#72edb0}
.info{color:#8ed8f0}
#formBox:empty{display:none}

@media(max-width:1000px){
.app{grid-template-columns:1fr}
aside{
height:auto;
position:relative;
top:0;
display:flex;
gap:4px;
overflow:auto;
white-space:nowrap;
padding:8px
}
.menu-title{display:none}
.nav{width:auto;min-width:max-content}
.grid{grid-template-columns:repeat(2,1fr)}
.formgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
header{height:auto;padding:10px}
header h1{font-size:16px}
.app{min-height:calc(100vh - 90px)}
main{padding:12px}
.grid,.formgrid{grid-template-columns:1fr}
.wide{grid-column:auto}
}
</style>
</head>

/* =====================================================
   RONGKHEM e-VILLAGE ADMIN
   ระบบหลังบ้านแบบ CRUD ทุกเมนู
===================================================== */

const LOCAL_PREFIX = "RONGKHEM_ADMIN_";

function esc(v){
return String(v ?? "").replace(/[&<>"']/g,function(c){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c];
});
}

function uid(){
return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);
}

/* =====================================================
   ใช้ Supabase เดิม ถ้ามี
===================================================== */

let db = null;

try{
if(typeof supabaseClient !== "undefined"){
db = supabaseClient;
}else{
const url =
window.RONGKHEM_CONFIG?.SUPABASE_URL ||
window.SUPABASE_URL || "";

const key =
window.RONGKHEM_CONFIG?.SUPABASE_KEY ||
window.RONGKHEM_CONFIG?.SUPABASE_ANON_KEY ||
window.SUPABASE_PUBLISHABLE_KEY ||
window.SUPABASE_KEY || "";

if(window.supabase && url && key &&
!url.includes("YOUR-PROJECT")){
db = window.supabase.createClient(url,key);
}
}
}catch(e){
console.error(e);
}

["description","รายละเอียด","textarea"],
["budget","งบประมาณ","number"],
["status","สถานะ","text"],
["start_date","วันที่เริ่ม","date"],
["end_date","วันที่สิ้นสุด","date"]
],
cols:["title","budget","status","start_date"]
},

statistics:{
title:"📈 สถิติหมู่บ้าน",
table:"statistics",
fields:[
["title","หัวข้อสถิติ","text"],
["value","จำนวน / ค่า","text"],
["unit","หน่วย","text"],
["updated","วันที่อัปเดต","date"],
["description","รายละเอียด","textarea"]
],
cols:["title","value","unit","updated"]
}

};

let currentPage = "dashboard";
let currentRows = {};

/* =====================================================
   NAVIGATION
===================================================== */

document.querySelectorAll(".nav").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));

currentPage=btn.dataset.page;

document.getElementById(currentPage).classList.add("active");

if(currentPage==="dashboard"){
loadDashboard();
}else{
renderPage(currentPage);
loadRecords(currentPage);
}
};
});

/* =====================================================
   STORAGE
===================================================== */

function localKey(key){
return LOCAL_PREFIX+key;
}

function localGet(key){
try{
const d=JSON.parse(localStorage.getItem(localKey(key))||"[]");
return Array.isArray(d)?d:[];
}catch(e){
return [];
}
}

function localSave(key,data){
localStorage.setItem(localKey(key),JSON.stringify(data));
}

/* =====================================================
   PAGE
===================================================== */

function renderPage(key){

const cfg=CONFIG[key];
const page=document.getElementById(key);

page.innerHTML=`
<h2 class="title">${cfg.title}</h2>
<p class="subtitle">
จัดการข้อมูล เพิ่ม แก้ไข ลบ และบันทึกข้อมูลจากระบบหลังบ้าน
</p>

<div class="panel">

<div class="toolbar">

<button class="btn green" onclick="openForm('${key}')">
➕ เพิ่มข้อมูล
</button>

<input
id="search_${key}"
class="search"
placeholder="🔎 ค้นหาข้อมูล..."
oninput="renderTable('${key}')"
>

<button class="btn" onclick="loadRecords('${key}')">
🔄 โหลดข้อมูล
</button>

</div>

<div id="formBox"></div>

<div class="table-wrap">
<table id="table_${key}"></table>
</div>

<div id="msg_${key}" class="status info">
กำลังโหลดข้อมูล...
</div>

</div>
`;

}

/* =====================================================
   LOAD RECORDS
===================================================== */

async function loadRecords(key){

const cfg=CONFIG[key];
setMsg(key,"กำลังโหลดข้อมูล...","info");

try{

let rows=[];

if(cfg.table && db){

const {data,error}=await db
.from(cfg.table)
.select("*")
.limit(1000);

if(error){
console.warn(cfg.table,error);
setMsg(
key,
"Supabase: "+error.message+
" — ระบบจะแสดงข้อมูลที่เก็บในเครื่องถ้ามี",
"error"
);

rows=localGet(cfg.table);

}else{
rows=data||[];
}

}else{

rows=localGet(cfg.local||key);

}

currentRows[key]=rows;

renderTable(key);

if(!rows.length){
setMsg(key,"ยังไม่มีข้อมูล สามารถกด ➕ เพิ่มข้อมูลได้","info");
}else{
setMsg(key,"พบข้อมูล "+rows.length+" รายการ","success");
}

}catch(error){

console.error(error);

currentRows[key]=localGet(cfg.local||cfg.table||key);

renderTable(key);

setMsg(key,"เกิดข้อผิดพลาด: "+error.message,"error");

}

}

/* =====================================================
   TABLE
===================================================== */

function renderTable(key){

const cfg=CONFIG[key];
const table=document.getElementById("table_"+key);

if(!table)return;

let rows=currentRows[key]||[];

const q=document.getElementById("search_"+key)?.value
.toLowerCase().trim();

if(q){

rows=rows.filter(row=>
Object.values(row).some(v=>
String(v??"").toLowerCase().includes(q)
)
);

}

if(!rows.length){

table.innerHTML=`
<tr>
<td class="empty" colspan="20">
ยังไม่มีข้อมูล
</td>
</tr>`;

return;
}

table.innerHTML=`

<thead>
<tr>
${cfg.cols.map(c=>`<th>${esc(c)}</th>`).join("")}
<th>จัดการ</th>
</tr>
</thead>

<tbody>

${rows.map(row=>`

<tr>

${cfg.cols.map(c=>{

let v=row[c];

if(v===true)v="✅";
if(v===false)v="❌";

return `<td>${esc(v??"-")}</td>`;

}).join("")}

<td>
<div class="actions">

<button
class="btn mini blue"
onclick="editRecord('${key}','${row.id}')">
✏️ แก้ไข
</button>

<button
class="btn mini red"
onclick="deleteRecord('${key}','${row.id}')">
🗑️ ลบ
</button>

</div>
</td>

</tr>

`).join("")}

</tbody>`;

}

/* =====================================================
   FORM
===================================================== */

function openForm(key,id=null){

const cfg=CONFIG[key];

const row=id
? (currentRows[key]||[]).find(x=>String(x.id)===String(id))
: null;

const box=document.getElementById("formBox");

box.innerHTML=`

<div class="panel" style="border-color:#37728d">

<h3 style="margin-top:0">
${id?"✏️ แก้ไข":"➕ เพิ่ม"} ${cfg.title}
</h3>

<div class="formgrid">

${cfg.fields.map(field=>fieldHTML(field,row)).join("")}

</div>

<div class="toolbar" style="margin-top:15px">

<button class="btn green"
onclick="saveRecord('${key}','${id||""}')">
💾 บันทึก
</button>

<button class="btn"
onclick="closeForm()">
✖ ยกเลิก
</button>

</div>

</div>`;

box.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

function fieldHTML(field,row){

const [name,label,type="text",options=""]=field;
const value=row?.[name]??"";

if(type==="textarea"){

return `
<label class="wide">
${label}
<textarea data-field="${name}">${esc(value)}</textarea>
</label>`;

}

if(type==="checkbox"){

return `
<label>
${label}<br>
<input
type="checkbox"
data-field="${name}"
${value===true?"checked":""}
>
</label>`;

}

if(type==="select"){

const opts=options.split("|");

return `
<label>
${label}
<select data-field="${name}">
<option value="">-- เลือก --</option>
${opts.map(o=>`
<option
value="${esc(o)}"
${value===o?"selected":""}
>${esc(o)}</option>
`).join("")}
</select>
</label>`;

}

return `
<label>
${label}
<input
type="${type}"
data-field="${name}"
value="${esc(value)}"
>
</label>`;

}

function closeForm(){
const box=document.getElementById("formBox");
if(box)box.innerHTML="";
}

function collectForm(){

const obj={};

document.querySelectorAll("#formBox [data-field]")
.forEach(el=>{

if(el.type==="checkbox"){
obj[el.dataset.field]=el.checked;

}else if(el.type==="number"){
obj[el.dataset.field]=
el.value===""?null:Number(el.value);

}else{
obj[el.dataset.field]=
el.value.trim();
}

});

return obj;
}

/* =====================================================
   SAVE
===================================================== */

async function saveRecord(key,id){

const cfg=CONFIG[key];

const values=collectForm();

if(!id){
values.id=uid();
values.created_at=new Date().toISOString();
}

values.updated_at=new Date().toISOString();

try{

let saved=false;

if(cfg.table && db){

if(id){

const {error}=await db
.from(cfg.table)
.update(values)
.eq("id",id);

if(!error)saved=true;
else console.warn(error);

}else{

const {error}=await db
.from(cfg.table)
.insert(values);

if(!error)saved=true;
else console.warn(error);

}

}

if(!saved){

const storageKey=cfg.local||cfg.table||key;

let rows=localGet(storageKey);

if(id){

const i=rows.findIndex(x=>String(x.id)===String(id));

if(i>=0){
rows[i]={...rows[i],...values,id};
}

}else{

rows.push(values);

}

localSave(storageKey,rows);

}

alert("✓ บันทึกข้อมูลเรียบร้อย");

closeForm();

await loadRecords(key);

}catch(error){

console.error(error);

alert("❌ ไม่สามารถบันทึกข้อมูลได้\n"+error.message);

}

}

/* =====================================================
   EDIT
===================================================== */

function editRecord(key,id){
openForm(key,id);
}

/* =====================================================
   DELETE
===================================================== */

async function deleteRecord(key,id){

if(!confirm("ยืนยันการลบข้อมูลนี้?")){
return;
}

const cfg=CONFIG[key];

try{

let deleted=false;

if(cfg.table && db){

const {error}=await db
.from(cfg.table)
.delete()
.eq("id",id);

if(!error){
deleted=true;
}else{
console.warn(error);
}

}

if(!deleted){

const storageKey=cfg.local||cfg.table||key;

const rows=localGet(storageKey)
.filter(x=>String(x.id)!==String(id));

localSave(storageKey,rows);

}

alert("✓ ลบข้อมูลเรียบร้อย");

await loadRecords(key);

}catch(error){

alert("❌ ลบไม่สำเร็จ\n"+error.message);

}

}

/* =====================================================
   MESSAGE
===================================================== */

function setMsg(key,msg,type="info"){

const el=document.getElementById("msg_"+key);

if(!el)return;

el.textContent=msg;

el.className="status "+type;

}

/* =====================================================
   DASHBOARD
===================================================== */

async function countTable(table){

if(!db)return 0;

try{

const {count,error}=await db
.from(table)
.select("*",{count:"exact",head:true});

if(error)return 0;

return count||0;

}catch(e){
return 0;
}

}

async function loadDashboard(){

const status=document.getElementById("systemStatus");

if(db){

status.textContent="🟢 เชื่อมต่อ Supabase แล้ว";
status.className="status success";

}else{

status.textContent=
"🟡 ไม่พบการเชื่อมต่อ Supabase — ระบบจะเก็บข้อมูลเมนูที่ยังไม่มีตารางไว้ในเครื่อง";

status.className="status info";

}

document.getElementById("countCitizens").textContent=
await countTable("citizens");

document.getElementById("countHouseholds").textContent=
await countTable("households");

document.getElementById("countNews").textContent=
await countTable("news");

document.getElementById("countActivities").textContent=
await countTable("activities");

}

/* =====================================================
   REFRESH
===================================================== */

function refreshCurrent(){

if(currentPage==="dashboard"){
loadDashboard();
}else{
loadRecords(currentPage);
}

}

/* =====================================================
   BACKUP
===================================================== */

async function exportData(){

const backup={
app:"RONGKHEM e-VILLAGE",
exported_at:new Date().toISOString(),
local:{},
supabase:{}
};

/* localStorage */

Object.keys(CONFIG).forEach(key=>{

const cfg=CONFIG[key];

const storageKey=cfg.local||cfg.table||key;

backup.local[storageKey]=localGet(storageKey);

});

/* Supabase */

if(db){

const tables=[
"citizens",
"households",
"leaders",
"news",
"activities",
"incidents",
"services",
"projects",
"environment",
"wetland",
"statistics",
"rice_members",
"rice_funerals",
"rice_stock",
"notifications"
];

for(const table of tables){

try{

const {data,error}=await db
.from(table)
.select("*");

if(!error){
backup.supabase[table]=data||[];
}

}catch(e){}

}

}

const blob=new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=
"rongkhem-backup-"+
new Date().toISOString().slice(0,10)+
".json";

a.click();

URL.revokeObjectURL(url);

}

/* =====================================================
   IMPORT
===================================================== */

document.getElementById("importFile")
.addEventListener("change",async function(e){

const file=e.target.files[0];

if(!file)return;

if(!confirm("ต้องการนำเข้าข้อมูลสำรองหรือไม่?")){
e.target.value="";
return;
}

try{

const text=await file.text();

const backup=JSON.parse(text);

/* Local */

if(backup.local){

Object.entries(backup.local)
.forEach(([key,data])=>{

if(Array.isArray(data)){
localSave(key,data);
}

});

}

/* Supabase */

if(db && backup.supabase){

for(const [table,rows] of Object.entries(backup.supabase)){

if(!Array.isArray(rows)||!rows.length)continue;

try{

await db
.from(table)
.upsert(rows,{onConflict:"id"});

}catch(err){
console.warn(table,err);
}

}

}

alert("✓ นำเข้าข้อมูลเรียบร้อย");

refreshCurrent();

}catch(err){

console.error(err);

alert("❌ ไฟล์สำรองข้อมูลไม่ถูกต้อง");

}

e.target.value="";

});

/* =====================================================
   START
===================================================== */

loadDashboard();

</script>
