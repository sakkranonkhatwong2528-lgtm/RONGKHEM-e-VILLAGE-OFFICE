/* =========================================================

function esc(value){

    return String(
        value ?? ""
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function setStatus(

}


/* =========================================================
   MERGE DATA
========================================================= */

function mergeData(
    defaultData,
    savedData
){

    if(
        typeof defaultData !== "object" ||
        defaultData === null
    ){

        return savedData ??
        defaultData;

    }


    if(
        Array.isArray(defaultData)
    ){

        return Array.isArray(savedData)
            ? savedData
            : defaultData;

    }


    const result = {
        ...defaultData
    };


    if(
        savedData &&
        typeof savedData === "object"
    ){

        Object.keys(savedData)
        .forEach(key=>{

            if(

                typeof savedData[key] ===
                "object"

                &&

                savedData[key] !== null

                &&

                !Array.isArray(
                    savedData[key]
                )

                &&

                typeof defaultData[key] ===
                "object"

                &&

                defaultData[key] !== null

                &&

                !Array.isArray(
                    defaultData[key]
                )

            ){

                result[key] =
                mergeData(
                    defaultData[key],
                    savedData[key]
                );

            }

            else{

                result[key] =
                savedData[key];

            }

        });

    }


    return result;

}

/* =========================================================
   UPLOAD IMAGE
   SUPABASE STORAGE
========================================================= */

async function uploadImage(
    file
){

    if(!file){

        return "";

    }


    try{

        /* ตรวจชนิดไฟล์ */

        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            throw new Error(
                "รองรับเฉพาะไฟล์รูปภาพเท่านั้น"
            );

        }


        setStatus(
            "กำลังตรวจสอบ Storage Bucket...",
            "loading"
        );


        /*
        ตรวจสอบ Bucket จริง
        */

        const {
            data:bucket,
            error:bucketError
        } =
        await sb

        .storage

        .getBucket(
            STORAGE_BUCKET
        );


        if(
            bucketError ||
            !bucket
        ){

            throw new Error(

                "ไม่พบ Storage Bucket '" +
                STORAGE_BUCKET +
                "' ใน Supabase"

            );

        }


        /*
        ตรวจขนาดไฟล์
        */

        if(
            file.size >
            50 * 1024 * 1024
        ){

            throw new Error(
                "ไฟล์มีขนาดเกิน 50 MB"
            );

        }


        /*
        นามสกุล
        */

        let extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


        /*
        ชื่อไฟล์ใหม่
        */

        const fileName =

            "images/" +

            Date.now() +

            "-" +

            Math.random()
            .toString(36)
            .substring(
                2,
                10
            ) +

            "." +

            extension;


        setStatus(
            "กำลังอัปโหลดรูปภาพ...",
            "loading"
        );


        /*
        UPLOAD
        */

        const {
            data:uploadData,
            error:uploadError
        } =

        await sb

        .storage

        .from(
            STORAGE_BUCKET
        )

        .upload(

            fileName,

            file,

            {

                cacheControl:
                "3600",

                upsert:
                false,

                contentType:
                file.type

            }

        );


        if(
            uploadError
        ){

            throw uploadError;

        }


        /*
        PUBLIC URL
        */

        const {
            data:publicData
        } =

        sb

        .storage

        .from(
            STORAGE_BUCKET
        )

        .getPublicUrl(
            uploadData.path
        );


        if(
            !publicData ||
            !publicData.publicUrl
        ){

            throw new Error(
                "สร้าง URL รูปภาพไม่สำเร็จ"
            );

        }


        setStatus(
            "✓ อัปโหลดรูปภาพเรียบร้อย",
            "ok"
        );


        return (
            publicData.publicUrl
        );

    }

    catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );


        setStatus(

            "❌ อัปโหลดรูปไม่สำเร็จ: " +
            error.message,

            "error"

        );


        alert(

            "อัปโหลดรูปไม่สำเร็จ\n\n" +

            error.message +

            "\n\nBucket ที่ระบบใช้งาน: " +

            STORAGE_BUCKET

        );


        return "";

    }

}

                <input

                        restoreBackup(this)
                    "

                >

/* =========================================================
   DOWNLOAD BACKUP
========================================================= */

function downloadBackup(){

    const blob =
    new Blob(

        [

            JSON.stringify(
                D,
                null,
                2
            )

        ],

        {
            type:
            "application/json"
        }

    );


    const url =
    URL.createObjectURL(
        blob
    );


    const a =
    document.createElement(
        "a"
    );


    a.href =
    url;


    a.download =
    "rongkhem-e-village-backup.json";


    a.click();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   RESTORE
========================================================= */

function restoreBackup(
    input
){

    const file =
    input.files[0];


    if(!file){

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    async function(){

        try{

            const imported =
            JSON.parse(
                reader.result
            );


            D =
            mergeData(
                DEFAULTS,
                imported
            );


            const success =
            await saveData(
                false
            );


            if(success){

                alert(
                    "กู้คืนข้อมูลเรียบร้อย"
                );


                openPage(
                    "dashboard"
                );

            }

        }

        catch(error){

            alert(
                "ไฟล์ Backup ไม่ถูกต้อง"
            );

        }

    };


    reader.readAsText(
        file
    );

}
