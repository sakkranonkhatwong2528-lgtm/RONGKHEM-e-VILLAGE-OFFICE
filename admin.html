<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONGKHEM e-VILLAGE ADMIN</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Noto Sans Thai',sans-serif}input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.65rem}label{display:block;font-weight:600;margin-top:.75rem}.card{background:#fff;border-radius:1rem;padding:1.25rem;box-shadow:0 1px 4px #0001}.btn{padding:.6rem 1rem;border-radius:.6rem;font-weight:600}.primary{background:#001b3d;color:#fff}.danger{background:#b91c1c;color:#fff}.muted{background:#e5e7eb}</style></head><body class="bg-slate-100">
<header class="bg-[#001b3d] text-white p-5 flex justify-between"><div><b>RONGKHEM e-VILLAGE ADMIN</b><div class="text-sm opacity-70">ระบบจัดการข้อมูลเว็บไซต์</div></div><a href="index.html" class="bg-white text-[#001b3d] px-4 py-2 rounded-lg">ดูหน้าเว็บไซต์</a></header>
<div class="max-w-7xl mx-auto p-5 grid lg:grid-cols-[260px_1fr] gap-5"><aside class="card h-fit"><h3 class="font-bold mb-3">เมนูจัดการ</h3><div id="menu" class="space-y-1"></div></aside><main id="app"></main></div>
<script>
const KEY="RONGKHEM_SITE_DATA"; const DEFAULT={leader:{name:"นายศักรนนทน์ ขัติย์วงค์",role:"ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6",address:"ต.จำป่าหวาย อ.เมืองพะเยา จ.พะเยา",quote:"พร้อมดูแลชุมชน ด้วยระบบดิจิทัล",phone:"080-1202529"},assistants:[{name:"น.ส.สุภาพร วังมูล",role:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายปกครอง",detail:"รับผิดชอบงานด้านทะเบียนและปกครองส่วนท้องถิ่น",phone:"098-9800089",image:""},{name:"นายจักร์กวัส ประพลรัตนัง",role:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายรักษาความสงบ",detail:"ดูแลความเรียบร้อยและความปลอดภัยภายในหมู่บ้าน",phone:"085-1399849",image:""}],services:["ข้อมูลหมู่บ้าน","ข้อมูลครัวเรือน","คณะกรรมการหมู่บ้าน","ข่าวสาร/ประกาศ","ยื่นคำร้องออนไลน์","อสม.","สุขภาพชุมชน","ผู้สูงอายุ","กลุ่มเปราะบาง","สิ่งแวดล้อม / PM2.5","แหล่งซับน้ำจำ","การเกษตร","ชรบ. / ความปลอดภัย","ร้านค้าในชุมชน","แผนที่หมู่บ้าน","ติดต่อผู้ใหญ่บ้าน","แจ้งเหตุฉุกเฉิน","สถานที่ท่องเที่ยว"],sections:{},stats:{households:"350",population:"1,247",area:"2.15"},news:[],announcements:[],activity:{title:"จิตอาสาพัฒนาหมู่บ้าน",detail:"ร่วมแรงร่วมใจ ทำความดีเพื่อชุมชน",image:""}};
let D=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(DEFAULT); if(!D.sections)D.sections={}; const save=()=>{localStorage.setItem(KEY,JSON.stringify(D));alert("บันทึกเรียบร้อย")}; const file=(input,cb)=>{let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}; const app=document.getElementById("app");
const menus=["ข้อมูลผู้ใหญ่บ้าน","ทีมผู้ช่วยผู้ใหญ่บ้าน","ข่าวประชาสัมพันธ์","กิจกรรมเด่น","ประกาศสำคัญ","สถิติหมู่บ้าน",...D.services,"สำรอง/กู้คืนข้อมูล"];
menu.innerHTML=menus.map(x=>`<button class="w-full text-left p-2 rounded hover:bg-slate-100" onclick="openPage(${JSON.stringify(x)})">${x}</button>`).join("");
function openPage(name){if(name==="ข้อมูลผู้ใหญ่บ้าน")return leader();if(name==="ทีมผู้ช่วยผู้ใหญ่บ้าน")return assistants();if(name==="ข่าวประชาสัมพันธ์")return listEditor("ข่าวประชาสัมพันธ์","news");if(name==="กิจกรรมเด่น")return activity();if(name==="ประกาศสำคัญ")return listEditor("ประกาศสำคัญ","announcements");if(name==="สถิติหมู่บ้าน")return stats();if(name==="สำรอง/กู้คืนข้อมูล")return backup();section(name)}
function leader(){let x=D.leader;app.innerHTML=`<div class="card"><h2 class="text-2xl font-bold">ข้อมูลผู้ใหญ่บ้าน</h2><label>ชื่อ<input id="n" value="${x.name}"></label><label>ตำแหน่ง<input id="r" value="${x.role}"></label><label>ที่อยู่<input id="a" value="${x.address}"></label><label>คำพูด<input id="q" value="${x.quote}"></label><label>โทรศัพท์<input id="p" value="${x.phone}"></label><button class="btn primary mt-5" onclick="D.leader={name:n.value,role:r.value,address:a.value,quote:q.value,phone:p.value};save()">บันทึก</button></div>`}
function assistants(){app.innerHTML=`<div class="card"><div class="flex justify-between"><h2 class="text-2xl font-bold">ทีมผู้ช่วยผู้ใหญ่บ้าน</h2><button class="btn primary" onclick="D.assistants.push({name:'',role:'',detail:'',phone:'',image:''});assistants()">+ เพิ่ม</button></div><div id="alist"></div></div>`;document.getElementById("alist").innerHTML=D.assistants.map((a,i)=>`<div class="border rounded-xl p-4 mt-4"><label>ชื่อ<input id="an${i}" value="${a.name}"></label><label>ตำแหน่ง<input id="ar${i}" value="${a.role}"></label><label>รายละเอียด<textarea id="ad${i}">${a.detail}</textarea></label><label>โทรศัพท์<input id="ap${i}" value="${a.phone}"></label><label>รูปภาพ<input type="file" onchange="file(this,v=>D.assistants[${i}].image=v)"></label><div class="flex gap-2 mt-3"><button class="btn primary" onclick="D.assistants[${i}]={...D.assistants[${i}],name:an${i}.value,role:ar${i}.value,detail:ad${i}.value,phone:ap${i}.value};save()">บันทึก</button><button class="btn danger" onclick="D.assistants.splice(${i},1);assistants()">ลบ</button></div></div>`).join("")}
function listEditor(title,key){app.innerHTML=`<div class="card"><h2 class="text-2xl font-bold">${title}</h2><div id="rows"></div><button class="btn primary mt-4" onclick="D.${key}.push({title:'',detail:'',image:''});listEditor(${JSON.stringify(title)},${JSON.stringify(key)})">+ เพิ่มรายการ</button></div>`;rows.innerHTML=(D[key]||[]).map((x,i)=>`<div class="border rounded-xl p-4 mt-4"><label>หัวข้อ<input id="t${i}" value="${x.title||''}"></label><label>รายละเอียด<textarea id="d${i}">${x.detail||''}</textarea></label><label>อัปโหลดรูปภาพ<input type="file" onchange="file(this,v=>D.${key}[${i}].image=v)"></label><button class="btn primary mt-3" onclick="D.${key}[${i}]={...D.${key}[${i}],title:t${i}.value,detail:d${i}.value};save()">บันทึก</button><button class="btn danger mt-3" onclick="D.${key}.splice(${i},1);listEditor(${JSON.stringify(title)},${JSON.stringify(key)})">ลบ</button></div>`).join("")}
function activity(){let x=D.activity;app.innerHTML=`<div class="card"><h2 class="text-2xl font-bold">กิจกรรมเด่น</h2><label>หัวข้อ<input id="t" value="${x.title}"></label><label>รายละเอียด<textarea id="d">${x.detail}</textarea></label><label>อัปโหลดรูปภาพ<input type="file" onchange="file(this,v=>D.activity.image=v)"></label><button class="btn primary mt-4" onclick="D.activity={...D.activity,title:t.value,detail:d.value};save()">บันทึก</button></div>`}
function stats(){let x=D.stats;app.innerHTML=`<div class="card"><h2 class="text-2xl font-bold">สถิติหมู่บ้าน</h2><label>ครัวเรือนทั้งหมด<input id="h" value="${x.households}"></label><label>ประชากรทั้งหมด<input id="p" value="${x.population}"></label><label>พื้นที่หมู่บ้าน<input id="a" value="${x.area}"></label><button class="btn primary mt-4" onclick="D.stats={households:h.value,population:p.value,area:a.value};save()">บันทึก</button></div>`}
function section(name){let x=D.sections[name]||{title:name,content:'',image:''};app.innerHTML=`<div class="card"><h2 class="text-2xl font-bold">${name}</h2><p class="text-gray-500">แก้ไขข้อมูล เพิ่มรายละเอียด และอัปโหลดรูปภาพได้</p><label>หัวข้อ<input id="t" value="${x.title||name}"></label><label>รายละเอียด<textarea id="c" rows="10">${x.content||''}</textarea></label><label>อัปโหลดรูปภาพ<input type="file" onchange="file(this,v=>D.sections[${JSON.stringify(name)}].image=v)"></label><button class="btn primary mt-4" onclick="D.sections[${JSON.stringify(name)}]={...D.sections[${JSON.stringify(name)}],title:t.value,content:c.value};save()">บันทึก</button><button class="btn danger mt-4" onclick="delete D.sections[${JSON.stringify(name)}];save()">ลบข้อมูล</button></div>`}
function backup(){app.innerHTML=`<div class="card"><h2 class="text-2xl font-bold">สำรอง / กู้คืนข้อมูล</h2><button class="btn primary" onclick="let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rongkhem-backup.json';a.click()">ดาวน์โหลดสำรองข้อมูล</button><label class="mt-4">กู้คืนไฟล์ JSON<input type="file" accept="application/json" onchange="file(this,v=>{D=JSON.parse(v);save();location.reload()})"></label><button class="btn danger mt-4" onclick="if(confirm('ล้างข้อมูลทั้งหมด?')){localStorage.removeItem(KEY);location.reload()}">รีเซ็ตข้อมูล</button></div>`}
openPage("ข้อมูลผู้ใหญ่บ้าน");
</script></body></html>
