/* =====================================================
   UTILITIES
===================================================== */

function merge(a,b){

for(const k in b){

if(a[k]===undefined){

a[k]=structuredClone(b[k]);

}

else if(
b[k] &&
typeof b[k]==="object" &&
!Array.isArray(b[k]) &&
a[k] &&
typeof a[k]==="object"
){

merge(a[k],b[k]);

}

}

return a;

}

function esc(v){

return String(v??"").replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

}

function toast(t){

const x=document.querySelector("#toast");

x.textContent=t;

x.classList.remove("hidden");

clearTimeout(window.tt);

window.tt=setTimeout(
()=>x.classList.add("hidden"),
2500
);

}


/* =====================================================
   SUPABASE LOAD
===================================================== */

async function loadData(){

try{

const {data,error}=await supabaseClient
.from("website_data")
.select("data_value")
.eq("data_key",DATA_KEY)
.maybeSingle();

if(error) throw error;

if(data && data.data_value){

D=merge(
data.data_value,
structuredClone(defaultData)
);

}else{

D=structuredClone(defaultData);

await save(false);

}

}catch(error){

console.error(error);

toast("⚠️ โหลดข้อมูลจาก Supabase ไม่สำเร็จ");

}

}


/* =====================================================
   SUPABASE SAVE
===================================================== */

async function save(msg=true){

try{

const {error}=await supabaseClient
.from("website_data")
.upsert(
{
data_key:DATA_KEY,
data_value:D,
updated_at:new Date().toISOString()
},
{
onConflict:"data_key"
}
);

if(error) throw error;

if(msg){

toast("✓ บันทึกข้อมูลเรียบร้อยแล้ว");

}

}catch(error){

console.error(error);

alert(
"บันทึกไม่สำเร็จ: "+
error.message
);

}

}


/* =====================================================
   UPLOAD IMAGE TO SUPABASE STORAGE
===================================================== */

async function uploadImage(file){

if(!file) return "";

try{

const ext=file.name.split(".").pop();

const fileName=
"rongkhem/"+
Date.now()+
"-"+
Math.random()
.toString(36)
.substring(2)+
"."+
ext;

const {error}=await supabaseClient
.storage
.from("village-images")
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(error) throw error;

const {data}=supabaseClient
.storage
.from("village-images")
.getPublicUrl(fileName);

return data.publicUrl;

}catch(error){

console.error(error);

alert(
"อัปโหลดรูปไม่สำเร็จ: "+
error.message
);

return "";

}

}


/* =====================================================
   DELETE IMAGE
===================================================== */

async function deleteImage(url){

if(!url) return;

try{

const marker="/storage/v1/object/public/village-images/";

const index=url.indexOf(marker);

if(index===-1) return;

const path=url.substring(
index+marker.length
);

await supabaseClient
.storage
.from("village-images")
.remove([path]);

}catch(error){

console.error(error);

}

}


/* =====================================================
   READ FILE
===================================================== */

async function readFile(el,callback){

const file=el.files?.[0];

if(!file) return;

toast("กำลังอัปโหลดรูปภาพ...");

const imageUrl=
await uploadImage(file);

if(imageUrl){

await callback(imageUrl);

toast("✓ อัปโหลดรูปสำเร็จ");

}

}

`d_${key}_${i}`
).value;

`dt_${key}_${i}`
);

`l_${key}_${i}`
);

`p_${key}_${i}`

/* =====================================================
   MOVE
===================================================== */

async function move(key,i,d){

const j=i+d;

if(
j<0 ||
j>=D[key].length
) return;

[D[key][i],D[key][j]]
=
[D[key][j],D[key][i]];

await save(false);

if(
[
"assistants",
"committee",
"advisors",
"sao",
"healthVolunteers"
].includes(key)
){

personList(key);

}else{

contentList(key);

}

}

function backupPage(){

"💾 สำรอง / กู้คืนข้อมูล",

`

>

</button>

<label class="btn light">

เลือกไฟล์กู้คืน

<input
type="file"

style="display:none"
onchange="importData(this)"
>

</label>

`

);

function exportData(){

const blob=new Blob(

[
JSON.stringify(
D,
null,
2
)
],

{
type:"application/json"
}

);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"rongkhem-e-village-backup.json";

a.click();

URL.revokeObjectURL(url);

}

function importData(el){

const file=el.files?.[0];

if(!file) return;

const reader=new FileReader();

reader.onload=async()=>{

try{

const imported=
JSON.parse(reader.result);

D=merge(
imported,
structuredClone(defaultData)
);

await save();

toast("✓ กู้คืนข้อมูลเรียบร้อยแล้ว");

openPage("dashboard");

}catch(error){

alert("ไฟล์ข้อมูลไม่ถูกต้อง");

}

};

reader.readAsText(file);

}

/* =====================================================

===================================================== */

(async function(){

const loggedIn=
localStorage.getItem(
"rongkhemAdminLoggedIn"
)==="true"

||

if(!loggedIn){

location.href="login.html";

}

);
