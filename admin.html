<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ระบบหลังบ้าน - บ้านร่องเข็ม</title>

<style>

body{
font-family:Sarabun,Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}

.admin-wrapper{
max-width:1100px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:#113a72;
color:white;
padding:15px 20px;
border-radius:8px;
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:6px;
font-weight:bold;
}

input,
textarea,
select{
width:100%;
box-sizing:border-box;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

.btn-group{
display:flex;
gap:10px;
margin-top:15px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-save{
background:#28a745;
color:white;
}

.btn-reset{
background:#6c757d;
color:white;
}

.btn-logout,
.btn-delete{
background:#dc3545;
color:white;
}

.btn-edit{
background:#ffc107;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:10px;
}

th{
background:#f1f3f5;
}

.img-preview{
width:70px;
height:70px;
object-fit:cover;
border-radius:5px;
}

</style>

</head>

<body>

<div class="admin-wrapper">

<div class="top-bar">

<div>
👤 ผู้ดูแลระบบ:
<strong id="adminEmail">
กำลังตรวจสอบ...
</strong>
</div>

<button
id="logoutBtn"
class="btn-logout">

🚪 ออกจากระบบ

</button>

</div>


<h2>
⚙️ ระบบจัดการข้อมูลหมู่บ้าน
</h2>


<div class="form-group">

<label>
เลือกเมนู
</label>

<select id="menuSelect">

<option value="news">
ข่าวสารประชาสัมพันธ์
</option>

<option value="complaint">
เรื่องร้องเรียน
</option>

<option value="elderly">
ข้อมูลผู้สูงอายุ
</option>

<option value="vulnerable">
กลุ่มเปราะบาง
</option>

<option value="project">
โครงการหมู่บ้าน
</option>

<option value="incident">
เหตุการณ์ / แจ้งเตือน
</option>

<option value="activity">
กิจกรรม
</option>

</select>

</div>

<hr>


<h3 id="formTitle">

➕ เพิ่มข้อมูลใหม่

</h3>


<form id="crudForm">

<input
type="hidden"
id="recordId">


<input
type="hidden"
id="currentImageUrl">


<div class="form-group">

<label>
หัวข้อ
</label>

<input
type="text"
id="titleInput"
required
placeholder="ระบุหัวข้อ">

</div>


<div class="form-group">

<label>
รายละเอียด
</label>

<textarea
id="detailInput"
rows="5"
placeholder="รายละเอียดข้อมูล">
</textarea>

</div>


<div class="form-group">

<label>
รูปภาพ
</label>

<input
type="file"
id="imageInput"
accept="image/*">

<div
id="imagePreviewContainer"
style="display:none;margin-top:10px">

<img
id="imagePreview"
class="img-preview">

</div>

</div>


<div class="btn-group">

<button
type="submit"
id="saveBtn"
class="btn-save">

💾 บันทึกข้อมูล

</button>


<button
type="button"
id="resetBtn"
class="btn-reset">

↩ ยกเลิก

</button>

</div>

</form>


<hr>


<h3>
📋 รายการข้อมูล
</h3>


<table>

<thead>

<tr>

<th>ID</th>

<th>รูป</th>

<th>หัวข้อ</th>

<th>รายละเอียด</th>

<th>จัดการ</th>

</tr>

</thead>


<tbody id="tableBody">

<tr>

<td
colspan="5"
style="text-align:center">

กำลังโหลด...

</td>

</tr>

</tbody>

</table>

</div>


<script
type="module"
src="manage-admin.js">
</script>

</body>

</html>
