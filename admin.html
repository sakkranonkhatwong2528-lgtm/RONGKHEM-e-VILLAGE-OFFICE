/* =========================================================

function esc(v){
  return String(v ?? "")
  .replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function toast(text){

  const x =
  document.getElementById("toast");

  x.textContent = text;

  x.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer =
  setTimeout(
    ()=>x.classList.add("hidden"),
    2500
  );

}

function merge(a,b){

  for(const k in b){

    if(a[k] === undefined){

      a[k] = b[k];

    }else if(

      b[k] &&
      typeof b[k] === "object" &&
      !Array.isArray(b[k]) &&
      a[k] &&
      typeof a[k] === "object"

    ){

      merge(a[k],b[k]);

    }

  }

  return a;

}

/* =========================================================
   LOAD FROM SUPABASE
========================================================= */

async function loadData(){

  const {data,error} =
  await supabase
  .from(TABLE)
  .select("content")
  .eq("content_key",CONTENT_KEY)
  .maybeSingle();

  if(error){

    console.error(error);

    toast(
      "ไม่สามารถโหลดข้อมูล Supabase"
    );

    return;

  }

  if(data && data.content){

    D =
    merge(
      data.content,
      structuredClone(defaultData)
    );

  }else{

    D =
    structuredClone(defaultData);

    await saveData(false);

  }

}

/* =========================================================
   SAVE TO SUPABASE
========================================================= */

async function saveData(showMessage=true){

  const {error} =
  await supabase
  .from(TABLE)
  .upsert({

    content_key:CONTENT_KEY,

    content:D,

    updated_at:
    new Date().toISOString()

  },{
    onConflict:"content_key"
  });

  if(error){

    console.error(error);

    alert(
      "บันทึกไม่สำเร็จ: " +
      error.message
    );

    return false;

  }

  if(showMessage){

    toast(
      "✓ บันทึกข้อมูลเรียบร้อยแล้ว"
    );

  }

  return true;

}

/* =========================================================
   IMAGE UPLOAD TO SUPABASE STORAGE
========================================================= */

async function uploadImage(file){

  if(!file) return "";

  const ext =
  file.name
  .split(".")
  .pop();

  const fileName =
  "images/" +
  Date.now() +
  "-" +
  Math.random()
  .toString(36)
  .slice(2) +
  "." +
  ext;

  toast("กำลังอัปโหลดรูปภาพ...");

  const {error} =
  await supabase
  .storage
  .from(STORAGE_BUCKET)
  .upload(
    fileName,
    file,
    {
      upsert:false,
      cacheControl:"3600"
    }
  );

  if(error){

    console.error(error);

    alert(
      "อัปโหลดรูปไม่สำเร็จ: " +
      error.message
    );

    return "";

  }

  const {data} =
  supabase
  .storage
  .from(STORAGE_BUCKET)
  .getPublicUrl(fileName);

  return data.publicUrl;

}

async function handleImageUpload(
  input,
  callback
){

  const file =
  input.files?.[0];

  if(!file) return;

  const url =
  await uploadImage(file);

  if(url){

    await callback(url);

    await saveData(false);

    toast(
      "✓ อัปโหลดรูปภาพสำเร็จ"
    );

    openPage(current);

  }

}

){

    j>=D[key].length

  [
    D[key][i],
    D[key][j]
  ] =
  [
    D[key][j],
    D[key][i]
  ];

  await saveData(false);

  if(
    [
      "assistants",
      "committee",
      "advisors",
      "sao",
      "healthVolunteers"
    ]
    .includes(key)
  ){

    personList(key);

  }else{

    contentList(key);

  }

}

function exportData(){

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(

    new Blob(

      [
        JSON.stringify(
          D,
          null,
          2
        )
      ],

      {
        type:"application/json"
      }

    )

  );

  a.download =
  "rongkhem-e-village-backup.json";

  a.click();

}

function importData(el){

  const file =
  el.files[0];

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload =
  async ()=>{

    try{

      D =
      merge(

        JSON.parse(reader.result),

        structuredClone(defaultData)

      );

      const ok =
      await saveData(false);

      if(ok){

        toast(
          "✓ กู้คืนข้อมูลสำเร็จ"
        );

        openPage("dashboard");

      }

    }catch(e){

      alert(
        "ไฟล์ไม่ถูกต้อง"
      );

    }

  };

  reader.readAsText(file);

}

async function resetData(){

  if(
    !confirm(
      "ต้องการรีเซ็ตข้อมูลทั้งหมดหรือไม่?"
    )
  ) return;

  D =
  structuredClone(defaultData);

  await saveData();

  openPage("dashboard");

}
