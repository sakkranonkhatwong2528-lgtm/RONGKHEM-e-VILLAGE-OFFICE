<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RONGKHEM e-VILLAGE | ระบบหลังบ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#082342;--blue:#164d84;--gold:#e8ad2e;--bg:#eef3f8;--line:#dce4ed}
*{box-sizing:border-box}body{margin:0;font-family:Kanit,sans-serif;background:var(--bg);color:#182432}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#061a32,#123f70);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
header h1{margin:0;font-size:21px}header p{margin:2px 0 0;font-size:13px;opacity:.75}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.primary{background:var(--gold);color:#16233a}.dark{background:#fff;color:var(--navy)}.danger{background:#c62828;color:#fff}.light{background:#e8eef5;color:#15263b}.success{background:#087a4b;color:#fff}
.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border-radius:18px;box-shadow:0 5px 24px #17345a14;padding:20px}.login-card{width:min(420px,100%)}.login-card h2{margin-top:0}
label{display:block;font-weight:500;margin:13px 0 5px}input,textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}textarea{min-height:100px}
.shell{display:grid;grid-template-columns:280px 1fr;max-width:1500px;margin:auto;gap:18px;padding:18px}.sidebar{background:#fff;border-radius:18px;padding:12px;height:fit-content;position:sticky;top:92px}.menu-title{font-size:12px;color:#718093;padding:10px 12px 4px}.menu{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}.menu:hover,.menu.active{background:var(--navy);color:#fff}
.main{min-width:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border-radius:16px;padding:18px}.stat b{display:block;font-size:28px;color:var(--navy)}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.item{border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:14px;background:#fff}.item-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.preview{width:150px;height:105px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:8px}.note{color:#718093;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#102b4b;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 25px #0003;z-index:50}
.small{font-size:12px;color:#68788b}.danger-link{color:#c62828}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static}.grid{grid-template-columns:repeat(2,1fr)}.row,.row3{grid-template-columns:1fr}}@media(max-width:560px){header{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>🏛️ RONGKHEM e-VILLAGE ADMIN</h1><p>ระบบจัดการเว็บไซต์บ้านร่องเข็ม หมู่ที่ 6</p></div>
  <div class="top-actions">
    <a class="btn dark" href="index.html">ดูหน้าเว็บไซต์</a>
    <button class="btn danger hidden" id="logoutBtn">ออกจากระบบ</button>
  </div>
</header>

<section class="login" id="loginBox">
 <div class="login-card">
  <h2>เข้าสู่ระบบผู้ดูแล</h2>
  <p class="note">เข้าสู่ระบบเพื่อแก้ไขข้อมูลหน้าเว็บไซต์</p>
  <label>ชื่อผู้ใช้<input id="user" value="sakkranon"></label>
  <label>รหัสผ่าน<input id="pass" type="password" value=""></label>
  <button class="btn primary" style="width:100%;margin-top:18px" id="loginBtn">เข้าสู่ระบบ</button>
  <p class="small">เปลี่ยนบัญชีเริ่มต้นได้ในส่วนตั้งค่าระบบ</p>
 </div>
</section>

<section class="shell hidden" id="appShell">
 <aside class="sidebar"><div id="menuBox"></div></aside>
 <main class="main" id="main"></main>
</section>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='RONGKHEM_EVILLAGE_ADMIN_DATA_V1', LOGIN='RONGKHEM_EVILLAGE_ADMIN_LOGIN';
const defaultData={
 settings:{siteName:'RONGKHEM e-VILLAGE',username:'sakkranon',password:'23122528'},
 leader:{name:'นายศักรนนทน์ ขัติย์วงศ์',role:'ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6',phone:'',address:'ต.จำป่าหวาย อ.เมืองพะเยา จ.พะเยา',quote:'พร้อมดูแลชุมชน ด้วยระบบดิจิทัล',image:''},
 assistants:[],committee:[],advisors:[],sao:[],healthVolunteers:[],
 news:[],activities:[],announcements:[],
 tourism:[],temples:[],maps:[],subnamjam:[],shops:[],
 pm25:{title:'ค่าฝุ่น PM2.5',detail:'ติดตามสถานการณ์คุณภาพอากาศของชุมชน',value:'',level:'',updated:''},
 weather:{title:'พยากรณ์อากาศ',detail:'ข้อมูลสภาพอากาศ',temperature:'',description:'',updated:''},
 calendar:[],ai:{title:'RONGKHEM AI',welcome:'สวัสดีครับ ผมคือ RONGKHEM AI ผู้ช่วยข้อมูลหมู่บ้าน'},
 stats:{households:'350',population:'1,247',area:'2.15',updated:''}
};
let D=load(), current='dashboard';
const menus=[
 ['dashboard','📊 ภาพรวมระบบ'],
 ['people','👥 บุคลากรและคณะทำงาน'],
 ['leader','👨‍💼 ผู้ใหญ่บ้าน'],
 ['assistants','🤝 ผู้ช่วยผู้ใหญ่บ้าน'],
 ['committee','🏛️ คณะกรรมการหมู่บ้าน'],
 ['advisors','🎓 คณะที่ปรึกษา / ผู้ทรงคุณวุฒิ'],
 ['sao','🗳️ ส.อบต.'],
 ['healthVolunteers','❤️ อสม.'],
 ['content','📰 ข่าวและกิจกรรม'],
 ['news','📢 ข่าวประชาสัมพันธ์'],
 ['activities','📅 กิจกรรมเด่น'],
 ['announcements','📣 ประกาศสำคัญ'],
 ['places','📍 สถานที่และแผนที่'],
 ['tourism','🌿 แหล่งท่องเที่ยว'],
 ['temples','🛕 วัดและสถานที่สำคัญ'],
 ['maps','🗺️ แผนที่หมู่บ้าน'],
 ['subnamjam','💧 แหล่งซับน้ำจำ'],
 ['shops','🏪 ร้านค้าในชุมชน'],
 ['environment','🌦️ สิ่งแวดล้อมและปฏิทิน'],
 ['pm25','🌫️ PM2.5'],
 ['weather','☁️ พยากรณ์อากาศ'],
 ['calendar','🗓️ วันพระ / วันสำคัญ'],
 ['ai','🤖 ผู้ช่วย AI'],
 ['stats','📈 สถิติหมู่บ้าน'],
 ['backup','💾 สำรอง / กู้คืน'],
 ['settings','⚙️ ตั้งค่าระบบ']
];
function load(){try{return merge(JSON.parse(localStorage.getItem(KEY)||'{}'),structuredClone(defaultData))}catch(e){return structuredClone(defaultData)}}
function merge(a,b){for(const k in b){if(a[k]===undefined)a[k]=b[k];else if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k])}return a}
function save(msg=true){
  try{
    localStorage.setItem(KEY,JSON.stringify(D));
    localStorage.setItem('RONGKHEM_LAST_PUBLISHED',String(Date.now()));
    if(msg) toast('✓ บันทึกข้อมูลเรียบร้อยแล้ว');
  }catch(e){
    console.error(e);
    alert('บันทึกไม่สำเร็จ: พื้นที่จัดเก็บข้อมูลเต็มหรือเบราว์เซอร์บล็อกการจัดเก็บ');
  }
}));if(msg)toast('✓ บันทึกข้อมูลเรียบร้อยแล้ว')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.add('hidden'),2200)}
function readFile(el,cb){const f=el.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}
function login(){
  const u=(document.getElementById('user').value||'').trim();
  const p=document.getElementById('pass').value||'';
  const validUser=(D.settings&&D.settings.username)||'sakkranon';
  const validPass=(D.settings&&D.settings.password)||'23122528';
  if(u===validUser && p===validPass){
    localStorage.setItem('rongkhemAdminLoggedIn','true');
    localStorage.setItem('rongkhemAdminUsername',u);
    sessionStorage.setItem(LOGIN,'1');
    start();
    toast('✓ เข้าสู่ระบบสำเร็จ');
  }else{
    alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
  }
}
function start(){loginBox.classList.add('hidden');appShell.classList.remove('hidden');logoutBtn.classList.remove('hidden');menuBox.innerHTML=menus.map(([id,n])=>`<button class="menu" data-id="${id}" onclick="openPage('${id}')">${n}</button>`).join('');openPage(current)}
function openPage(id){current=id;document.querySelectorAll('.menu').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(['people','content','places','environment'].includes(id)){return groupPage(id)};if(id==='dashboard')return dashboard();if(id==='leader')return leaderPage();if(['assistants','committee','advisors','sao','healthVolunteers'].includes(id))return personList(id);if(['news','activities','announcements','tourism','temples','maps','subnamjam','shops','calendar'].includes(id))return contentList(id);if(['pm25','weather','ai'].includes(id))return singlePage(id);if(id==='stats')return statsPage();if(id==='backup')return backupPage();if(id==='settings')return settingsPage()}
function card(title,body){main.innerHTML=`<section class="card"><div class="toolbar"><div><h2 style="margin:0">${title}</h2><div class="note">แก้ไข เพิ่ม ลบ บันทึก และอัปโหลดรูปภาพได้จากหน้านี้</div></div></div>${body}</section>`}
function groupPage(id){const map={people:['👥 บุคลากรและคณะทำงาน','เลือกเมนูด้านซ้ายเพื่อจัดการผู้ใหญ่บ้าน ผู้ช่วย คณะกรรมการ คณะที่ปรึกษา ส.อบต. และ อสม.'],content:['📰 ข่าวและกิจกรรม','จัดการข่าวประชาสัมพันธ์ กิจกรรมเด่น และประกาศสำคัญ'],places:['📍 สถานที่และแผนที่','จัดการแหล่งท่องเที่ยว วัด แผนที่ แหล่งซับน้ำจำ และร้านค้า'],environment:['🌦️ สิ่งแวดล้อมและปฏิทิน','จัดการ PM2.5 พยากรณ์อากาศ วันพระและวันสำคัญ']}[id];card(map[0],`<p>${map[1]}</p>`)}
function dashboard(){card('📊 ภาพรวมระบบ',`<div class="grid">${[['👥 ผู้ช่วย',D.assistants.length],['🏛️ คณะกรรมการ',D.committee.length],['❤️ อสม.',D.healthVolunteers.length],['📢 ข่าว',D.news.length],['📅 กิจกรรม',D.activities.length],['🌿 ท่องเที่ยว',D.tourism.length],['🛕 วัด',D.temples.length],['🗓️ ปฏิทิน',D.calendar.length]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="save()">บันทึกข้อมูลทั้งหมด</button><a class="btn light" href="index.html">เปิดหน้าเว็บไซต์</a></div>`)}
function leaderPage(){const x=D.leader;card('👨‍💼 ข้อมูลผู้ใหญ่บ้าน',`<div class="row"><div><label>ชื่อ-นามสกุล<input id="f_name" value="${esc(x.name)}"></label><label>ตำแหน่ง<input id="f_role" value="${esc(x.role)}"></label><label>โทรศัพท์<input id="f_phone" value="${esc(x.phone)}"></label></div><div><label>ที่อยู่<input id="f_address" value="${esc(x.address)}"></label><label>คำกล่าว / คำขวัญ<textarea id="f_quote">${esc(x.quote)}</textarea></label><label>อัปโหลดรูปภาพ<input type="file" accept="image/*" onchange="readFile(this,v=>{D.leader.image=v;save(false);leaderPage()})"></label>${x.image?`<img class="preview" src="${x.image}">`:''}</div></div><div class="actions"><button class="btn primary" onclick="saveLeader()">บันทึก</button>${x.image?`<button class="btn danger" onclick="D.leader.image='';save(false);leaderPage()">ลบรูป</button>`:''}</div>`)}
const personMeta={assistants:'ผู้ช่วยผู้ใหญ่บ้าน',committee:'คณะกรรมการหมู่บ้าน',advisors:'คณะที่ปรึกษา / ผู้ทรงคุณวุฒิ',sao:'สมาชิก ส.อบต.',healthVolunteers:'อสม.'};
function saveLeader(){
  D.leader={
    ...D.leader,
    name:document.getElementById('f_name').value,
    role:document.getElementById('f_role').value,
    phone:document.getElementById('f_phone').value,
    address:document.getElementById('f_address').value,
    quote:document.getElementById('f_quote').value
  };
  save();
}
function personList(key){const title=personMeta[key];card(`👥 ${title}`,`<div class="toolbar"><span class="note">เพิ่มรูป ชื่อ ตำแหน่ง หน้าที่ และเบอร์โทรได้</span><button class="btn primary" onclick="D['${key}'].push({name:'',role:'',detail:'',phone:'',image:'',order:D['${key}'].length+1});save(false);personList('${key}')">+ เพิ่มบุคลากร</button></div>${D[key].map((x,i)=>personEditor(key,title,x,i)).join('')||'<p class="note">ยังไม่มีข้อมูล กด “เพิ่มบุคลากร” เพื่อเริ่มต้น</p>'}`)}
function personEditor(key,title,x,i){return `<div class="item"><div class="item-head"><b>${title} ลำดับ ${i+1}</b><div><button class="btn light" onclick="move('${key}',${i},-1)">↑</button><button class="btn light" onclick="move('${key}',${i},1)">↓</button><button class="btn danger" onclick="D['${key}'].splice(${i},1);save(false);personList('${key}')">ลบ</button></div></div><div class="row"><div><label>ชื่อ-นามสกุล<input id="n_${i}" value="${esc(x.name)}"></label><label>ตำแหน่ง<input id="r_${i}" value="${esc(x.role)}"></label><label>เบอร์โทรศัพท์<input id="p_${i}" value="${esc(x.phone)}"></label></div><div><label>หน้าที่ / รายละเอียด<textarea id="d_${i}">${esc(x.detail)}</textarea></label><label>อัปโหลดรูปภาพ<input type="file" accept="image/*" onchange="readFile(this,v=>{D['${key}'][${i}].image=v;save(false);personList('${key}')})"></label>${x.image?`<img class="preview" src="${x.image}">`:''}</div></div><div class="actions"><button class="btn primary" onclick="D['${key}'][${i}]={...D['${key}'][${i}],name:n_${i}.value,role:r_${i}.value,phone:p_${i}.value,detail:d_${i}.value};save()">บันทึก</button></div></div>`}
const contentMeta={news:['ข่าวประชาสัมพันธ์','title,detail,date,image'],activities:['กิจกรรมเด่น','title,detail,date,image'],announcements:['ประกาศสำคัญ','title,detail,date,image'],tourism:['แหล่งท่องเที่ยว','title,detail,location,phone,image'],temples:['วัดและสถานที่สำคัญ','title,detail,location,image'],maps:['แผนที่หมู่บ้าน','title,detail,mapUrl,image'],subnamjam:['แหล่งซับน้ำจำ','title,detail,location,image'],shops:['ร้านค้าในชุมชน','title,detail,location,phone,image'],calendar:['วันพระ / วันสำคัญ','title,detail,date,image']};
function contentList(key){const [title]=contentMeta[key];card(`📝 ${title}`,`<div class="toolbar"><span class="note">จัดเรียงลำดับ เพิ่ม แก้ไข ลบ และอัปโหลดรูปภาพได้</span><button class="btn primary" onclick="D['${key}'].push({title:'',detail:'',date:'',location:'',phone:'',mapUrl:'',image:''});save(false);contentList('${key}')">+ เพิ่มรายการ</button></div>${D[key].map((x,i)=>contentEditor(key,title,x,i)).join('')||'<p class="note">ยังไม่มีข้อมูล</p>'}`)}
function contentEditor(key,title,x,i){const extra=key==='maps'?`<label>ลิงก์แผนที่<input id="u_${i}" value="${esc(x.mapUrl)}"></label>`:(['tourism','temples','subnamjam','shops'].includes(key)?`<label>สถานที่ / ที่ตั้ง<input id="l_${i}" value="${esc(x.location)}"></label>`:'')+(key==='shops'||key==='tourism'?`<label>โทรศัพท์<input id="p_${i}" value="${esc(x.phone)}"></label>`:'')+(['news','activities','announcements','calendar'].includes(key)?`<label>วันที่<input id="dt_${i}" value="${esc(x.date)}"></label>`:'');return `<div class="item"><div class="item-head"><b>${title} ${i+1}</b><div><button class="btn light" onclick="move('${key}',${i},-1)">↑</button><button class="btn light" onclick="move('${key}',${i},1)">↓</button><button class="btn danger" onclick="D['${key}'].splice(${i},1);save(false);contentList('${key}')">ลบ</button></div></div><div class="row"><div><label>หัวข้อ<input id="t_${i}" value="${esc(x.title)}"></label>${extra}<label>รายละเอียด<textarea id="d_${i}">${esc(x.detail)}</textarea></label></div><div><label>อัปโหลดรูปภาพ<input type="file" accept="image/*" onchange="readFile(this,v=>{D['${key}'][${i}].image=v;save(false);contentList('${key}')})"></label>${x.image?`<img class="preview" src="${x.image}">`:''}</div></div><button class="btn primary" onclick="saveContent('${key}',${i})">บันทึก</button></div>`}
function saveContent(key,i){const x=D[key][i];x.title=document.querySelector('#t_'+i).value;x.detail=document.querySelector('#d_'+i).value;const dt=document.querySelector('#dt_'+i),l=document.querySelector('#l_'+i),p=document.querySelector('#p_'+i),u=document.querySelector('#u_'+i);if(dt)x.date=dt.value;if(l)x.location=l.value;if(p)x.phone=p.value;if(u)x.mapUrl=u.value;save()}
function move(key,i,d){const j=i+d;if(j<0||j>=D[key].length)return;[D[key][i],D[key][j]]=[D[key][j],D[key][i]];save(false);(['assistants','committee','advisors','sao','healthVolunteers'].includes(key)?personList:contentList)(key)}
function singlePage(key){const title={pm25:'🌫️ PM2.5',weather:'☁️ พยากรณ์อากาศ',ai:'🤖 ผู้ช่วย AI'}[key],x=D[key];let body='';if(key==='ai')body=`<label>ชื่อผู้ช่วย AI<input id="a_title" value="${esc(x.title)}"></label><label>ข้อความต้อนรับ<textarea id="a_welcome">${esc(x.welcome)}</textarea></label><button class="btn primary" onclick="D.ai={title:document.getElementById('a_title').value,welcome:document.getElementById('a_welcome').value};save()">บันทึก</button>`;else body=`<div class="row"><div><label>หัวข้อ<input id="s_title" value="${esc(x.title)}"></label><label>รายละเอียด<textarea id="s_detail">${esc(x.detail)}</textarea></label><label>สถานะ / ระดับ<input id="s_level" value="${esc(x.level||'')}"></label></div><div><label>ค่า / อุณหภูมิ<input id="s_value" value="${esc(x.value||x.temperature||'')}"></label><label>อัปเดตล่าสุด<input id="s_updated" value="${esc(x.updated||'')}"></label><button class="btn primary" onclick="saveSingle('${key}')">บันทึก</button></div></div>`;card(title,body)}
function saveSingle(key){
  const x=D[key];
  x.title=document.getElementById('s_title').value;
  x.detail=document.getElementById('s_detail').value;
  const value=document.getElementById('s_value').value;
  x.level=document.getElementById('s_level').value;
  if(key==='pm25') x.value=value;
  else x.temperature=value;
  x.updated=document.getElementById('s_updated').value;
  save();
}else{x.temperature=s_value.value;x.level=s_level.value}x.updated=s_updated.value;save()}
function statsPage(){const x=D.stats;card('📈 สถิติหมู่บ้าน',`<div class="row"><div><label>จำนวนครัวเรือน<input id="st1" value="${esc(x.households)}"></label><label>ประชากร<input id="st2" value="${esc(x.population)}"></label></div><div><label>พื้นที่<input id="st3" value="${esc(x.area)}"></label><label>อัปเดตล่าสุด<input id="st4" value="${esc(x.updated)}"></label></div></div><button class="btn primary" onclick="D.stats={households:document.getElementById('st1').value,population:document.getElementById('st2').value,area:document.getElementById('st3').value,updated:document.getElementById('st4').value};save()">บันทึก</button>`)}
function backupPage(){card('💾 สำรอง / กู้คืนข้อมูล',`<p>สำรองข้อมูลทั้งหมดก่อนแก้ไขครั้งใหญ่ และสามารถกู้คืนได้ทุกเมนู</p><div class="actions"><button class="btn primary" onclick="exportData()">ดาวน์โหลด Backup JSON</button><label class="btn light">เลือกไฟล์กู้คืน<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label><button class="btn danger" onclick="if(confirm('ต้องการล้างข้อมูลทั้งหมดหรือไม่?')){localStorage.removeItem(KEY);location.reload()}">รีเซ็ตข้อมูล</button></div>`)}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='rongkhem-e-village-backup.json';a.click()}
function importData(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{D=merge(JSON.parse(r.result),structuredClone(defaultData));save(false);toast('✓ กู้คืนข้อมูลแล้ว');openPage('dashboard')}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}
function settingsPage(){const x=D.settings;card('⚙️ ตั้งค่าระบบ',`<div class="row"><div><label>ชื่อเว็บไซต์<input id="set_site" value="${esc(x.siteName)}"></label><label>ชื่อผู้ใช้ผู้ดูแล<input id="set_user" value="${esc(x.username)}"></label></div><div><label>รหัสผ่านใหม่<input id="set_pass" type="password" value="${esc(x.password)}"></label><p class="small">หลังบันทึก ใช้ชื่อผู้ใช้และรหัสผ่านใหม่ในครั้งถัดไป</p></div></div><button class="btn primary" onclick="D.settings={siteName:document.getElementById('set_site').value,username:document.getElementById('set_user').value,password:document.getElementById('set_pass').value};save()">บันทึกการตั้งค่า</button>`)}
loginBtn.onclick=login;pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});logoutBtn.onclick=logout;
if(localStorage.getItem('rongkhemAdminLoggedIn')==='true' || sessionStorage.getItem(LOGIN)==='1'){
  sessionStorage.setItem(LOGIN,'1');
  start();
}else{
  location.href='login.html';
}
</script>
