<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RONGKHEM e-VILLAGE ADMIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

:root{
    --primary:#001b3d;
    --primary2:#075ca8;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --danger:#b91c1c;
    --success:#15803d;
}

body{
    margin:0;
    font-family:"Noto Sans Thai",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    background:linear-gradient(135deg,#001b3d,#063970);
    color:#fff;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand h1{
    margin:0;
    font-size:22px;
}

.brand p{
    margin:3px 0 0;
    font-size:13px;
    opacity:.75;
}

.top-actions{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}

.top-btn{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
}

.view-btn{
    background:#fff;
    color:#001b3d;
}

.logout-btn{
    background:#c62828;
    color:#fff;
}

.layout{
    max-width:1500px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:20px;
}

.sidebar{
    background:#fff;
    border-radius:18px;
    padding:15px;
    height:fit-content;
    position:sticky;
    top:95px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.sidebar-title{
    padding:8px 10px 14px;
    font-size:18px;
    font-weight:700;
    border-bottom:1px solid var(--border);
    margin-bottom:8px;
}

.menu-btn{
    width:100%;
    border:0;
    background:transparent;
    padding:11px 12px;
    text-align:left;
    border-radius:9px;
    color:#334155;
    font-size:14px;
    margin:2px 0;
}

.menu-btn:hover,
.menu-btn.active{
    background:#e8f1fb;
    color:#075ca8;
    font-weight:700;
}

.content{
    min-width:0;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:24px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.page-title{
    margin:0;
    font-size:26px;
    color:#082b4d;
}

.page-desc{
    color:var(--muted);
    margin:6px 0 22px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:15px;
}

.stat-card{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat-card span{
    color:#64748b;
    font-size:13px;
}

.stat-card strong{
    display:block;
    margin-top:8px;
    font-size:28px;
    color:#082b4d;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:700;
    color:#334155;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:12px 13px;
    background:#fff;
    color:#172033;
    font-size:14px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#075ca8;
    box-shadow:0 0 0 3px rgba(7,92,168,.1);
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    font-size:14px;
    font-weight:700;
}

.primary{
    background:#075ca8;
    color:#fff;
}

.primary:hover{
    background:#03477f;
}

.danger{
    background:#b91c1c;
    color:#fff;
}

.muted{
    background:#e2e8f0;
    color:#334155;
}

.item{
    border:1px solid #e2e8f0;
    border-radius:15px;
    padding:18px;
    margin-top:18px;
    background:#fff;
}

.item-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.preview{
    margin-top:12px;
    max-width:240px;
    max-height:180px;
    border-radius:10px;
    border:1px solid #e2e8f0;
    display:block;
}

.notice{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
}

.success-box{
    display:none;
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    color:#166534;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

@media(max-width:1000px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:relative;
        top:auto;
    }

    .dashboard-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .topbar{
        padding:15px;
        align-items:flex-start;
        flex-direction:column;
    }

    .layout{
        padding:12px;
    }

    .card{
        padding:18px;
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:22px;
    }

}
</style>
</head>

<body>

<script>
/* =========================================
   ตรวจสอบการเข้าสู่ระบบ
========================================= */

if(localStorage.getItem("rongkhemAdminLoggedIn") !== "true"){
    window.location.replace("login.html");
}
</script>

<header class="topbar">

    <div class="brand">
        <h1>RONGKHEM e-VILLAGE ADMIN</h1>
        <p>ระบบจัดการเว็บไซต์บ้านร่องเข็ม หมู่ที่ 6</p>
    </div>

    <div class="top-actions">

        <a href="index.html" class="top-btn view-btn">
            ดูหน้าเว็บไซต์
        </a>

        <button class="top-btn logout-btn" onclick="logout()">
            ออกจากระบบ
        </button>

    </div>

</header>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            เมนูจัดการ
        </div>

        <div id="menu"></div>

    </aside>

    <main class="content">

        <div id="app"></div>

    </main>

</div>

<script>

/* =========================================
   ระบบข้อมูล
========================================= */

const STORAGE_KEY = "RONGKHEM_SITE_DATA";

const DEFAULT_DATA = {

    leader:{
        name:"นายศักรนนทน์ ขัติย์วงค์",
        role:"ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6",
        address:"ต.จำป่าหวาย อ.เมืองพะเยา จ.พะเยา",
        quote:"พร้อมดูแลชุมชน ด้วยระบบดิจิทัล",
        phone:"080-1202529",
        image:""
    },

    assistants:[
        {
            name:"น.ส.สุภาพร วังมูล",
            role:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายปกครอง",
            detail:"รับผิดชอบงานด้านทะเบียนและปกครองส่วนท้องถิ่น",
            phone:"098-9800089",
            image:""
        },
        {
            name:"นายจักร์กวัส ประพลรัตนัง",
            role:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายรักษาความสงบ",
            detail:"ดูแลความเรียบร้อยและความปลอดภัยภายในหมู่บ้าน",
            phone:"085-1399849",
            image:""
        }
    ],

    news:[
        {
            title:"ประชุมประจำเดือนหมู่บ้าน",
            detail:"วันอาทิตย์ เวลา 07.00 น.",
            image:""
        }
    ],

    activity:{
        title:"จิตอาสาพัฒนาหมู่บ้าน",
        detail:"ร่วมแรงร่วมใจ ทำความดีเพื่อชุมชน",
        image:""
    },

    announcements:[
        {
            title:"ประกาศสำคัญ",
            detail:"ประชาสัมพันธ์ข้อมูลข่าวสารของหมู่บ้าน",
            image:""
        }
    ],

    stats:{
        households:"350",
        population:"1,247",
        area:"2.15"
    },

    sections:{}

};


/* =========================================
   โหลดข้อมูล
========================================= */

let DATA;

try{

    DATA = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || structuredClone(DEFAULT_DATA);

}catch(error){

    DATA = structuredClone(DEFAULT_DATA);

}

if(!DATA.sections){
    DATA.sections = {};
}


/* =========================================
   เมนูทั้งหมด
========================================= */

const SERVICES = [

    "ข้อมูลหมู่บ้าน",
    "ข้อมูลครัวเรือน",
    "คณะกรรมการหมู่บ้าน",
    "ข่าวสาร/ประกาศ",
    "ยื่นคำร้องออนไลน์",
    "อสม.",
    "สุขภาพชุมชน",
    "ผู้สูงอายุ",
    "กลุ่มเปราะบาง",
    "สิ่งแวดล้อม / PM2.5",
    "แหล่งซับน้ำจำ",
    "การเกษตร",
    "ชรบ. / ความปลอดภัย",
    "ร้านค้าในชุมชน",
    "แผนที่หมู่บ้าน",
    "ติดต่อผู้ใหญ่บ้าน",
    "แจ้งเหตุฉุกเฉิน",
    "สถานที่ท่องเที่ยว"

];

const MENUS = [

    "ภาพรวมระบบ",
    "ข้อมูลผู้ใหญ่บ้าน",
    "ทีมผู้ช่วยผู้ใหญ่บ้าน",
    "ข่าวประชาสัมพันธ์",
    "กิจกรรมเด่น",
    "ประกาศสำคัญ",
    "สถิติหมู่บ้าน",

    ...SERVICES,

    "สำรอง / กู้คืนข้อมูล"

];


/* =========================================
   สร้างเมนู
========================================= */

const menu = document.getElementById("menu");

menu.innerHTML = MENUS.map(function(name){

    return `
        <button
            class="menu-btn"
            onclick="openPage(${JSON.stringify(name)})"
        >
            ${name}
        </button>
    `;

}).join("");


/* =========================================
   บันทึกข้อมูล
========================================= */

function saveData(message = "บันทึกข้อมูลเรียบร้อย"){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(DATA)
    );

    alert(message);

}


/* =========================================
   ออกจากระบบ
========================================= */

function logout(){

    if(confirm("ต้องการออกจากระบบหรือไม่?")){

        localStorage.removeItem(
            "rongkhemAdminLoggedIn"
        );

        localStorage.removeItem(
            "rongkhemAdminUsername"
        );

        window.location.href = "login.html";

    }

}


/* =========================================
   อ่านไฟล์รูปภาพ
========================================= */

function readImage(input, callback){

    const file = input.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){
        alert("กรุณาเลือกไฟล์รูปภาพ");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        callback(event.target.result);

    };

    reader.readAsDataURL(file);

}


/* =========================================
   เปิดหน้า
========================================= */

function openPage(name){

    document.querySelectorAll(".menu-btn").forEach(function(button){

        button.classList.toggle(
            "active",
            button.textContent.trim() === name
        );

    });

    if(name === "ภาพรวมระบบ"){
        dashboard();
        return;
    }

    if(name === "ข้อมูลผู้ใหญ่บ้าน"){
        leaderPage();
        return;
    }

    if(name === "ทีมผู้ช่วยผู้ใหญ่บ้าน"){
        assistantsPage();
        return;
    }

    if(name === "ข่าวประชาสัมพันธ์"){
        listPage(
            "ข่าวประชาสัมพันธ์",
            "news"
        );
        return;
    }

    if(name === "กิจกรรมเด่น"){
        activityPage();
        return;
    }

    if(name === "ประกาศสำคัญ"){
        listPage(
            "ประกาศสำคัญ",
            "announcements"
        );
        return;
    }

    if(name === "สถิติหมู่บ้าน"){
        statsPage();
        return;
    }

    if(name === "สำรอง / กู้คืนข้อมูล"){
        backupPage();
        return;
    }

    sectionPage(name);

}


/* =========================================
   ภาพรวม
========================================= */

function dashboard(){

    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2 class="page-title">
                ภาพรวมระบบ
            </h2>

            <p class="page-desc">
                ระบบจัดการข้อมูลเว็บไซต์ RONGKHEM e-VILLAGE
            </p>

            <div class="dashboard-grid">

                <div class="stat-card">
                    <span>ครัวเรือน</span>
                    <strong>${DATA.stats.households}</strong>
                </div>

                <div class="stat-card">
                    <span>ประชากร</span>
                    <strong>${DATA.stats.population}</strong>
                </div>

                <div class="stat-card">
                    <span>ข่าวประชาสัมพันธ์</span>
                    <strong>${DATA.news.length}</strong>
                </div>

                <div class="stat-card">
                    <span>ประกาศสำคัญ</span>
                    <strong>${DATA.announcements.length}</strong>
                </div>

            </div>

        </div>

    `;

}


/* =========================================
   ข้อมูลผู้ใหญ่บ้าน
========================================= */

function leaderPage(){

    const x = DATA.leader;

    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2 class="page-title">
                ข้อมูลผู้ใหญ่บ้าน
            </h2>

            <p class="page-desc">
                แก้ไขข้อมูลที่แสดงหน้าเว็บไซต์
            </p>

            <label>ชื่อ</label>

            <input
                id="leaderName"
                value="${escapeHTML(x.name)}"
            >

            <label>ตำแหน่ง</label>

            <input
                id="leaderRole"
                value="${escapeHTML(x.role)}"
            >

            <label>ที่อยู่</label>

            <input
                id="leaderAddress"
                value="${escapeHTML(x.address)}"
            >

            <label>ข้อความ</label>

            <textarea id="leaderQuote">${escapeHTML(x.quote)}</textarea>

            <label>โทรศัพท์</label>

            <input
                id="leaderPhone"
                value="${escapeHTML(x.phone)}"
            >

            <label>อัปโหลดรูปภาพ</label>

            <input
                type="file"
                accept="image/*"
                onchange="uploadLeaderImage(this)"
            >

            ${x.image ? `
                <img
                    src="${x.image}"
                    class="preview"
                >
            ` : ""}

            <div class="actions">

                <button
                    class="btn primary"
                    onclick="saveLeader()"
                >
                    บันทึกข้อมูล
                </button>

            </div>

        </div>

    `;

}


function uploadLeaderImage(input){

    readImage(input,function(image){

        DATA.leader.image = image;

        saveData("อัปโหลดรูปภาพเรียบร้อย");

        leaderPage();

    });

}


function saveLeader(){

    DATA.leader.name =
        document.getElementById("leaderName").value;

    DATA.leader.role =
        document.getElementById("leaderRole").value;

    DATA.leader.address =
        document.getElementById("leaderAddress").value;

    DATA.leader.quote =
        document.getElementById("leaderQuote").value;

    DATA.leader.phone =
        document.getElementById("leaderPhone").value;

    saveData();

}


/* =========================================
   ทีมผู้ช่วยผู้ใหญ่บ้าน
========================================= */

function assistantsPage(){

    document.getElementById("app").innerHTML = `

        <div class="card">

            <div class="item-header">

                <div>

                    <h2 class="page-title">
                        ทีมผู้ช่วยผู้ใหญ่บ้าน
                    </h2>

                    <p class="page-desc">
                        เพิ่ม แก้ไข ลบ และอัปโหลดรูปภาพ
                    </p>

                </div>

                <button
                    class="btn primary"
                    onclick="addAssistant()"
                >
                    + เพิ่มผู้ช่วย
                </button>

            </div>

            <div id="assistantList"></div>

        </div>

    `;

    const container =
        document.getElementById("assistantList");

    container.innerHTML =
        DATA.assistants.map(function(item,index){

            return `

                <div class="item">

                    <label>ชื่อ</label>

                    <input
                        id="assistantName${index}"
                        value="${escapeHTML(item.name)}"
                    >

                    <label>ตำแหน่ง</label>

                    <input
                        id="assistantRole${index}"
                        value="${escapeHTML(item.role)}"
                    >

                    <label>รายละเอียด</label>

                    <textarea
                        id="assistantDetail${index}"
                    >${escapeHTML(item.detail)}</textarea>

                    <label>โทรศัพท์</label>

                    <input
                        id="assistantPhone${index}"
                        value="${escapeHTML(item.phone)}"
                    >

                    <label>อัปโหลดรูปภาพ</label>

                    <input
                        type="file"
                        accept="image/*"
                        onchange="uploadAssistantImage(this,${index})"
                    >

                    ${item.image ? `
                        <img
                            src="${item.image}"
                            class="preview"
                        >
                    ` : ""}

                    <div class="actions">

                        <button
                            class="btn primary"
                            onclick="saveAssistant(${index})"
                        >
                            บันทึก
                        </button>

                        <button
                            class="btn danger"
                            onclick="deleteAssistant(${index})"
                        >
                            ลบ
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


function addAssistant(){

    DATA.assistants.push({

        name:"",
        role:"",
        detail:"",
        phone:"",
        image:""

    });

    assistantsPage();

}


function uploadAssistantImage(input,index){

    readImage(input,function(image){

        DATA.assistants[index].image = image;

        saveData("อัปโหลดรูปภาพเรียบร้อย");

        assistantsPage();

    });

}


function saveAssistant(index){

    DATA.assistants[index].name =
        document.getElementById(
            "assistantName" + index
        ).value;

    DATA.assistants[index].role =
        document.getElementById(
            "assistantRole" + index
        ).value;

    DATA.assistants[index].detail =
        document.getElementById(
            "assistantDetail" + index
        ).value;

    DATA.assistants[index].phone =
        document.getElementById(
            "assistantPhone" + index
        ).value;

    saveData();

}


function deleteAssistant(index){

    if(confirm("ต้องการลบข้อมูลนี้หรือไม่?")){

        DATA.assistants.splice(index,1);

        saveData("ลบข้อมูลเรียบร้อย");

        assistantsPage();

    }

}


/* =========================================
   ข่าว / ประกาศ
========================================= */

function listPage(title,key){

    document.getElementById("app").innerHTML = `

        <div class="card">

            <div class="item-header">

                <div>

                    <h2 class="page-title">
                        ${title}
                    </h2>

                    <p class="page-desc">
                        เพิ่ม แก้ไข ลบ และอัปโหลดรูปภาพ
                    </p>

                </div>

                <button
                    class="btn primary"
                    onclick="addListItem('${key}','${title}')"
                >
                    + เพิ่มรายการ
                </button>

            </div>

            <div id="listContainer"></div>

        </div>

    `;

    const container =
        document.getElementById("listContainer");

    container.innerHTML =
        DATA[key].map(function(item,index){

            return `

                <div class="item">

                    <label>หัวข้อ</label>

                    <input
                        id="${key}Title${index}"
                        value="${escapeHTML(item.title || "")}"
                    >

                    <label>รายละเอียด</label>

                    <textarea

function saveSection(name){

    if(!DATA.sections[name]){

        DATA.sections[name] = {
            title:name,
            intro:"",
            content:"",
            image:"",
            items:[]
        };

    }

    DATA.sections[name].title =
        document.getElementById("sectionTitle").value;

    DATA.sections[name].intro =
        document.getElementById("sectionIntro").value;

    DATA.sections[name].content =
        document.getElementById("sectionContent").value;

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(DATA)
    );

    const success =
        document.getElementById("sectionSuccess");

    if(success){

        success.style.display = "block";

        setTimeout(function(){

            success.style.display = "none";

        },2500);

    }

}


function uploadSectionMainImage(input,name){

    readImage(input,function(image){

        if(!DATA.sections[name]){

            DATA.sections[name] = {
                title:name,
                intro:"",
                content:"",
                image:"",
                items:[]
            };

        }

        DATA.sections[name].image = image;

        saveData("อัปโหลดรูปภาพเรียบร้อย");

        sectionPage(name);

    });

}


function deleteSection(name){

    if(confirm("ต้องการลบข้อมูลของเมนูนี้หรือไม่?")){

        delete DATA.sections[name];

        saveData("ลบข้อมูลเรียบร้อย");

        sectionPage(name);

}

function backupPage(){

    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2 class="page-title">
                สำรอง / กู้คืนข้อมูล
            </h2>

            <p class="page-desc">
                สำรองข้อมูลเว็บไซต์ทั้งหมด และกู้คืนภายหลังได้
            </p>

            <div class="notice">

                ข้อมูลถูกเก็บไว้ในเบราว์เซอร์เครื่องที่ใช้งานอยู่
                ควรสำรองข้อมูลเป็นประจำ
            </div>

            <div class="actions">

                <button
                    class="btn primary"
                    onclick="downloadBackup()"
                >
                    ดาวน์โหลดข้อมูลสำรอง
                </button>

            </div>

            <label>
                กู้คืนไฟล์ข้อมูล JSON
            </label>

            <input
                type="file"
                accept=".json,application/json"
                onchange="restoreBackup(this)"
            >

            <div class="actions">

                <button
                    class="btn danger"
                    onclick="resetData()"
                >
                    รีเซ็ตข้อมูลทั้งหมด
                </button>

            </div>

        </div>

    `;

}


function downloadBackup(){

    const blob = new Blob(

        [
            JSON.stringify(DATA,null,2)
        ],

        {
            type:"application/json"
        }

    );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "rongkhem-e-village-backup.json";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


function restoreBackup(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        try{

            DATA =
                JSON.parse(event.target.result);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(DATA)
            );

            alert(
                "กู้คืนข้อมูลเรียบร้อย"
            );

            location.reload();

        }catch(error){

            alert(
                "ไฟล์ข้อมูลไม่ถูกต้อง"
            );

        }

    };

    reader.readAsText(file);

}


function resetData(){

    if(confirm(
        "ต้องการรีเซ็ตข้อมูลทั้งหมดหรือไม่? ข้อมูลจะถูกลบ"
    )){

        localStorage.removeItem(
            STORAGE_KEY
        );

        DATA =
            structuredClone(DEFAULT_DATA);

        saveData(
            "รีเซ็ตข้อมูลเรียบร้อย"
        );

        location.reload();

    }

}


/* =========================================
   ป้องกัน HTML พัง
========================================= */

function escapeHTML(value){

    if(value === undefined || value === null){
        return "";
    }

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
