<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RONGKHEM e-VILLAGE ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:"Noto Sans Thai",sans-serif;background:#eef2f7;color:#18212f}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #001b3d10}.field{width:100%;border:1px solid #d6dbe4;border-radius:10px;padding:10px;margin-top:5px;background:#fff}.label{display:block;font-weight:600;margin-top:12px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}.primary{background:#001b3d;color:#fff}.danger{background:#b42318;color:#fff}.light{background:#e9eef6}.menu-btn{width:100%;text-align:left;padding:10px 12px;border-radius:10px}.menu-btn:hover,.menu-btn.active{background:#001b3d;color:#fff}.item{border:1px solid #e0e5ed;border-radius:14px;padding:14px;margin-top:12px}
</style></head>
<body>
<header class="bg-[#001b3d] text-white px-5 py-4 flex justify-between items-center sticky top-0 z-50">
<div><div class="font-bold text-lg">RONGKHEM e-VILLAGE ADMIN</div><div class="text-xs opacity-70">ระบบจัดการเว็บไซต์บ้านร่องเข็ม หมู่ที่ 6</div></div>
<div class="flex gap-2"><a href="index.html" class="btn bg-white text-[#001b3d]">ดูหน้าเว็บไซต์</a><button onclick="logout()" class="btn bg-red-600">ออกจากระบบ</button></div>
</header>
<div id="dashboard" class="max-w-7xl mx-auto p-4 md:p-6 grid lg:grid-cols-[270px_1fr] gap-5">
<aside class="card h-fit lg:sticky lg:top-24"><h2 class="font-bold text-lg mb-3">เมนูจัดการ</h2><div id="menu"></div></aside>
<main id="app"></main></div>
<script>
const KEY="RONGKHEM_SITE_DATA_V2",LOGINKEY="RONGKHEM_ADMIN_LOGIN";
const menus=[
["dashboard","ภาพรวมระบบ"],["leader","ข้อมูลผู้ใหญ่บ้าน"],["assistants","ทีมผู้ช่วยผู้ใหญ่บ้าน"],
["news","ข่าวประชาสัมพันธ์"],["activity","กิจกรรมเด่น"],["announcements","ประกาศสำคัญ"],["stats","สถิติหมู่บ้าน"],
["ข้อมูลหมู่บ้าน","ข้อมูลหมู่บ้าน"],["ข้อมูลครัวเรือน","ข้อมูลครัวเรือน"],["คณะกรรมการหมู่บ้าน","คณะกรรมการหมู่บ้าน"],["ข่าวสาร/ประกาศ","ข่าวสาร/ประกาศ"],
["ยื่นคำร้องออนไลน์","ยื่นคำร้องออนไลน์"],["อสม.","อสม."],["สุขภาพชุมชน","สุขภาพชุมชน"],["ผู้สูงอายุ","ผู้สูงอายุ"],["กลุ่มเปราะบาง","กลุ่มเปราะบาง"],
["สิ่งแวดล้อม / PM2.5","สิ่งแวดล้อม / PM2.5"],["แหล่งซับน้ำจำ","แหล่งซับน้ำจำ"],["การเกษตร","การเกษตร"],["ชรบ. / ความปลอดภัย","ชรบ. / ความปลอดภัย"],
["ร้านค้าในชุมชน","ร้านค้าในชุมชน"],["แผนที่หมู่บ้าน","แผนที่หมู่บ้าน"],["ติดต่อผู้ใหญ่บ้าน","ติดต่อผู้ใหญ่บ้าน"],["แจ้งเหตุฉุกเฉิน","แจ้งเหตุฉุกเฉิน"],["สถานที่ท่องเที่ยว","สถานที่ท่องเที่ยว"],
["backup","สำรอง / กู้คืนข้อมูล"]];
const defaults={leader:{name:"นายศักรนนทน์ ขัติย์วงค์",role:"ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6",address:"ต.จำป่าหวาย อ.เมืองพะเยา จ.พะเยา",quote:"พร้อมดูแลชุมชน ด้วยระบบดิจิทัล",phone:"080-1202529",image:""},
assistants:[{name:"น.ส.สุภาพร วังมูล",role:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายปกครอง",detail:"รับผิดชอบงานด้านทะเบียนและปกครองส่วนท้องถิ่น",phone:"098-9800089",image:""},{name:"นายจักร์กวัส ประพลรัตนัง",role:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายรักษาความสงบ",detail:"ดูแลความเรียบร้อยและความปลอดภัยภายในหมู่บ้าน",phone:"085-1399849",image:""}],
news:[{title:"ประชุมประจำเดือนหมู่บ้าน",detail:"วันอาทิตย์ที่ 1 มิถุนายน 2567 เวลา 07.00 น.",image:""},{title:"โครงการรณรงค์งดการเผา",detail:"1 ก.พ. - 31 มี.ค. 2567 งดเผาทุกชนิด",image:""}],
announcements:[{title:"ประกาศห้ามเผาในที่โล่งทุกชนิด",detail:"1 ก.พ. - 31 มี.ค. 2567",image:""}],
activity:[{title:"จิตอาสาพัฒนาหมู่บ้าน",detail:"ร่วมแรงร่วมใจ ทำความดีเพื่อชุมชน",image:""}],
stats:{households:"350",population:"1,247",area:"2.15",updated:"อัปเดตล่าสุด"},
sections:{}};
let D=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(defaults);D.sections||={};D.news||=[];D.announcements||=[];D.activity||=[];
function save(msg=true){localStorage.setItem(KEY,JSON.stringify(D));if(msg)alert("บันทึกข้อมูลเรียบร้อย")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function readFile(input,cb){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function doLogin(){if(user.value==="admin"&&pass.value==="1234"){sessionStorage.setItem(LOGINKEY,"1");start()}else alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง")}
function logout(){
  localStorage.removeItem("rongkhemAdminLoggedIn");
  localStorage.removeItem("rongkhemAdminUsername");
  sessionStorage.removeItem("RONGKHEM_EVILLAGE_ADMIN_LOGIN");
  sessionStorage.removeItem("RONGKHEM_ADMIN_LOGIN");
  window.location.href="login.html";
}
function start(){login.classList.add("hidden");dashboard.classList.remove("hidden");menu.innerHTML=menus.map(([id,n])=>`<button class="menu-btn" data-id="${esc(id)}" onclick='openPage(${JSON.stringify(id)})'>${esc(n)}</button>`).join("");openPage("dashboard")}
function active(id){document.querySelectorAll(".menu-btn").forEach(x=>x.classList.toggle("active",x.dataset.id===id))}
function openPage(id){active(id);if(id==="dashboard")return overview();if(id==="leader")return leader();if(id==="assistants")return collection("assistants","ทีมผู้ช่วยผู้ใหญ่บ้าน");if(id==="news")return collection("news","ข่าวประชาสัมพันธ์");if(id==="announcements")return collection("announcements","ประกาศสำคัญ");if(id==="activity")return collection("activity","กิจกรรมเด่น");if(id==="stats")return stats();if(id==="backup")return backup();sectionEditor(id)}
function overview(){app.innerHTML=`<div class="card"><h1 class="text-2xl font-bold">ภาพรวมระบบ</h1><p class="text-gray-500 mt-1">จัดการข้อมูลทั้งหมดของหน้าเว็บไซต์จากจุดเดียว</p><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 mt-5">${[['ข่าว',D.news.length],['ประกาศ',D.announcements.length],['กิจกรรม',D.activity.length],['เมนูข้อมูล',menus.length-8]].map(x=>`<div class="item"><div class="text-gray-500">${x[0]}</div><div class="text-3xl font-bold">${x[1]}</div></div>`).join("")}</div></div>`}
function leader(){const x=D.leader;app.innerHTML=`<div class="card max-w-3xl"><h1 class="text-2xl font-bold">ข้อมูลผู้ใหญ่บ้าน</h1><label class="label">ชื่อ<input id="f_name" class="field" value="${esc(x.name)}"></label><label class="label">ตำแหน่ง<input id="f_role" class="field" value="${esc(x.role)}"></label><label class="label">ที่อยู่<input id="f_address" class="field" value="${esc(x.address)}"></label><label class="label">ข้อความ<input id="f_quote" class="field" value="${esc(x.quote)}"></label><label class="label">โทรศัพท์<input id="f_phone" class="field" value="${esc(x.phone)}"></label><label class="label">อัปโหลดรูปภาพ<input type="file" accept="image/*" class="field" onchange="readFile(this,v=>{D.leader.image=v;save(false)})"></label>${x.image?`<img src="${x.image}" class="w-32 h-32 object-cover rounded-xl mt-3">`:''}<button class="btn primary mt-5" onclick="D.leader={...D.leader,name:f_name.value,role:f_role.value,address:f_address.value,quote:f_quote.value,phone:f_phone.value};save()">บันทึก</button></div>`}
function collection(key,title){app.innerHTML=`<div class="card"><div class="flex justify-between gap-3 items-center"><div><h1 class="text-2xl font-bold">${esc(title)}</h1><p class="text-gray-500">เพิ่ม แก้ไข ลบ และอัปโหลดรูปภาพ</p></div><button class="btn primary" onclick="D[${JSON.stringify(key)}].push({title:'',name:'',role:'',detail:'',phone:'',image:''});collection(${JSON.stringify(key)},${JSON.stringify(title)})">+ เพิ่มรายการ</button></div><div id="items"></div></div>`;items.innerHTML=D[key].map((x,i)=>renderItem(key,title,x,i)).join("")}
function renderItem(key,title,x,i){let assistant=key==="assistants";return `<div class="item"><div class="flex justify-between"><b>รายการที่ ${i+1}</b><button class="btn danger" onclick="D[${JSON.stringify(key)}].splice(${i},1);collection(${JSON.stringify(key)},${JSON.stringify(title)})">ลบ</button></div>
<label class="label">${assistant?"ชื่อ":"หัวข้อ"}<input id="name_${i}" class="field" value="${esc(assistant?x.name:x.title)}"></label>
${assistant?`<label class="label">ตำแหน่ง<input id="role_${i}" class="field" value="${esc(x.role)}"></label><label class="label">โทรศัพท์<input id="phone_${i}" class="field" value="${esc(x.phone)}"></label>`:""}
<label class="label">รายละเอียด<textarea id="detail_${i}" class="field" rows="4">${esc(x.detail)}</textarea></label>
<label class="label">อัปโหลดรูปภาพ<input type="file" accept="image/*" class="field" onchange="readFile(this,v=>{D[${JSON.stringify(key)}][${i}].image=v;save(false);collection(${JSON.stringify(key)},${JSON.stringify(title)})})"></label>
${x.image?`<img src="${x.image}" class="w-40 h-28 object-cover rounded-xl mt-3">`:''}
<button class="btn primary mt-4" onclick="${assistant?`D[${JSON.stringify(key)}][${i}]={...D[${JSON.stringify(key)}][${i}],name:name_${i}.value,role:role_${i}.value,phone:phone_${i}.value,detail:detail_${i}.value}`:`D[${JSON.stringify(key)}][${i}]={...D[${JSON.stringify(key)}][${i}],title:name_${i}.value,detail:detail_${i}.value}`};save()">บันทึก</button></div>`}
function stats(){let x=D.stats;app.innerHTML=`<div class="card max-w-2xl"><h1 class="text-2xl font-bold">สถิติหมู่บ้าน</h1><label class="label">ครัวเรือนทั้งหมด<input id="households" class="field" value="${esc(x.households)}"></label><label class="label">ประชากรทั้งหมด<input id="population" class="field" value="${esc(x.population)}"></label><label class="label">พื้นที่หมู่บ้าน<input id="area" class="field" value="${esc(x.area)}"></label><label class="label">ข้อความอัปเดต<input id="updated" class="field" value="${esc(x.updated)}"></label><button class="btn primary mt-5" onclick="D.stats={households:households.value,population:population.value,area:area.value,updated:updated.value};save()">บันทึก</button></div>`}
function sectionEditor(name){let S=D.sections[name]||{title:name,intro:"",content:"",image:"",items:[]};D.sections[name]=S;app.innerHTML=`<div class="card"><div class="flex flex-wrap justify-between gap-3"><div><h1 class="text-2xl font-bold">${esc(name)}</h1><p class="text-gray-500">จัดการข้อมูลของเมนูนี้ได้ทั้งหมด</p></div><button class="btn primary" onclick="D.sections[${JSON.stringify(name)}].items.push({title:'',detail:'',image:''});sectionEditor(${JSON.stringify(name)})">+ เพิ่มรายการ</button></div>
<label class="label">ชื่อหน้า<input id="sec_title" class="field" value="${esc(S.title)}"></label><label class="label">คำเกริ่นนำ<textarea id="sec_intro" class="field" rows="3">${esc(S.intro)}</textarea></label><label class="label">รายละเอียดหลัก<textarea id="sec_content" class="field" rows="8">${esc(S.content)}</textarea></label><label class="label">รูปภาพหน้าหลัก<input type="file" accept="image/*" class="field" onchange="readFile(this,v=>{D.sections[${JSON.stringify(name)}].image=v;save(false);sectionEditor(${JSON.stringify(name)})})"></label>${S.image?`<img src="${S.image}" class="w-48 h-32 object-cover rounded-xl mt-3">`:''}<button class="btn primary mt-4" onclick="D.sections[${JSON.stringify(name)}]={...D.sections[${JSON.stringify(name)}],title:sec_title.value,intro:sec_intro.value,content:sec_content.value};save()">บันทึกข้อมูลหลัก</button><div id="subitems"></div></div>`;
subitems.innerHTML=S.items.map((x,i)=>`<div class="item"><div class="flex justify-between"><b>รายการ ${i+1}</b><button class="btn danger" onclick="D.sections[${JSON.stringify(name)}].items.splice(${i},1);sectionEditor(${JSON.stringify(name)})">ลบ</button></div><label class="label">หัวข้อ<input id="it_${i}" class="field" value="${esc(x.title)}"></label><label class="label">รายละเอียด<textarea id="id_${i}" class="field" rows="4">${esc(x.detail)}</textarea></label><label class="label">รูปภาพ<input type="file" accept="image/*" class="field" onchange="readFile(this,v=>{D.sections[${JSON.stringify(name)}].items[${i}].image=v;save(false);sectionEditor(${JSON.stringify(name)})})"></label>${x.image?`<img src="${x.image}" class="w-36 h-24 object-cover rounded-xl mt-2">`:''}<button class="btn primary mt-3" onclick="D.sections[${JSON.stringify(name)}].items[${i}]={...D.sections[${JSON.stringify(name)}].items[${i}],title:it_${i}.value,detail:id_${i}.value};save()">บันทึก</button></div>`).join("")}
function backup(){app.innerHTML=`<div class="card max-w-3xl"><h1 class="text-2xl font-bold">สำรอง / กู้คืนข้อมูล</h1><p class="text-gray-500 mt-2">ดาวน์โหลดข้อมูลทั้งหมดเป็น JSON หรือกู้คืนกลับมา</p><button class="btn primary mt-5" onclick="downloadBackup()">ดาวน์โหลดสำรองข้อมูล</button><label class="label">กู้คืนข้อมูลจากไฟล์ JSON<input type="file" accept=".json,application/json" class="field" onchange="restore(this)"></label><button class="btn danger mt-5" onclick="if(confirm('ต้องการล้างข้อมูลทั้งหมด?')){localStorage.removeItem(KEY);location.reload()}">รีเซ็ตข้อมูลทั้งหมด</button></div>`}
function downloadBackup(){let b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rongkhem-e-village-backup.json";a.click();URL.revokeObjectURL(a.href)}
function restore(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save(false);alert("กู้คืนข้อมูลเรียบร้อย");location.reload()}catch(e){alert("ไฟล์ข้อมูลไม่ถูกต้อง")}};r.readAsText(f)}
if(sessionStorage.getItem(LOGINKEY)==="1")start();

// ระบบล็อกอินใช้ login.html เพียงครั้งเดียว
if(localStorage.getItem("rongkhemAdminLoggedIn")!=="true"){
  window.location.href="login.html";
}
</script></body></html>
