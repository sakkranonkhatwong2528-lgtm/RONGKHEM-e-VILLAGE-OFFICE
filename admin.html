/* =====================================================

===================================================== */

function save(showMessage=true){

  localStorage.setItem(
    KEY,
    JSON.stringify(D)
  );

  if(showMessage){

    alert("บันทึกข้อมูลเรียบร้อย");

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   READ IMAGE
===================================================== */

function readFile(input,callback){

  const file = input.files[0];

  if(!file){

    return;

  }

  const reader =
    new FileReader();

  reader.onload = function(){

    callback(reader.result);

  };

  reader.readAsDataURL(file);

}


/* =====================================================
   LOGIN
===================================================== */

function doLogin(){

  const user =
    document
      .getElementById("username")
      .value;

  const pass =
    document
      .getElementById("password")
      .value;


  if(
    user === "admin"
    &&
    pass === "1234"
  ){

    sessionStorage.setItem(
      LOGIN_KEY,
      "1"
    );

    start();

  }

  else{

    alert(
      "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
    );

  }

}


function logout(){

  sessionStorage.removeItem(
    LOGIN_KEY
  );

  location.reload();

}


/* =====================================================
   START ADMIN
===================================================== */

function start(){

  loginBox.classList.add(
    "hidden"
  );

  dashboardBox.classList.remove(
    "hidden"
  );


  menuBox.innerHTML =
    menus.map(
      ([id,name]) =>

      `
      <button
        class="menu-btn"
        data-id="${esc(id)}"
        onclick='openPage(${JSON.stringify(id)})'
      >
        ${esc(name)}
      </button>
      `

    ).join("");


  openPage(
    "dashboard"
  );

}


/* =====================================================
   ACTIVE MENU
===================================================== */

function activeMenu(id){

  document
    .querySelectorAll(".menu-btn")
    .forEach(function(button){

      button.classList.toggle(

        "active",

        button.dataset.id === id

      );

    });

}


/* =====================================================
   OPEN PAGE
===================================================== */

function openPage(id){

  activeMenu(id);


  if(id === "dashboard"){

    overview();

    return;

  }


  if(id === "leader"){

    leader();

    return;

  }


  if(id === "assistants"){

    collection(
      "assistants",
      "ทีมผู้ช่วยผู้ใหญ่บ้าน"
    );

    return;

  }


  if(id === "news"){

    collection(
      "news",
      "ข่าวประชาสัมพันธ์"
    );

    return;

  }


  if(id === "activity"){

  }


  if(id === "announcements"){

    collection(

      "ประกาศสำคัญ"
    );

  }


  if(id === "stats"){

  if(id === "backup"){

  sectionEditor(id);

/* =====================================================
   SECTION EDITOR
===================================================== */

function sectionEditor(name){

  let S =
    D.sections[name];


  if(!S){

    S = {

      title:name,

      intro:"",

      content:"",

      image:"",

      items:[]

    };


    D.sections[name] = S;

  }


  if(!S.items){

    S.items = [];

  }


  app.innerHTML = `

  <div class="card">

    <div
      class="flex flex-wrap justify-between gap-3"
    >

      <div>

        <h1 class="text-2xl font-bold">

          ${esc(name)}

        </h1>


        <p class="text-gray-500">

          จัดการข้อมูลของเมนูนี้ได้ทั้งหมด

        </p>

      </div>


      <button
        class="btn primary"
        id="add_section_item"
      >

        + เพิ่มรายการ

      </button>

    </div>


    <label class="label">

      ชื่อหน้า

      <input
        id="sec_title"
        class="field"
        value="${esc(S.title)}"
      >

    </label>


    <label class="label">

      คำเกริ่นนำ

      <textarea
        id="sec_intro"
        class="field"
        rows="3"
      >${esc(S.intro)}</textarea>

    </label>


    <label class="label">

      รายละเอียดหลัก

      <textarea
        id="sec_content"
        class="field"
        rows="8"
      >${esc(S.content)}</textarea>

    </label>


    <label class="label">

      รูปภาพหน้าหลัก

      <input
        type="file"
        accept="image/*"
        id="sec_image"
        class="field"
      >

    </label>


    <div id="main_image_preview">

      ${
        S.image
        ?
        `<img
          src="${S.image}"
          class="preview"
        >`
        :
        ""
      }

    </div>


    <button
      class="btn primary mt-4"
      id="save_section"
    >

      บันทึกข้อมูลหลัก

    </button>


    <div
      id="subitems"
      class="mt-5"
    ></div>

  </div>

  `;


  /* ADD ITEM */

  document
    .getElementById("add_section_item")
    .addEventListener(
      "click",
      function(){

        D.sections[name].items.push({

          title:"",

          detail:"",

          image:""

        });


        save(false);


        sectionEditor(name);

      }
    );


  /* IMAGE */

  document
    .getElementById("sec_image")
    .addEventListener(
      "change",
      function(){

        readFile(
          this,
          function(image){

            D.sections[name].image =
              image;


            document
              .getElementById(
                "main_image_preview"
              )
              .innerHTML =
              `
              <img
                src="${image}"
                class="preview"
              >
              `;

          }
        );

      }
    );


  /* SAVE MAIN */

  document
    .getElementById("save_section")
    .addEventListener(
      "click",
      function(){

        const title =
          document
            .getElementById("sec_title")
            .value;

        const intro =
          document
            .getElementById("sec_intro")
            .value;

        const content =
          document
            .getElementById("sec_content")
            .value;


        D.sections[name].title =
          title;

        D.sections[name].intro =
          intro;

        D.sections[name].content =
          content;


        save();

      }
    );


  /* SUB ITEMS */

  renderSectionItems(name);

}

function backup(){

  app.innerHTML = `

  <div class="card max-w-3xl">

    <h1 class="text-2xl font-bold">

      สำรอง / กู้คืนข้อมูล

    <p class="text-gray-500 mt-2">

      ดาวน์โหลดข้อมูลทั้งหมด
      หรือกู้คืนข้อมูลจากไฟล์ JSON

    </p>


    <button
      class="btn primary mt-5"
      id="download_backup"
    >

      ดาวน์โหลดสำรองข้อมูล

    </button>


    <label class="label">

      กู้คืนข้อมูลจากไฟล์ JSON

      <input
        type="file"
        accept=".json,application/json"
        class="field"
        id="restore_file"
      >

    </label>


    <button
      class="btn danger mt-5"
      id="reset_data"
    >

      รีเซ็ตข้อมูลทั้งหมด

    </button>

  </div>

  `;


  document
    .getElementById("download_backup")
    .addEventListener(
      "click",
      downloadBackup
    );


  document
    .getElementById("restore_file")
    .addEventListener(
      "change",
      restoreData
    );


  document
    .getElementById("reset_data")
    .addEventListener(
      "click",
      function(){

        if(
          confirm(
            "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
          )
        ){

          localStorage.removeItem(KEY);

          location.reload();

        }

      }
    );

}


/* =====================================================
   DOWNLOAD BACKUP
===================================================== */

function downloadBackup(){

  const blob =
    new Blob(

      [

        JSON.stringify(
          D,
          null,
          2
        )

      ],

      {

        type:"application/json"

      }

    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href = url;


  link.download =
    "rongkhem-e-village-backup.json";


  link.click();


  URL.revokeObjectURL(url);

}


/* =====================================================
   RESTORE DATA
===================================================== */

function restoreData(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(){

      try{

        D =
          JSON.parse(
            reader.result
          );


        save(false);


        alert(
          "กู้คืนข้อมูลเรียบร้อย"
        );


        location.reload();

      }

      catch(error){

        alert(
          "ไฟล์ข้อมูลไม่ถูกต้อง"
        );

      }

    };


  reader.readAsText(file);

}
