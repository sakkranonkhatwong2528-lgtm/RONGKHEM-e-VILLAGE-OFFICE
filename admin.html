<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONGKHEM e-VILLAGE ADMIN</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:#f3f6fa;color:#17212b}header{background:#06254b;color:#fff;padding:18px 24px;font-weight:bold;font-size:20px;position:sticky;top:0;z-index:5}.app{max-width:1400px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.tabs button{background:#fff;color:#06254b}.tabs button.active,.save{background:#0b5cad;color:#fff}.danger{background:#c62828;color:#fff}.edit{background:#e8f0fa}.panel{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 15px #00000012}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccd5df;border-radius:8px;font:inherit}textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.list{margin-bottom:20px}.row{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #e1e6ec;border-radius:12px;margin:8px 0}.row img{width:65px;height:65px;object-fit:cover;border-radius:9px;background:#eee}.info{flex:1}.info b{display:block}.muted{font-size:13px;color:#667085}.login{max-width:400px;margin:12vh auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 10px 40px #0002}.hide{display:none}.note{background:#fff5cf;padding:12px;border-radius:9px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start}}
</style></head><body>
<div id="login" class="login"><h2>🔐 RONGKHEM e-VILLAGE ADMIN</h2><p class="muted">ระบบจัดการเว็บไซต์บ้านร่องเข็ม</p><label>ชื่อผู้ใช้</label><input id="u" value="admin"><label>รหัสผ่าน</label><input id="p" type="password"><div class="actions"><button class="btn save" onclick="login()">เข้าสู่ระบบ</button></div><p class="note">รหัสเริ่มต้น: admin123</p></div>
<div id="app" class="hide"><header>🏛️ RONGKHEM e-VILLAGE — ระบบหลังบ้าน <span id="status" style="float:right;font-size:12px">● พร้อมใช้งาน</span></header><div class="app">
<div class="tabs" id="tabs"></div><div class="panel" id="content"></div></div></div>
<script>
const KEY='RONGKHEM_EVILLAGE_MASTER_DATA';
const D={settings:{villageName:'บ้านร่องเข็ม',moo:'6',subdistrict:'จำป่าหวาย',district:'เมืองพะเยา',province:'พะเยา',area:'2.15 ตร.กม.',households:'350',population:'1,247',leaderName:'นายศักรนนทน์ ขัติย์วงศ์',leaderPosition:'ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6',leaderPhone:'0801202529',leaderQuote:'พร้อมดูแลชุมชน ด้วยระบบดิจิทัล',leaderImage:'',subnamjamTitle:'แหล่งซับน้ำจำ',subnamjamText:'แหล่งทรัพยากรธรรมชาติสำคัญของชุมชน ร่วมกันอนุรักษ์ ฟื้นฟู และพัฒนาให้เป็นแหล่งเรียนรู้ และแหล่งท่องเที่ยวของหมู่บ้าน',subnamjamImage:'',templeTitle:'วัดร่องเข็ม',templeText:'วัดร่องเข็ม หรือวัดเวฬุวัน เป็นศาสนสถานสำคัญของชุมชนบ้านร่องเข็ม',templeImage:'',map:'https://www.google.com/maps?q=บ้านร่องเข็ม ตำบลจำป่าหวาย อำเภอเมืองพะเยา&output=embed',aiWelcome:'สวัสดีครับ ผม AI ผู้ช่วยหมู่บ้านร่องเข็ม มีอะไรให้ช่วยสอบถามได้เลย',aiKnowledge:'ผู้ใหญ่บ้าน | นายศักรนนทน์ ขัติย์วงศ์ ติดต่อ 080-1202529'},assistants:[],news:[],activities:[],announcements:[],sorobor:[],services:[],stores:[],health:[],security:[]};
let db,tab='ภาพรวม',edit={};const groups=['assistants','news','activities','announcements','sorobor','services','stores','health','security'];
const titles={assistants:'ทีมผู้ช่วยผู้ใหญ่บ้าน',news:'ข่าวประชาสัมพันธ์',activities:'กิจกรรมเด่น',announcements:'ประกาศสำคัญ',sorobor:'ส.อบต.',services:'เมนูบริการประชาชน',stores:'ร้านค้าในชุมชน',health:'อสม. / สุขภาพชุมชน',security:'ชรบ. / ความปลอดภัย'};
function init(){try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(D)}catch(e){db=structuredClone(D)}for(let k in D)if(db[k]==null)db[k]=structuredClone(D[k])}
function save(msg=1){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('status').textContent='✓ บันทึกแล้ว';setTimeout(()=>document.getElementById('status').textContent='● พร้อมใช้งาน',2000);if(msg)alert('บันทึกเรียบร้อย')}
function login(){if(u.value==='admin'&&p.value==='admin123'){sessionStorage.rkadmin=1;show()}else alert('รหัสผ่านไม่ถูกต้อง')}
function show(){loginBox=false;document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');init();drawTabs();render()}
function drawTabs(){let a=['ภาพรวม','ข้อมูลทั่วไป','ผู้ใหญ่บ้าน','แหล่งซับน้ำจำ','วัดร่องเข็ม',...groups.map(x=>titles[x]),'แผนที่ / AI','สำรองข้อมูล'];tabs.innerHTML=a.map(x=>`<button class="${x===tab?'active':''}" onclick="tab='${x}';drawTabs();render()">${x}</button>`).join('')}
function field(k,label,type='text'){let v=db.settings[k]||'';return `<div><label>${label}</label><input type="${type}" data-k="${k}" value="${esc(v)}"></div>`}
function text(k,label){return `<div class="full"><label>${label}</label><textarea data-k="${k}">${esc(db.settings[k]||'')}</textarea></div>`}
function saveSettings(){document.querySelectorAll('[data-k]').forEach(x=>db.settings[x.dataset.k]=x.value);save(0)}
function imageInput(key){return `<div class="full"><label>อัปโหลดรูปภาพ</label><input type="file" accept="image/*" onchange="setImage(event,'${key}')">${db.settings[key]?`<img src="${db.settings[key]}" style="max-width:180px;max-height:120px;margin-top:8px;border-radius:9px">`:''}</div>`}
function setImage(e,k){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{db.settings[k]=x.target.result;save(0);render()};r.readAsDataURL(f)}
function genericForm(){let key=Object.keys(titles).find(k=>titles[k]===tab);let arr=db[key],i=edit[key],x=i==null?{}:arr[i],name=(key==='assistants'||key==='sorobor')?'ชื่อ-นามสกุล':'หัวข้อ / ชื่อ';let extra=key==='services'?'<div><label>ไอคอน</label><input id="icon" value="'+esc(x.icon||'')+'"></div><div><label>ลิงก์</label><input id="link" value="'+esc(x.link||'')+'"></div>':key==='assistants'||key==='sorobor'||key==='stores'?'<div><label>ตำแหน่ง/ประเภท</label><input id="position" value="'+esc(x.position||'')+'"></div><div><label>โทรศัพท์</label><input id="phone" value="'+esc(x.phone||'')+'"></div>':'<div><label>วันที่</label><input id="date" type="date" value="'+esc(x.date||'')+'"></div>';
return `<h2>${titles[key]}</h2><div class="list">${arr.length?arr.map((v,n)=>row(key,v,n)).join(''):'<p class="muted">ยังไม่มีข้อมูล</p>'}</div><hr><h3>${i==null?'เพิ่มข้อมูล':'แก้ไขข้อมูล'}</h3><div class="grid"><div><label>${name}</label><input id="name" value="${esc(x.name||x.title||'')}"></div>${extra}<div class="full"><label>รายละเอียด</label><textarea id="description">${esc(x.description||'')}</textarea></div><div class="full"><label>รูปภาพ</label><input id="image" type="file" accept="image/*"></div></div><div class="actions"><button class="btn save" onclick="saveItem('${key}')">💾 บันทึก</button><button class="btn edit" onclick="edit['${key}']=null;render()">ล้างฟอร์ม</button></div>`}
function row(k,x,i){return `<div class="row">${x.image?`<img src="${x.image}">`:''}<div class="info"><b>${esc(x.name||x.title||'')}</b><span class="muted">${esc(x.position||x.date||x.phone||'')}</span><div class="muted">${esc(x.description||'')}</div></div><button class="btn edit" onclick="edit['${k}']=${i};render()">แก้ไข</button><button class="btn danger" onclick="del('${k}',${i})">ลบ</button></div>`}
function saveItem(k){let old=edit[k]==null?{}:db[k][edit[k]],o={...old};o[k==='assistants'||k==='sorobor'?'name':'title']=name.value.trim();o.description=description.value.trim();['position','phone','date','icon','link'].forEach(a=>{if(document.getElementById(a))o[a]=document.getElementById(a).value.trim()});let f=image.files[0];if(f){let r=new FileReader();r.onload=e=>{o.image=e.target.result;commit(k,o)};r.readAsDataURL(f)}else commit(k,o)}
function commit(k,o){if(!o.name&&!o.title)return alert('กรุณากรอกชื่อหรือหัวข้อ');if(edit[k]==null)db[k].unshift(o);else db[k][edit[k]]=o;edit[k]=null;save();render()}
function del(k,i){if(confirm('ยืนยันลบข้อมูล?')){db[k].splice(i,1);save(0);render()}}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let c=document.getElementById('content');if(titles&&Object.values(titles).includes(tab)){c.innerHTML=genericForm();return}
if(tab==='ภาพรวม'){let n=groups.reduce((a,k)=>a+db[k].length,0);c.innerHTML=`<h2>📊 ภาพรวม</h2><div class="note">ระบบนี้ใช้จัดการข้อมูลเว็บไซต์จากหลังบ้าน: เพิ่ม / แก้ไข / ลบ / อัปโหลดรูปภาพ</div><h1>${n} รายการข้อมูล</h1>`}
else if(tab==='ข้อมูลทั่วไป')c.innerHTML=`<h2>🏘️ ข้อมูลหมู่บ้าน</h2><div class="grid">${field('villageName','ชื่อหมู่บ้าน')}${field('moo','หมู่ที่')}${field('subdistrict','ตำบล')}${field('district','อำเภอ')}${field('province','จังหวัด')}${field('area','พื้นที่')}${field('households','ครัวเรือน')}${field('population','ประชากร')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`
else if(tab==='ผู้ใหญ่บ้าน')c.innerHTML=`<h2>👨‍💼 ผู้ใหญ่บ้าน</h2><div class="grid">${field('leaderName','ชื่อ-นามสกุล')}${field('leaderPosition','ตำแหน่ง')}${field('leaderPhone','โทรศัพท์')}${text('leaderQuote','คำขวัญ')}${imageInput('leaderImage')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`
else if(tab==='แหล่งซับน้ำจำ')c.innerHTML=`<h2>💧 แหล่งซับน้ำจำ</h2><div class="grid">${field('subnamjamTitle','หัวข้อ')}${text('subnamjamText','รายละเอียด')}${imageInput('subnamjamImage')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`
else if(tab==='วัดร่องเข็ม')c.innerHTML=`<h2>🛕 วัดร่องเข็ม</h2><div class="grid">${field('templeTitle','หัวข้อ')}${text('templeText','รายละเอียด')}${imageInput('templeImage')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`
else if(tab==='แผนที่ / AI')c.innerHTML=`<h2>📍 แผนที่ / AI ผู้ช่วย</h2><div class="grid">${text('map','Google Maps Embed URL')}${text('aiWelcome','ข้อความต้อนรับ AI')}${text('aiKnowledge','ฐานคำตอบ AI: คำถาม | คำตอบ หนึ่งบรรทัดต่อหนึ่งรายการ')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`
else c.innerHTML=`<h2>💾 สำรองข้อมูล</h2><div class="actions"><button class="btn save" onclick="backup()">⬇️ ดาวน์โหลด Backup</button><label class="btn edit">⬆️ นำเข้า JSON<input type="file" hidden onchange="restore(event)"></label><button class="btn danger" onclick="wipe()">ล้างข้อมูลทั้งหมด</button></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='rongkhem-backup.json';a.click()}
function restore(e){let r=new FileReader();r.onload=x=>{try{db=JSON.parse(x.target.result);save();render()}catch(z){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(e.target.files[0])}
function wipe(){if(confirm('ยืนยันล้างข้อมูลทั้งหมด?')){db=structuredClone(D);save();render()}}
if(sessionStorage.rkadmin)show();
</script></body></html>
