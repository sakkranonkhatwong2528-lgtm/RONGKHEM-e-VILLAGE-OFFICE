<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RONGKHEM e-VILLAGE ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Thai",sans-serif;background:#f3f6fa;color:#172033}
header{background:#001b3d;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px #0003}
.head{max-width:1400px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}
.primary{background:#075ca8;color:white}.danger{background:#b42318;color:white}.gray{background:#e7edf4;color:#182235}.green{background:#087443;color:white}
.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px}
aside{background:#fff;border-radius:16px;padding:12px;height:calc(100vh - 115px);position:sticky;top:95px;overflow:auto;box-shadow:0 3px 16px #001b3d12}
aside a{display:block;padding:10px 12px;color:#24364b;text-decoration:none;border-radius:8px;font-size:14px}aside a:hover{background:#edf4ff;color:#075ca8}
main{min-width:0}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 3px 16px #001b3d12}
h1{margin:0;font-size:23px}h2{margin:0 0 8px;color:#082b4d}.hint{color:#69798b;font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #d5dee8;border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}
.item{border:1px solid #dce5ef;border-radius:12px;padding:16px;margin-top:12px;background:#fbfdff}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.preview{width:130px;height:95px;object-fit:cover;border-radius:10px;background:#eef2f6;border:1px solid #dbe3ec;margin-top:8px}
.add{margin-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:#063970;color:#fff;padding:13px 18px;border-radius:10px;display:none;z-index:20}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}aside{position:static;height:auto;display:flex;gap:4px;overflow:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🏛️ RONGKHEM e-VILLAGE ADMIN</h1><div style="font-size:13px;opacity:.8">ระบบจัดการเว็บไซต์บ้านร่องเข็ม</div></div>
<div class="actions"><a class="btn gray" href="index.html">🌐 ดูหน้าเว็บไซต์</a><button class="primary" onclick="saveAll()">💾 บันทึกทั้งหมด</button><button class="gray" onclick="resetData()">♻ รีเซ็ตข้อมูล</button><button class="danger" onclick="logout()">🚪 ออกจากระบบ</button></div></div></header>
<div class="layout"><aside id="menu"></aside><main id="app"></main></div><div id="toast" class="toast"></div>
<script>
if(localStorage.getItem("rongkhemAdminLoggedIn")!=="true"){location.href="login.html";}
const KEY="rongkhemSiteData";
const defaults={

leader:{name:"นายศักรนนทน์ ขัติย์วงศ์",position:"ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6",address:"ต.จำป่าหวาย อ.เมืองพะเยา จ.พะเยา",phone:"0801202529",quote:"พร้อมดูแลชุมชน ด้วยระบบดิจิทัล",image:""},
assistants:[
{name:"น.ส.สุภาพร วังมูล",position:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายปกครอง",detail:"รับผิดชอบงานด้านทะเบียนและปกครองส่วนท้องถิ่น",phone:"0989800089",image:""},
{name:"นายจักร์กวัส ประพลรัตนัง",position:"ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายรักษาความสงบ",detail:"ดูแลความเรียบร้อยและความปลอดภัยภายในหมู่บ้าน",phone:"0851399849",image:""}],
news:[{title:"ประชุมประจำเดือนหมู่บ้าน",detail:"วันอาทิตย์ เวลา 07.00 น.",image:""},{title:"โครงการรณรงค์งดการเผา",detail:"งดเผาทุกชนิด",image:""}],
activities:[{title:"จิตอาสาพัฒนาหมู่บ้าน",detail:"ร่วมแรงร่วมใจ ทำความดีเพื่อชุมชน",image:"https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=1000&q=80"}],
announcements:[{title:"ประกาศห้ามเผาในที่โล่งทุกชนิด",detail:"1 ก.พ. - 31 มี.ค."},{title:"ประชาสัมพันธ์การฉีดวัคซีน",detail:"ป้องกันโรคพิษสุนัขบ้า"},{title:"การชำระภาษีที่ดิน",detail:"กรุณาดำเนินการภายในกำหนด"}],
services:[
{name:"ข้อมูลหมู่บ้าน",icon:"home",detail:""},{name:"ข้อมูลครัวเรือน",icon:"family_home",detail:""},{name:"คณะกรรมการหมู่บ้าน",icon:"groups",detail:""},{name:"ข่าวสาร / ประกาศ",icon:"campaign",detail:""},{name:"ยื่นคำร้องออนไลน์",icon:"description",detail:""},{name:"อสม. / สุขภาพชุมชน",icon:"favorite",detail:""},{name:"ผู้สูงอายุ",icon:"elderly",detail:""},{name:"กลุ่มเปราะบาง",icon:"diversity_3",detail:""},{name:"สิ่งแวดล้อม / PM2.5",icon:"eco",detail:""},{name:"การเกษตร",icon:"agriculture",detail:""},{name:"ชรบ. / ความปลอดภัย",icon:"security",detail:""},{name:"ร้านค้าในชุมชน",icon:"storefront",detail:""}],
subnamjam:{title:"แหล่งซับน้ำจำ",detail:"แหล่งทรัพยากรธรรมชาติสำคัญของชุมชน ร่วมกันอนุรักษ์ ฟื้นฟู และพัฒนาให้เป็นแหล่งเรียนรู้ และแหล่งท่องเที่ยวของหมู่บ้าน",image1:"",image2:""},
temple:{title:"วัดร่องเข็ม",detail:"วัดร่องเข็ม หรือวัดเวฬุวัน เป็นศาสนสถานสำคัญของชุมชนบ้านร่องเข็ม ใช้ประกอบกิจกรรมทางศาสนา ประเพณี และกิจกรรมของประชาชนในหมู่บ้าน",image:""},
sorobor:{title:"สมาชิกสภาองค์การบริหารส่วนตำบล",detail:"ข้อมูลสมาชิกสภาองค์การบริหารส่วนตำบลจำป่าหวาย สามารถเพิ่มรายละเอียดและข้อมูลติดต่อผ่านระบบหลังบ้าน"},
map:{embed:"https://www.google.com/maps?q=บ้านร่องเข็ม+ตำบลจำป่าหวาย+อำเภอเมืองพะเยา&output=embed"},
stats:{households:"350",population:"1,247",area:"2.15"},
contact:{title:"RONGKHEM e-VILLAGE",office:"ที่ทำการผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6",address:"ตำบลจำป่าหวาย อำเภอเมืองพะเยา จังหวัดพะเยา",phone:"080-1202529"},
site:{name:"RONGKHEM e-VILLAGE",subtitle:"ที่ทำการผู้ใหญ่บ้านออนไลน์ บ้านร่องเข็ม หมู่ที่ 6",logo:""}
};
let data=merge(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||"{}"));
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k])merge(a[k],b[k]);else a[k]=b[k]}return a}
const sections=[
["cover","🖼️ หน้าปกเว็บไซต์"],["site","🏷️ ชื่อเว็บไซต์ / โลโก้"],["leader","👨‍💼 ข้อมูลผู้ใหญ่บ้าน"],["assistants","👥 ทีมผู้ช่วยผู้ใหญ่บ้าน"],["news","📢 ข่าวประชาสัมพันธ์"],["activities","📅 กิจกรรมเด่น"],["announcements","📣 ประกาศสำคัญ"],["services","🧩 เมนูบริการประชาชน"],["subnamjam","💧 แหล่งซับน้ำจำ"],["temple","🛕 วัดร่องเข็ม"],["sorobor","🏛️ ส.อบต."],["map","📍 แผนที่หมู่บ้าน"],["stats","📊 สถิติหมู่บ้าน"],["contact","📞 ข้อมูลติดต่อ"]];
menu.innerHTML=sections.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join("");
const esc=s=>String(s??"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function field(key,label,value,type="text"){return `<div><label>${label}</label>${type==="textarea"?`<textarea data-path="${key}">${esc(value)}</textarea>`:`<input type="${type}" data-path="${key}" value="${esc(value)}">`}</div>`}
function imgField(path,label,value){return `<div><label>${label}</label><input type="file" accept="image/*" onchange="uploadImage(event,'${path}')"><button class="danger" style="margin-top:7px" onclick="clearImage('${path}')">🗑️ ลบรูป</button>${value?`<br><img class="preview" src="${value}">`:""}</div>`}
function card(id,title,inner){return `<section id="${id}" class="card"><h2>${title}</h2><p class="hint">แก้ไขข้อมูลแล้วกด “บันทึกทั้งหมด” ด้านบน</p><div class="grid">${inner}</div></section>`}
function render(){
app.innerHTML=
card("cover","🖼️ หน้าปกเว็บไซต์",field("cover.welcome","ข้อความต้อนรับ",data.cover.welcome)+field("cover.title","ชื่อเว็บไซต์",data.cover.title)+field("cover.description","คำอธิบาย",data.cover.description)+field("cover.highlight","ข้อความเน้น",data.cover.highlight)+field("cover.extra","ข้อความเพิ่มเติม",data.cover.extra,"textarea")+imgField("cover.image","เปลี่ยนรูปหน้าปก",data.cover.image))+
card("site","🏷️ ชื่อเว็บไซต์ / โลโก้",field("site.name","ชื่อเว็บไซต์",data.site.name)+field("site.subtitle","คำอธิบายใต้ชื่อ",data.site.subtitle)+imgField("site.logo","โลโก้เว็บไซต์",data.site.logo))+
card("leader","👨‍💼 ข้อมูลผู้ใหญ่บ้าน",field("leader.name","ชื่อ",data.leader.name)+field("leader.position","ตำแหน่ง",data.leader.position)+field("leader.address","ที่อยู่",data.leader.address)+field("leader.phone","โทรศัพท์",data.leader.phone)+field("leader.quote","คำกล่าว",data.leader.quote,"textarea")+imgField("leader.image","รูปผู้ใหญ่บ้าน",data.leader.image))+
listCard("assistants","👥 ทีมผู้ช่วยผู้ใหญ่บ้าน",["name|ชื่อ","position|ตำแหน่ง","detail|รายละเอียด|textarea","phone|โทรศัพท์","image|รูปภาพ|image"])+
listCard("news","📢 ข่าวประชาสัมพันธ์",["title|หัวข้อข่าว","detail|รายละเอียด|textarea","image|รูปภาพข่าว|image"])+
listCard("activities","📅 กิจกรรมเด่น",["title|ชื่อกิจกรรม","detail|รายละเอียด|textarea","image|รูปภาพกิจกรรม|image"])+
listCard("announcements","📣 ประกาศสำคัญ",["title|หัวข้อประกาศ","detail|รายละเอียด|textarea"])+
listCard("services","🧩 เมนูบริการประชาชน",["name|ชื่อเมนู","icon|ชื่อไอคอน Material Symbols","detail|รายละเอียดหน้าเมนู|textarea"])+
card("subnamjam","💧 แหล่งซับน้ำจำ",field("subnamjam.title","ชื่อหัวข้อ",data.subnamjam.title)+field("subnamjam.detail","รายละเอียด",data.subnamjam.detail,"textarea")+imgField("subnamjam.image1","รูปภาพที่ 1",data.subnamjam.image1)+imgField("subnamjam.image2","รูปภาพที่ 2",data.subnamjam.image2))+
card("temple","🛕 วัดร่องเข็ม",field("temple.title","ชื่อวัด",data.temple.title)+field("temple.detail","รายละเอียด",data.temple.detail,"textarea")+imgField("temple.image","รูปภาพวัด",data.temple.image))+
card("sorobor","🏛️ สมาชิกสภาองค์การบริหารส่วนตำบล",field("sorobor.title","หัวข้อ",data.sorobor.title)+field("sorobor.detail","รายละเอียด",data.sorobor.detail,"textarea"))+
card("map","📍 แผนที่หมู่บ้าน",field("map.embed","ลิงก์ Google Maps Embed",data.map.embed,"textarea"))+
card("stats","📊 สถิติหมู่บ้าน",field("stats.households","จำนวนครัวเรือน",data.stats.households)+field("stats.population","จำนวนประชากร",data.stats.population)+field("stats.area","พื้นที่ ตร.กม.",data.stats.area))+
card("contact","📞 ข้อมูลติดต่อ",field("contact.title","ชื่อเว็บไซต์",data.contact.title)+field("contact.office","ที่ทำการ",data.contact.office)+field("contact.address","ที่อยู่",data.contact.address,"textarea")+field("contact.phone","โทรศัพท์",data.contact.phone));
bindInputs();
}
function listCard(key,title,fields){let html=`<section id="${key}" class="card"><h2>${title}</h2><p class="hint">เพิ่ม แก้ไข ลบ และอัปโหลดรูปได้</p><div id="${key}List">`;
data[key].forEach((x,i)=>html+=itemHtml(key,i,x,fields));html+=`</div><button class="green add" onclick='addItem("${key}")'>＋ เพิ่มรายการ</button></section>`;return html}
function itemHtml(key,i,x,fields){return `<div class="item"><div class="itemhead"><b>${i+1}. ${esc(x.name||x.title||"รายการ")}</b><button class="danger" onclick="deleteItem('${key}',${i})">🗑️ ลบ</button></div><div class="grid">${fields.map(f=>{let [k,l,t]=f.split("|");let p=`${key}.${i}.${k}`;return t==="image"?imgField(p,l,x[k]):field(p,l,x[k]||"",t)}).join("")}</div></div>`}
function bindInputs(){document.querySelectorAll("[data-path]").forEach(el=>el.addEventListener("input",()=>setPath(el.dataset.path,el.value)))}
function setPath(path,val){let a=path.split("."),o=data;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a.at(-1)]=val}
function uploadImage(e,path){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{setPath(path,r.result);render();show("อัปโหลดรูปแล้ว กดบันทึกทั้งหมดเพื่อเก็บข้อมูล")};r.readAsDataURL(f)}
function clearImage(path){setPath(path,"");render()}
function addItem(key){let templates={assistants:{name:"",position:"",detail:"",phone:"",image:""},news:{title:"",detail:"",image:""},activities:{title:"",detail:"",image:""},announcements:{title:"",detail:""},services:{name:"เมนูใหม่",icon:"apps",detail:""}};data[key].push(templates[key]);render()}
function deleteItem(key,i){if(confirm("ยืนยันลบรายการนี้?")){data[key].splice(i,1);render()}}
function saveAll(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    const check=localStorage.getItem(KEY);
    if(!check) throw new Error("ไม่พบข้อมูลหลังบันทึก");
    show("บันทึกข้อมูลทั้งหมดเรียบร้อยแล้ว ✓");
  }catch(err){
    alert("บันทึกไม่สำเร็จ: พื้นที่เก็บข้อมูลเต็ม โดยเฉพาะรูปภาพขนาดใหญ่\n\nกรุณาลดขนาดรูปภาพ แล้วลองบันทึกใหม่");
  }
}
function resetData(){if(confirm("รีเซ็ตข้อมูลกลับค่าเริ่มต้นทั้งหมด?")){localStorage.removeItem(KEY);data=structuredClone(defaults);render();show("รีเซ็ตข้อมูลแล้ว")}}
function logout(){localStorage.removeItem("rongkhemAdminLoggedIn");localStorage.removeItem("rongkhemAdminUsername");location.href="login.html"}
function show(t){toast.textContent=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",2800)}
render();
</script>
</body></html>
