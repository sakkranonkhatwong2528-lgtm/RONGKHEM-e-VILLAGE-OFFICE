<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONGKHEM ADMIN</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--g:#087565;--bg:#f4f7f6;--line:#dfe9e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Kanit;color:#20332f}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:#073f37;color:#fff;padding:25px 15px}.side h2{margin:0}.side p{color:#b8d7cf;font-size:13px}.side a{display:block;padding:12px;border-radius:11px;margin:5px 0;color:#d5e7e2;cursor:pointer}.side a:hover{background:#0b6e5e}.main{padding:30px;max-width:1000px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:14px;margin-bottom:5px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit}.photo{width:100px;height:100px;object-fit:cover;border-radius:18px}.btn{padding:12px 18px;background:var(--g);border:0;color:#fff;border-radius:11px;font-family:inherit;margin-top:18px}.btn2{background:#e8f3f0;color:var(--g)}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:16px}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><h2>🏛️ RONGKHEM ADMIN</h2><p>ระบบจัดการเว็บไซต์บ้านร่องเข็ม หมู่ที่ 6</p><a href="index.html">🌐 ดูหน้าเว็บไซต์</a><a onclick="tab('leader')">👨‍💼 ผู้ใหญ่บ้าน</a><a onclick="tab('assistant1')">🤝 ผู้ช่วยผู้ใหญ่บ้าน คนที่ 1</a><a onclick="tab('assistant2')">🤝 ผู้ช่วยผู้ใหญ่บ้าน คนที่ 2</a><a>🏛️ คณะกรรมการหมู่บ้าน</a><a>📰 ข่าวประชาสัมพันธ์</a><a>📅 กิจกรรมเด่น</a><a>📍 สถานที่สำคัญ</a><a>⚙️ ตั้งค่าระบบ</a></aside><main class="main"><h1 id="title"></h1><p>แก้ไขรูป ชื่อ ตำแหน่ง หน้าที่ และโทรศัพท์ แล้วกดบันทึก</p><div class="card"><img id="preview" class="photo"><input id="file" type="file" accept="image/*" style="margin-top:12px"></div><div class="card"><div class="grid"><div><label>ชื่อ-นามสกุล</label><input id="name"></div><div><label>โทรศัพท์</label><input id="phone"></div></div><div style="margin-top:15px"><label id="dlabel">ตำแหน่ง</label><input id="duty"></div><div style="margin-top:15px"><label>URL รูปภาพ</label><input id="photo"></div><button class="btn" onclick="save()">💾 บันทึกข้อมูล</button> <button class="btn btn2" onclick="reset()">คืนค่าเดิม</button></div></main></div><script>
const DEF={leader:{name:"นายศักรนนทน์ ขัติย์วงศ์",role:"ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6",phone:"08x-xxx-xxxx",photo:"https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=300&q=85"},assistant1:{name:"ผู้ช่วยผู้ใหญ่บ้าน คนที่ 1",duty:"แก้ไขข้อมูลได้จากระบบแอดมิน",phone:"-",photo:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=85"},assistant2:{name:"ผู้ช่วยผู้ใหญ่บ้าน คนที่ 2",duty:"แก้ไขข้อมูลได้จากระบบแอดมิน",phone:"-",photo:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=300&q=85"}};let cur="leader",img="";function get(){return JSON.parse(localStorage.getItem("rongkhemData")||JSON.stringify(DEF))}function tab(k){cur=k;let x=get()[k];title.textContent=k==="leader"?"👨‍💼 ข้อมูลผู้ใหญ่บ้าน":k==="assistant1"?"🤝 ผู้ช่วยผู้ใหญ่บ้าน คนที่ 1":"🤝 ผู้ช่วยผู้ใหญ่บ้าน คนที่ 2";name.value=x.name;phone.value=x.phone;duty.value=x.role||x.duty;photo.value=x.photo;preview.src=x.photo;img=x.photo;dlabel.textContent=k==="leader"?"ตำแหน่ง":"หน้าที่ / เขตที่รับผิดชอบ"}function save(){let d=get();d[cur]={name:name.value,phone:phone.value,photo:img||photo.value};if(cur==="leader")d[cur].role=duty.value;else d[cur].duty=duty.value;localStorage.setItem("rongkhemData",JSON.stringify(d));alert("บันทึกเรียบร้อย ✓")}function reset(){localStorage.removeItem("rongkhemData");tab(cur)}file.onchange=e=>{let r=new FileReader();r.onload=()=>{img=r.result;preview.src=img};r.readAsDataURL(e.target.files[0])};photo.oninput=()=>{img=photo.value;preview.src=img};tab("leader");</script></body></html>
