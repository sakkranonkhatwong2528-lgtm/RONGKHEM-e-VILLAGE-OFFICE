<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Noto Sans Thai",sans-serif;background:#f3f6fa;color:#17212b}header{background:#06254b;color:#fff;padding:18px 24px;font-weight:bold;font-size:20px;position:sticky;top:0;z-index:5}.app{max-width:1400px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.tabs button{background:#fff;color:#06254b}.tabs button.active,.save{background:#0b5cad;color:#fff}.danger{background:#c62828;color:#fff}.edit{background:#e8f0fa}.panel{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 15px #00000012}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccd5df;border-radius:8px;font:inherit}textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.list{margin-bottom:20px}.row{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #e1e6ec;border-radius:12px;margin:8px 0}.row img{width:65px;height:65px;object-fit:cover;border-radius:9px;background:#eee}.info{flex:1}.info b{display:block}.muted{font-size:13px;color:#667085}.login{max-width:400px;margin:12vh auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 10px 40px #0002}.hide{display:none}.note{background:#fff5cf;padding:12px;border-radius:9px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start}}

<div id="login" class="login"><h2>🔐 RONGKHEM e-VILLAGE ADMIN</h2><p class="muted">ระบบจัดการเว็บไซต์บ้านร่องเข็ม</p><label>ชื่อผู้ใช้</label><input id="u" value=""><label>รหัสผ่าน</label><input id="p" type="password"><div class="actions"><button class="btn save" onclick="login()">เข้าสู่ระบบ</button></div></div>

subnamjamTitle:'แหล่งซับน้ำจำ',subnamjamText:'แหล่งทรัพยากรธรรมชาติสำคัญของชุมชน ร่วมกันอนุรักษ์ ฟื้นฟู และพัฒนาให้เป็นแหล่งเรียนรู้ และแหล่งท่องเที่ยวของหมู่บ้าน',subnamjamImage:'',
templeTitle:'วัดร่องเข็ม',templeText:'วัดร่องเข็ม หรือวัดเวฬุวัน เป็นศาสนสถานสำคัญของชุมชนบ้านร่องเข็ม ใช้ประกอบกิจกรรมทางศาสนา ประเพณี และกิจกรรมของประชาชนในหมู่บ้าน',templeImage:'',
map:'https://www.google.com/maps?q=บ้านร่องเข็ม ตำบลจำป่าหวาย อำเภอเมืองพะเยา&output=embed',
contactTitle:'RONGKHEM e-VILLAGE',contactText:'ที่ทำการผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6 ตำบลจำป่าหวาย อำเภอเมืองพะเยา จังหวัดพะเยา',contactPhone:'0801202529',
aiWelcome:'สวัสดีครับ ผม AI ผู้ช่วยผู้ใหญ่บ้านบ้านร่องเข็ม มีอะไรให้ช่วยสอบถามได้เลย',aiKnowledge:'ผู้ใหญ่บ้าน | นายศักรนนทน์ ขัติย์วงศ์ ติดต่อ 080-1202529'
},assistants:[
{name:'น.ส.สุภาพร วังมูล',position:'ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายปกครอง',phone:'0989800089',description:'รับผิดชอบงานด้านทะเบียนและปกครองส่วนท้องถิ่น',image:''},
{name:'นายจักร์กวัส ประพลรัตนัง',position:'ผู้ช่วยผู้ใหญ่บ้าน ฝ่ายรักษาความสงบ',phone:'0851399849',description:'ดูแลความเรียบร้อยและความปลอดภัยภายในหมู่บ้าน',image:''}
],news:[
{title:'ประชุมประจำเดือนหมู่บ้าน',description:'วันอาทิตย์ เวลา 07.00 น.',image:''},
{title:'โครงการรณรงค์งดการเผา',description:'งดเผาทุกชนิด',image:''}
],activities:[{title:'จิตอาสาพัฒนาหมู่บ้าน',description:'ร่วมแรงร่วมใจ ทำความดีเพื่อชุมชน',image:''}],
announcements:[

{title:'ประชาสัมพันธ์การฉีดวัคซีน',description:'ป้องกันโรคพิษสุนัขบ้า',image:''},
{title:'การชำระภาษีที่ดิน',description:'กรุณาดำเนินการภายในกำหนด',image:''}
],sorobor:[],services:[
{name:'ข้อมูลหมู่บ้าน',icon:'🏘️',link:'#village',description:'ข้อมูลทั่วไปของบ้านร่องเข็ม',image:''},
{name:'ข้อมูลครัวเรือน',icon:'🏠',link:'#',description:'ข้อมูลครัวเรือนในหมู่บ้าน',image:''},
{name:'คณะกรรมการหมู่บ้าน',icon:'👥',link:'#',description:'รายชื่อคณะกรรมการหมู่บ้าน',image:''},
{name:'ข่าวสาร / ประกาศ',icon:'📢',link:'#news',description:'ข่าวสารและประกาศล่าสุด',image:''},
{name:'แหล่งซับน้ำจำ',icon:'💧',link:'#subnamjam',description:'แหล่งทรัพยากรธรรมชาติของชุมชน',image:''},
{name:'แผนที่หมู่บ้าน',icon:'📍',link:'#map',description:'แผนที่และสถานที่สำคัญ',image:''},
{name:'วัดร่องเข็ม',icon:'🛕',link:'#temple',description:'ข้อมูลวัดร่องเข็ม',image:''},
{name:'ข้อมูล ส.อบต.',icon:'🏛️',link:'#sorobor',description:'ข้อมูลสมาชิกสภาองค์การบริหารส่วนตำบล',image:''},
{name:'ติดต่อผู้ใหญ่บ้าน',icon:'📞',link:'#contact',description:'ช่องทางติดต่อ',image:''},
{name:'แจ้งเหตุฉุกเฉิน',icon:'🚨',link:'tel:191',description:'โทร 191',image:''}
],stores:[],health:[],security:[]};
let db,tab='ภาพรวม',edit={};const groups=['assistants','news','activities','announcements','sorobor','services','stores','health','security'];
const titles={assistants:'ทีมผู้ช่วยผู้ใหญ่บ้าน',news:'ข่าวประชาสัมพันธ์',activities:'กิจกรรมเด่น',announcements:'ประกาศสำคัญ',sorobor:'ส.อบต.',services:'เมนูบริการประชาชน',stores:'ร้านค้าในชุมชน',health:'อสม. / สุขภาพชุมชน',security:'ชรบ. / ความปลอดภัย'};
function init(){try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(D)}catch(e){db=structuredClone(D)}for(const k in D){if(db[k]==null)db[k]=structuredClone(D[k]);}for(const k in D.settings){if(db.settings[k]==null)db.settings[k]=D.settings[k]}}
function save(msg=1){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('status').textContent='✓ บันทึกแล้ว';setTimeout(()=>document.getElementById('status').textContent='● พร้อมใช้งาน',2000);if(msg)alert('บันทึกเรียบร้อย')}
function login(){if(u.value==='sakkranon'&&p.value==='23122528'){sessionStorage.rkadmin=1;show()}else alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง')}
function show(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');init();drawTabs();render()}
function drawTabs(){const a=['ภาพรวม','หน้าปกเว็บไซต์','ข้อมูลทั่วไป','ผู้ใหญ่บ้าน','แหล่งซับน้ำจำ','วัดร่องเข็ม',...groups.map(x=>titles[x]),'แผนที่ / ติดต่อ / AI','สำรองข้อมูล'];tabs.innerHTML=a.map(x=>`<button class="${x===tab?'active':''}" onclick="tab='${x}';drawTabs();render()">${x}</button>`).join('')}
function field(k,label,type='text'){return `<div><label>${label}</label><input type="${type}" data-k="${k}" value="${esc(db.settings[k]||'')}"></div>`}
function text(k,label){return `<div class="full"><label>${label}</label><textarea data-k="${k}">${esc(db.settings[k]||'')}</textarea></div>`}
function saveSettings(){document.querySelectorAll('[data-k]').forEach(x=>db.settings[x.dataset.k]=x.value);save(0);alert('บันทึกเรียบร้อย')}
function imageInput(key,label='อัปโหลดรูปภาพ'){return `<div class="full"><label>${label}</label><input type="file" accept="image/*" onchange="setImage(event,'${key}')">${db.settings[key]?`<img src="${db.settings[key]}" style="max-width:220px;max-height:140px;margin-top:8px;border-radius:9px"><div class="actions"><button class="btn danger" type="button" onclick="removeImage('${key}')">ลบรูป</button></div>`:''}</div>`}
function setImage(e,k){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{db.settings[k]=x.target.result;save(0);render()};r.readAsDataURL(f)}
function removeImage(k){if(confirm('ลบรูปนี้?')){db.settings[k]='';save(0);render()}}
function genericForm(){const key=Object.keys(titles).find(k=>titles[k]===tab),arr=db[key],i=edit[key],x=i==null?{}:arr[i],name=(key==='assistants'||key==='sorobor')?'ชื่อ-นามสกุล':key==='services'?'ชื่อเมนู':'หัวข้อ / ชื่อ';const extra=key==='services'?`<div><label>ไอคอน</label><input id="icon" value="${esc(x.icon||'')}"></div><div><label>ลิงก์</label><input id="link" value="${esc(x.link||'')}"></div>`:(key==='assistants'||key==='sorobor'||key==='stores')?`<div><label>ตำแหน่ง/ประเภท</label><input id="position" value="${esc(x.position||'')}"></div><div><label>โทรศัพท์</label><input id="phone" value="${esc(x.phone||'')}"></div>`:`<div><label>วันที่</label><input id="date" value="${esc(x.date||'')}"></div>`;return `<h2>${titles[key]}</h2><p class="muted">เพิ่ม / แก้ไข / ลบ / อัปโหลดรูปภาพ</p><div class="list">${arr.length?arr.map((v,n)=>row(key,v,n)).join(''):'<p class="muted">ยังไม่มีข้อมูล</p>'}</div><hr><h3>${i==null?'เพิ่มข้อมูล':'แก้ไขข้อมูล'}</h3><div class="grid"><div><label>${name}</label><input id="name" value="${esc(x.name||x.title||'')}"></div>${extra}<div class="full"><label>รายละเอียด</label><textarea id="description">${esc(x.description||'')}</textarea></div><div class="full"><label>รูปภาพ</label><input id="image" type="file" accept="image/*">${x.image?`<div class="actions"><button class="btn danger" onclick="clearItemImage('${key}')">ลบรูป</button></div>`:''}</div></div><div class="actions"><button class="btn save" onclick="saveItem('${key}')">💾 บันทึก</button><button class="btn edit" onclick="edit['${key}']=null;render()">ล้างฟอร์ม</button></div>`}
function row(k,x,i){return `<div class="row">${x.image?`<img src="${x.image}">`:''}<div class="info"><b>${esc(x.name||x.title||'')}</b><span class="muted">${esc(x.position||x.date||x.phone||'')}</span><div class="muted">${esc(x.description||'')}</div></div><button class="btn edit" onclick="edit['${k}']=${i};render()">แก้ไข</button><button class="btn danger" onclick="del('${k}',${i})">ลบ</button></div>`}
function clearItemImage(k){if(edit[k]!=null){db[k][edit[k]].image='';save(0);render()}}
function saveItem(k){const old=edit[k]==null?{}:db[k][edit[k]],o={...old};o[k==='assistants'||k==='sorobor'||k==='services'?'name':'title']=name.value.trim();o.description=description.value.trim();['position','phone','date','icon','link'].forEach(a=>{const el=document.getElementById(a);if(el)o[a]=el.value.trim()});const f=image.files[0];if(f){const r=new FileReader();r.onload=e=>{o.image=e.target.result;commit(k,o)};r.readAsDataURL(f)}else commit(k,o)}
function commit(k,o){if(!o.name&&!o.title)return alert('กรุณากรอกชื่อหรือหัวข้อ');if(edit[k]==null)db[k].unshift(o);else db[k][edit[k]]=o;edit[k]=null;save();render()}
function del(k,i){if(confirm('ยืนยันลบข้อมูล?')){db[k].splice(i,1);save(0);render()}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const c=document.getElementById('content');if(Object.values(titles).includes(tab)){c.innerHTML=genericForm();return}
if(tab==='ภาพรวม'){const n=groups.reduce((a,k)=>a+db[k].length,0);c.innerHTML=`<h2>📊 ภาพรวม</h2><div class="note">จัดการทุกข้อมูลที่โหลดเปลี่ยนได้บนหน้า index.html รวมหน้าปก รูปภาพ ข้อความ ข่าว ทีมผู้ช่วย เมนู แหล่งซับน้ำจำ วัด ส.อบต. แผนที่ และสถิติ</div><h1>${n} รายการข้อมูล</h1>`}
else if(tab==='หน้าปกเว็บไซต์')c.innerHTML=`<h2>🖼️ หน้าปกเว็บไซต์</h2><div class="grid">${field('heroEyebrow','ข้อความบรรทัดบน')}${field('heroTitle','หัวข้อใหญ่')}${text('heroText','คำอธิบาย')}${field('heroButton1','ข้อความปุ่มที่ 1')}${field('heroButton1Link','ลิงก์ปุ่มที่ 1')}${field('heroButton2','ข้อความปุ่มที่ 2')}${field('heroButton2Link','ลิงก์ปุ่มที่ 2')}${imageInput('heroImage','อัปโหลด/เปลี่ยนรูปหน้าปก')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึกหน้าปก</button></div>`}
else if(tab==='ข้อมูลทั่วไป')c.innerHTML=`<h2>🏘️ ข้อมูลหมู่บ้าน / สถิติ</h2><div class="grid">${field('villageName','ชื่อหมู่บ้าน')}${field('moo','หมู่ที่')}${field('subdistrict','ตำบล')}${field('district','อำเภอ')}${field('province','จังหวัด')}${field('area','พื้นที่')}${field('households','ครัวเรือน')}${field('population','ประชากร')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`}
else if(tab==='ผู้ใหญ่บ้าน')c.innerHTML=`<h2>👨‍💼 ผู้ใหญ่บ้าน</h2><div class="grid">${field('leaderName','ชื่อ-นามสกุล')}${field('leaderPosition','ตำแหน่ง')}${field('leaderAddress','ที่อยู่')}${field('leaderPhone','โทรศัพท์')}${text('leaderQuote','ข้อความแนะนำ')}${imageInput('leaderImage','อัปโหลด/เปลี่ยน/ลบรูปผู้ใหญ่บ้าน')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`}
else if(tab==='แหล่งซับน้ำจำ')c.innerHTML=`<h2>💧 แหล่งซับน้ำจำ</h2><div class="grid">${field('subnamjamTitle','หัวข้อ')}${text('subnamjamText','รายละเอียด')}${imageInput('subnamjamImage')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`}
else if(tab==='วัดร่องเข็ม')c.innerHTML=`<h2>🛕 วัดร่องเข็ม</h2><div class="grid">${field('templeTitle','หัวข้อ')}${text('templeText','รายละเอียด')}${imageInput('templeImage')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`}
else if(tab==='แผนที่ / ติดต่อ / AI')c.innerHTML=`<h2>📍 แผนที่ / ติดต่อ / AI</h2><div class="grid">${text('map','Google Maps Embed URL')}${field('contactTitle','หัวข้อส่วนติดต่อ')}${text('contactText','ข้อความติดต่อ')}${field('contactPhone','โทรศัพท์')}${text('aiWelcome','ข้อความต้อนรับ AI')}${text('aiKnowledge','ฐานคำตอบ AI: พิมพ์ข้อมูลที่ AI ใช้อ้างอิง')}</div><div class="actions"><button class="btn save" onclick="saveSettings()">💾 บันทึก</button></div>`}
else c.innerHTML=`<h2>💾 สำรองข้อมูล</h2><div class="actions"><button class="btn save" onclick="backup()">⬇️ ดาวน์โหลด Backup</button><label class="btn edit">⬆️ นำเข้า JSON<input type="file" hidden onchange="restore(event)"></label><button class="btn danger" onclick="wipe()">ล้างข้อมูลทั้งหมด</button></div>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='rongkhem-backup.json';a.click()}
function restore(e){const r=new FileReader();r.onload=x=>{try{db=JSON.parse(x.target.result);save();render()}catch(z){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(e.target.files[0])}
function wipe(){if(confirm('ยืนยันล้างข้อมูลทั้งหมด?')){db=structuredClone(D);save();render()}}
if(sessionStorage.rkadmin)show();
</script></body></html>
