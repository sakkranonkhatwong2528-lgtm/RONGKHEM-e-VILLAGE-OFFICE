    top:0;
    z-index:100;
}

.logo-title{
    font-size:20px;
    font-weight:700;
}

.logo-subtitle{
    font-size:13px;
    opacity:.75;
    margin-top:2px;
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.header-actions a,
.header-actions button{
    border:none;
    padding:10px 15px;

    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    text-decoration:none;
}

.view-site{

}

.logout{
    background:#b91c1c;
    color:#fff;
}

.layout{
    max-width:1500px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:20px;
}

.sidebar,
.card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
    border:1px solid var(--border);
}

.sidebar{
    height:fit-content;
    overflow:hidden;
}

.sidebar-title{
    padding:18px;
    font-weight:700;
    border-bottom:1px solid var(--border);
    color:var(--primary);
}

.menu{
    padding:10px;
}

.menu button{
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    padding:11px 12px;
    border-radius:9px;
    font-family:inherit;
    cursor:pointer;
    color:#344054;
    font-size:14px;
    margin-bottom:2px;
}

.menu button:hover,
.menu button.active{
    background:#eaf2ff;
    color:#075ca8;
    font-weight:600;
}

.card{
    padding:25px;
}

.page-title{
    margin:0 0 5px;
    color:var(--primary);
    font-size:25px;
}

.page-description{
    color:var(--muted);
    margin:0 0 20px;
}

label{
    display:block;
    margin-top:14px;
    font-weight:600;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    margin-top:6px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    padding:12px 13px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#075ca8;
    box-shadow:0 0 0 3px rgba(7,92,168,.12);
}

.btn{
    border:none;
    border-radius:9px;
    padding:11px 16px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    margin-top:18px;
}

.btn-primary{
    background:#075ca8;
    color:#fff;
}

.btn-danger{
    background:#c62828;
    color:#fff;
}

.btn-secondary{
    background:#e7edf5;
    color:#344054;
}

.btn-success{
    background:#198754;
    color:#fff;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.item{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-top:15px;
    background:#fafcff;
}

.item-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.item h3{
    margin:0;
    color:var(--primary);
}

.preview{
    margin-top:10px;
    max-width:220px;
    max-height:180px;
    border-radius:10px;
    border:1px solid var(--border);
    display:block;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;

.stat-box{
    padding:20px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;

.stat-number{
    font-size:28px;
    font-weight:700;
    color:#075ca8;
}

.stat-label{
    color:var(--muted);
    font-size:14px;

.notice{
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;

    color:#fff;
    padding:14px 20px;
    border-radius:10px;

function showNotice(){

    const notice =
    document.getElementById("notice");

    notice.style.display = "block";

    setTimeout(function(){

        notice.style.display = "none";

    },2500);

}


function readImage(input,callback){

    const file = input.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(event){

        callback(event.target.result);

    };

    reader.readAsDataURL(file);

}


function escapeHtml(text){

    if(text === null ||
       text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function setActiveMenu(name){

    document
    .querySelectorAll(".menu button")
    .forEach(function(button){

        button.classList.remove("active");

    });

}


/* =====================================================
   OPEN PAGE
===================================================== */

function openPage(name){

    setActiveMenu(name);

    if(name === "ภาพรวมระบบ"){
        dashboard();
        return;
    }

    if(name === "ข้อมูลผู้ใหญ่บ้าน"){
        leaderPage();
        return;
    }

    if(name === "ทีมผู้ช่วยผู้ใหญ่บ้าน"){
        assistantsPage();
        return;
    }

    if(name === "ข่าวประชาสัมพันธ์"){
        listPage(
            "ข่าวประชาสัมพันธ์",
            "news",
            true
        );
        return;
    }

    if(name === "กิจกรรมเด่น"){
        listPage(
            "กิจกรรมเด่น",
            "activity",
            true
        );
        return;
    }

    if(name === "ประกาศสำคัญ"){
        listPage(
            "ประกาศสำคัญ",
            "announcements",
            false
        );
        return;
    }

    if(name === "สถิติหมู่บ้าน"){
        statsPage();
        return;
    }

    if(name === "สำรอง / กู้คืนข้อมูล"){
        backupPage();
        return;
    }

    sectionPage(name);

}

function listPage(
    title,

    hasImage
){

    let html = `

    <div class="card">

        <h1 class="page-title">
            ${title}
        </h1>

        <p class="page-description">
            เพิ่ม แก้ไข ลบ และบันทึกข้อมูลได้ทั้งหมด
        </p>

        <button
            class="btn btn-primary"
            onclick='addListItem(${JSON.stringify(key)},${hasImage})'
        >
            + เพิ่มรายการ
        </button>

    `;


    if(
        !siteData[key] ||
        siteData[key].length === 0
    ){

        html += `
        <div class="empty">
            ยังไม่มีข้อมูล
        </div>
        `;

    }


    siteData[key].forEach(
        function(item,index){

            html += `

            <div class="item">

                <div class="item-head">

                    <h3>
                        รายการที่ ${index + 1}
                    </h3>

                    <button
                        class="btn btn-danger"
                        onclick='deleteListItem(${JSON.stringify(key)},${index},${hasImage})'
                    >
                        ลบ
                    </button>

                </div>

                <label>
                    หัวข้อ
                </label>

                <input
                    id="${key}Title${index}"
                    value="${escapeHtml(item.title)}"
                >

                <label>
                    รายละเอียด
                </label>

                <textarea
                    id="${key}Detail${index}"
                >${escapeHtml(item.detail)}</textarea>

                ${
                    hasImage
                    ?
                    `
                    <label>
                        อัปโหลดรูปภาพ
                    </label>

                    <input
                        type="file"
                        accept="image/*"
                        onchange='uploadListImage(this,${JSON.stringify(key)},${index})'
                    >

                    ${
                        item.image
                        ?
                        `
                        <img
                            class="preview"
                            src="${item.image}"
                        >
                        `
                        :
                        ""
                    }
                    `
                    :
                    ""
                }

                <div class="actions">

                    <button
                        class="btn btn-primary"
                        onclick='saveListItem(${JSON.stringify(key)},${index})'
                    >
                        บันทึก
                    </button>

                    ${
                        hasImage
                        ?
                        `
                        <button
                            class="btn btn-danger"
                            onclick='deleteListImage(${JSON.stringify(key)},${index})'
                        >
                            ลบรูปภาพ
                        </button>
                        `
                        :
                        ""
                    }

                </div>

            </div>

            `;

        }
    );


    html += `</div>`;

    document.getElementById("app").innerHTML =
    html;

}

    saveData();

    listPage(
        getListTitle(key),
        key,
        hasImage
    );

}


function saveListItem(

){

    siteData[key][index].title =

        key + "Title" + index

    siteData[key][index].detail =

        key + "Detail" + index
    ).value;

}

){

    document.getElementById(
        "sectionContent"

    saveData();

    siteData.sections[name] = {

    };


    saveData();

    sectionPage(name);

}


/* =====================================================
   BACKUP
===================================================== */

function backupPage(){

    document.getElementById("app").innerHTML = `

    <div class="card">

        <h1 class="page-title">
            สำรอง / กู้คืนข้อมูล
        </h1>

        <p class="page-description">
            ดาวน์โหลดข้อมูลทั้งหมดเก็บไว้ หรือกู้คืนข้อมูลจากไฟล์ JSON
        </p>

        <div class="actions">

            <button
                class="btn btn-success"
                onclick="downloadBackup()"
            >
                ดาวน์โหลดสำรองข้อมูล
            </button>

        </div>

        <label>
            กู้คืนไฟล์ JSON
        </label>

        <input
            type="file"
            accept=".json,application/json"
            onchange="restoreBackup(this)"
        >

        <button
            class="btn btn-danger"
            onclick="resetAllData()"
        >
            รีเซ็ตข้อมูลเว็บไซต์ทั้งหมด
        </button>

    </div>

    `;

}


function downloadBackup(){

    const blob = new Blob(

        [
            JSON.stringify(
                siteData,
                null,
                2
            )
        ],

        {
            type:"application/json"
        }

    );


    const url =
    URL.createObjectURL(blob);


    const link =
    document.createElement("a");


    link.href = url;


    link.download =
    "rongkhem-e-village-backup.json";


    link.click();


    URL.revokeObjectURL(url);

}


function restoreBackup(input){

    const file =
    input.files[0];


    if(!file) return;


    const reader =
    new FileReader();


    reader.onload =
    function(event){

        try{

            const data =
            JSON.parse(
                event.target.result
            );


            siteData = data;


            saveData();


            alert(
                "กู้คืนข้อมูลเรียบร้อย"
            );


            openPage(
                "ภาพรวมระบบ"
            );

        }catch(error){

            alert(
                "ไฟล์ข้อมูลไม่ถูกต้อง"
            );

        }

    };


    reader.readAsText(file);

}


function resetAllData(){

    if(
        !confirm(
            "ต้องการรีเซ็ตข้อมูลเว็บไซต์ทั้งหมดหรือไม่?"
        )
    ){
        return;
    }


    siteData =
    structuredClone(
        DEFAULT_DATA
    );


    saveData();


    openPage(
        "ภาพรวมระบบ"
    );

}

   LOGOUT
===================================================== */

function logout(){

    if(
        !confirm(
            "ต้องการออกจากระบบหรือไม่?"
        )
    ){
        return;
    }


    localStorage.removeItem(
        "rongkhemAdminLoggedIn"
    );


    localStorage.removeItem(
        "rongkhemAdminUsername"
    );


    window.location.replace(
        "login.html"
    );

}

);
