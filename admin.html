<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
  ระบบหลังบ้าน - บ้านร่องเข็ม
</title>

<style>

/* ========================================
   GLOBAL
======================================== */

*{
  box-sizing:border-box;
}

body{
  font-family:Sarabun,Arial,sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
}


/* ========================================
   ADMIN WRAPPER
======================================== */

.admin-wrapper{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}


/* ========================================
   TOP BAR
======================================== */

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  background:#113a72;
  color:white;
  padding:15px 20px;
  border-radius:8px;
  margin-bottom:20px;
}


/* ========================================
   FORM
======================================== */

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:16px;
}

textarea{
  resize:vertical;
}


/* ========================================
   BUTTONS
======================================== */

.btn-group{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

button:hover{
  opacity:.9;
}

.btn-save{
  background:#28a745;
  color:white;
}

.btn-reset{
  background:#6c757d;
  color:white;
}

.btn-logout,
.btn-delete{
  background:#dc3545;
  color:white;
}

.btn-edit{
  background:#ffc107;
  color:#222;
}


/* ========================================
   TABLE
======================================== */

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  min-width:700px;
}

th,
td{
  border:1px solid #ddd;
  padding:10px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f1f3f5;
}


/* ========================================
   IMAGE
======================================== */

.img-preview{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:5px;
  border:1px solid #ddd;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:600px){

  body{
    padding:10px;
  }

  .admin-wrapper{
    padding:15px;
  }

  .top-bar{
    flex-direction:column;
    align-items:flex-start;
  }

  .btn-group{
    flex-direction:column;
  }

  .btn-group button{
    width:100%;
  }

}

</style>

</head>


<body>


<div class="admin-wrapper">


<!-- =====================================
     TOP BAR
===================================== -->

<div class="top-bar">

  <div>

    👤 ผู้ดูแลระบบ:

    <strong id="adminEmail">

      กำลังตรวจสอบ...

    </strong>

  </div>


  <button
    id="logoutBtn"
    class="btn-logout"
    type="button">

    🚪 ออกจากระบบ

  </button>

</div>


<!-- =====================================
     TITLE
===================================== -->

<h2>

  ⚙️ ระบบจัดการข้อมูลหมู่บ้าน

</h2>


<!-- =====================================
     SELECT MENU
===================================== -->

<div class="form-group">

  <label for="menuSelect">

    เลือกเมนู

  </label>


  <select id="menuSelect">

    <option value="news">

      ข่าวสารประชาสัมพันธ์

    </option>


    <option value="complaints">

      เรื่องร้องเรียน

    </option>


    <option value="elderly">

      ข้อมูลผู้สูงอายุ

    </option>


    <option value="vulnerable">

      กลุ่มเปราะบาง

    </option>


    <option value="projects">

      โครงการหมู่บ้าน

    </option>


    <option value="incidents">

      เหตุการณ์ / แจ้งเตือน

    </option>


    <option value="activities">

      กิจกรรม

    </option>

  </select>

</div>


<hr>


<!-- =====================================
     FORM TITLE
===================================== -->

<h3 id="formTitle">

  ➕ เพิ่มข้อมูลใหม่

</h3>


<!-- =====================================
     CRUD FORM
===================================== -->

<form id="crudForm">


  <!-- RECORD ID -->

  <input
    type="hidden"
    id="recordId">


  <!-- CURRENT IMAGE URL -->

  <input
    type="hidden"
    id="currentImageUrl">


  <!-- TITLE -->

  <div class="form-group">

    <label for="titleInput">

      หัวข้อ

    </label>


    <input
      type="text"
      id="titleInput"
      required
      placeholder="ระบุหัวข้อ">

  </div>


  <!-- DETAIL -->

  <div class="form-group">

    <label for="detailInput">

      รายละเอียด

    </label>


    <textarea
      id="detailInput"
      rows="5"
      placeholder="รายละเอียดข้อมูล"></textarea>

  </div>


  <!-- IMAGE -->

  <div class="form-group">

    <label for="imageInput">

      รูปภาพ

    </label>


    <input
      type="file"
      id="imageInput"
      accept="image/*">


    <!-- IMAGE PREVIEW -->

    <div
      id="imagePreviewContainer"
      style="
        display:none;
        margin-top:10px;
      ">

      <img
        id="imagePreview"
        class="img-preview"
        alt="ตัวอย่างรูปภาพ">

    </div>

  </div>


  <!-- BUTTONS -->

  <div class="btn-group">


    <button
      type="submit"
      id="saveBtn"
      class="btn-save">

      💾 บันทึกข้อมูล

    </button>


    <button
      type="button"
      id="resetBtn"
      class="btn-reset">

      ↩ ยกเลิก

    </button>


  </div>


</form>


<hr>


<!-- =====================================
     DATA TABLE
===================================== -->

<h3>

  📋 รายการข้อมูล

</h3>


<div class="table-wrapper">

  <table>


    <thead>

      <tr>

        <th>

          ID

        </th>


        <th>

          รูป

        </th>


        <th>

          หัวข้อ

        </th>


        <th>

          รายละเอียด

        </th>


        <th>

          จัดการ

        </th>

      </tr>

    </thead>


    <tbody id="tableBody">

      <tr>

        <td
          colspan="5"
          style="text-align:center">

          กำลังโหลด...

        </td>

      </tr>

    </tbody>


  </table>

</div>


</div>


<!-- =====================================
     JAVASCRIPT
===================================== -->

<script
  type="module"
  src="manage-admin.js">
</script>


</body>

</html>
