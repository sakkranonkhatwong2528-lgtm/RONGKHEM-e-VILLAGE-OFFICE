<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการข้อมูลระบบ - RONGKHEM e-VILLAGE OFFICE</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f8f9fa;
    color:#191c1d;
    font-family:'Noto Sans','Be Vietnam Pro',sans-serif;
    padding-bottom:100px;
}

.material-symbols-outlined{
    font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
}

.icon-fill{
    font-variation-settings:
    'FILL' 1,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
}

.ambient-shadow{
    box-shadow:0 2px 8px rgba(26,95,122,.06);
}

input,
textarea,
button{
    font-family:inherit;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#00475e;
    box-shadow:0 0 0 2px rgba(0,71,94,.12);
}

.card{
    background:#fff;
    border:1px solid #e1e3e4;
    border-radius:16px;
    padding:24px;
    box-shadow:0 2px 8px rgba(26,95,122,.05);
}

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    padding-bottom:16px;
    margin-bottom:24px;
    border-bottom:1px solid #c0c8cd;
}

.section-title h2{
    margin:0;
    font-size:18px;
    font-weight:700;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    font-size:14px;
    font-weight:600;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #70787d;
    border-radius:8px;
    background:#fff;
    padding:12px 14px;
    font-size:15px;
}

.field textarea{
    min-height:150px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:999px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:active{
    transform:scale(.97);
}

.btn-primary{
    background:#00475e;
    color:#fff;
}

.btn-secondary{
    background:#edeeef;
    color:#191c1d;
}

.btn-danger{
    background:#ba1a1a;
    color:#fff;
}

.btn-outline{
    background:#fff;
    color:#00475e;
    border:1px solid #00475e;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    border-bottom:1px solid #c0c8cd;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    min-height:68px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn{
    border:0;
    background:transparent;
    color:#00475e;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    font-weight:700;
}

.header-title{
    font-size:18px;
    font-weight:700;
}

.main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px 16px;
    display:flex;
    flex-direction:column;
    gap:25px;
}

.profile-grid{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:30px;
}

.profile-photo{
    width:160px;
    height:160px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    border:4px solid #edeeef;
    background:#e7e8e9;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.preview-box{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:14px;
}

.preview-item{
    position:relative;
    width:96px;
    height:96px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #c0c8cd;
}

.preview-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.preview-remove{
    position:absolute;
    top:5px;
    right:5px;
    width:26px;
    height:26px;
    border:0;
    border-radius:50%;
    background:#ba1a1a;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.upload-zone{
    border:2px dashed #c0c8cd;
    border-radius:12px;
    padding:28px 15px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.upload-zone:hover{
    border-color:#00475e;
    background:#f3f7f8;
}

.upload-zone .material-symbols-outlined{
    font-size:42px;
    color:#00475e;
}

.tourist-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.tourist-image{
    height:280px;
    border-radius:14px;
    overflow:hidden;
    background:#e7e8e9;
    position:relative;
}

.tourist-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.status{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    background:#fff;
    border-top:1px solid #c0c8cd;
    box-shadow:0 -4px 15px rgba(0,0,0,.07);
}

.status-inner{
    max-width:1100px;
    margin:auto;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
}

.status-text{
    margin-right:auto;
    color:#70787d;
    font-size:13px;
}

.hidden{
    display:none!important;
}

.toast{
    position:fixed;
    top:82px;
    right:18px;
    z-index:500;
    background:#00475e;
    color:#fff;
    padding:13px 18px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    opacity:0;
    pointer-events:none;
    transform:translateY(-10px);
    transition:.25s;
    font-size:14px;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:700px){

    .header-title{
        font-size:16px;
    }

    .profile-grid{
        grid-template-columns:1fr;
    }

    .tourist-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
    }

    .status-inner{
        flex-wrap:wrap;
    }

    .status-text{
        display:none;
    }

    .status-inner .btn{
        flex:1;
    }

}

</style>
</head>


<body>

     HEADER
========================= -->

<header class="header">

        >

<script>

/* =====================================
   STORAGE KEY
===================================== */

const STORAGE_KEY =
    'rongkhem_manage_data_v1';



/* =====================================
   DEFAULT DATA
===================================== */

const defaultData = {

    leader: {

        name:
            'นายศักรนนทน์ ขัติย์วงค์',

        position:
            'ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6',

        description:
            'ดูแลการบริหารงานทั่วไปและประสานงานพัฒนาหมู่บ้าน',

        photo:
            'village-head.jpg'

    },

    news: [],

    tourist: {

        name:
            '',

        description:
            '',

        image:
            ''

    }

};



/* =====================================
   LOAD DATA
===================================== */

function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){

            return structuredClone(defaultData);

        }

        const data =
            JSON.parse(saved);

        return {

            leader:
                {...defaultData.leader,...data.leader},

            news:
                Array.isArray(data.news)
                ? data.news
                : [],

            tourist:
                {...defaultData.tourist,...data.tourist}

        };

    }catch(error){

        console.error(error);

        return structuredClone(defaultData);

    }

}



let appData = loadData();



/* =====================================
   TOAST
===================================== */

function showToast(message){

    const toast =
        document.getElementById('toast');

    toast.textContent =
        message;

    toast.classList.add('show');

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(()=>{

            toast.classList.remove('show');

        },2500);

}



/* =====================================
   BACK
===================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(location.origin)
    ){

        history.back();

    }else{

        location.href =
            'admin.html';

    }

}



/* =====================================
   LEADER IMAGE
===================================== */

document
    .getElementById('leaderPhoto')
    .addEventListener(
        'change',
        function(){

            const file =
                this.files[0];

            if(!file) return;


            if(file.size > 2 * 1024 * 1024){

                alert(
                    'รูปผู้บริหารต้องไม่เกิน 2MB'
                );

                this.value='';

                return;

            }


            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    document
                        .getElementById(
                            'leaderPreview'
                        )
                        .src =
                        e.target.result;

                };

            reader.readAsDataURL(file);

        }
    );



/* =====================================
   NEWS IMAGES
===================================== */

let newsImageFiles = [];



document
    .getElementById('newsImages')
    .addEventListener(
        'change',
        function(){

            const files =
                Array.from(this.files);

            if(
                newsImageFiles.length +
                files.length >
                10
            ){

                alert(
                    'สามารถเลือกภาพได้สูงสุด 10 รูป'
                );

                return;

            }


            for(const file of files){

                if(
                    file.size >
                    5 * 1024 * 1024
                ){

                    alert(
                        file.name +
                        ' มีขนาดเกิน 5MB'
                    );

                    continue;

                }

                newsImageFiles.push(file);

            }


            renderNewsPreviews();

            this.value='';

        }
    );



function renderNewsPreviews(){

    const box =
        document.getElementById(
            'newsPreview'
        );

    box.innerHTML='';


    newsImageFiles.forEach(
        (file,index)=>{

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const item =
                        document.createElement(
                            'div'
                        );

                    item.className =
                        'preview-item';

                    item.innerHTML = `

                        <img
                            src="${e.target.result}"
                            alt=""
                        >

                        <button
                            class="preview-remove"
                            onclick="removeNewsImage(${index})"
                            type="button"
                        >

                            <span
                                class="material-symbols-outlined"
                                style="font-size:16px;"
                            >
                                close
                            </span>

                        </button>

                    `;

                    box.appendChild(item);

                };

            reader.readAsDataURL(file);

        }
    );

}



function removeNewsImage(index){

    newsImageFiles.splice(
        index,
        1
    );

    renderNewsPreviews();

}



/* =====================================
   ADD NEWS
===================================== */

function addNews(){

    const title =
        document
            .getElementById('newsTitle')
            .value
            .trim();

    const detail =
        document
            .getElementById('newsDetail')
            .value
            .trim();


    if(!title){

        alert(
            'กรุณากรอกหัวข้อข่าว/กิจกรรม'
        );

        return;

    }


    const item = {

        id:
            Date.now(),

        title:
            title,

        detail:
            detail,

        date:
            new Date()
                .toLocaleDateString(
                    'th-TH',
                    {
                        day:'numeric',
                        month:'short',
                        year:'numeric'
                    }
                ),

        images:[]

    };


    /*
       อ่านภาพที่เลือกเป็น Data URL
       เพื่อให้ใช้งานได้ในเครื่องนี้
    */

    const readers =
        newsImageFiles.map(
            file =>
                new Promise(
                    resolve=>{

                        const reader =
                            new FileReader();

                        reader.onload =
                            e =>
                                resolve(
                                    e.target.result
                                );

                        reader.readAsDataURL(file);

                    }
                )
        );


    Promise.all(readers)
        .then(images=>{

            item.images =
                images;

            appData.news.unshift(
                item
            );

            renderNewsList();

            clearNewsForm();

            showToast(
                'เพิ่มข่าว/กิจกรรมแล้ว'
            );

        });

}



function clearNewsForm(){

    document
        .getElementById('newsTitle')
        .value='';

    document
        .getElementById('newsDetail')
        .value='';

    newsImageFiles=[];

    renderNewsPreviews();

}



/* =====================================
   NEWS LIST
===================================== */

function renderNewsList(){

    const list =
        document.getElementById(
            'newsList'
        );

    list.innerHTML='';


    if(!appData.news.length){

        list.innerHTML = `

            <div style="
                padding:20px;
                background:#f3f4f5;
                border-radius:10px;
                color:#70787d;
                text-align:center;
            ">
                ยังไม่มีข่าว/กิจกรรมที่เพิ่มในหน้านี้
            </div>

        `;

        return;

    }


    appData.news.forEach(
        item=>{

            const row =
                document.createElement(
                    'div'
                );

            row.style.cssText = `
                border:1px solid #e1e3e4;
                border-radius:12px;
                padding:14px;
                margin-bottom:10px;
                background:#fff;
            `;


            const image =
                item.images &&
                item.images.length
                ? `
                    <img
                        src="${item.images[0]}"
                        style="
                            width:70px;
                            height:70px;
                            object-fit:cover;
                            border-radius:8px;
                        "
                    >
                  `
                : '';


            row.innerHTML = `

                <div style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                ">

                    ${image}

                    <div style="
                        flex:1;
                        min-width:0;
                    ">

                        <strong>
                            ${escapeHtml(item.title)}
                        </strong>

                        <div style="
                            color:#70787d;
                            font-size:12px;
                            margin-top:4px;
                        ">
                            ${escapeHtml(item.date)}
                        </div>

                    </div>

                    <button
                        class="btn btn-danger"
                        style="padding:8px 12px;"
                        onclick="deleteNews(${item.id})"
                    >
                        ลบ
                    </button>

                </div>

            `;

            list.appendChild(row);

        }
    );

}



function deleteNews(id){

    if(
        !confirm(
            'ต้องการลบรายการนี้หรือไม่?'
        )
    ){

        return;

    }


    appData.news =
        appData.news.filter(
            item =>
                item.id !== id
        );


    renderNewsList();

    showToast(
        'ลบรายการแล้ว'
    );

}



/* =====================================
   TOURIST IMAGE
===================================== */

document
    .getElementById('touristImage')
    .addEventListener(
        'change',
        function(){

            const file =
                this.files[0];

            if(!file) return;


            if(
                file.size >
                5 * 1024 * 1024
            ){

                alert(
                    'ภาพสถานที่ต้องไม่เกิน 5MB'
                );

                this.value='';

                return;

            }


            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const preview =
                        document
                            .getElementById(
                                'touristPreview'
                            );

                    preview.src =
                        e.target.result;

                    preview.style.display =
                        'block';

                    document
                        .getElementById(
                            'touristEmpty'
                        )
                        .style.display =
                        'none';

                };

            reader.readAsDataURL(file);

        }
    );



/* =====================================
   SAVE TOURIST
===================================== */

function saveTourist(){

    appData.tourist.name =
        document
            .getElementById(
                'touristName'
            )
            .value
            .trim();

    appData.tourist.description =
        document
            .getElementById(
                'touristDescription'
            )
            .value
            .trim();


    const preview =
        document
            .getElementById(
                'touristPreview'
            );


    if(
        preview.src &&
        preview.style.display !== 'none'
    ){

        appData.tourist.image =
            preview.src;

    }


    showToast(
        'ข้อมูลสถานที่พร้อมบันทึกแล้ว'
    );

}



/* =====================================
   SAVE ALL
===================================== */

function saveAll(){

    appData.leader.name =
        document
            .getElementById(
                'leaderName'
            )
            .value
            .trim();

    appData.leader.position =
        document
            .getElementById(
                'leaderPosition'
            )
            .value
            .trim();

    appData.leader.description =
        document
            .getElementById(
                'leaderDescription'
            )
            .value
            .trim();


    const leaderPreview =
        document
            .getElementById(
                'leaderPreview'
            );


    if(
        leaderPreview.src &&
        leaderPreview.src.startsWith(
            'data:image'
        )
    ){

        appData.leader.photo =
            leaderPreview.src;

    }


    saveTourist();


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(appData)
    );


    showToast(
        'บันทึกข้อมูลเรียบร้อยแล้ว'
    );

}



/* =====================================
   CANCEL
===================================== */

function cancelChanges(){

    if(
        !confirm(
            'ต้องการยกเลิกการเปลี่ยนแปลงหรือไม่?'
        )
    ){

        return;

    }


    appData =
        loadData();


    loadToForm();

    showToast(
        'ยกเลิกการเปลี่ยนแปลงแล้ว'
    );

}



/* =====================================
   LOAD TO FORM
===================================== */

function loadToForm(){

    document
        .getElementById(
            'leaderName'
        )
        .value =
        appData.leader.name;

    document
        .getElementById(
            'leaderPosition'
        )
        .value =
        appData.leader.position;

    document
        .getElementById(
            'leaderDescription'
        )
        .value =
        appData.leader.description;


    document
        .getElementById(
            'leaderPreview'
        )
        .src =
        appData.leader.photo;


    document
        .getElementById(
            'touristName'
        )
        .value =
        appData.tourist.name;

    document
        .getElementById(
            'touristDescription'
        )
        .value =
        appData.tourist.description;


    const touristPreview =
        document
            .getElementById(
                'touristPreview'
            );

    const touristEmpty =
        document
            .getElementById(
                'touristEmpty'
            );


    if(
        appData.tourist.image
    ){

        touristPreview.src =
            appData.tourist.image;

        touristPreview.style.display =
            'block';

        touristEmpty.style.display =
            'none';

    }else{

        touristPreview.style.display =
            'none';

        touristEmpty.style.display =
            'flex';

    }


    renderNewsList();

}



/* =====================================
   HTML ESCAPE
===================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");

}



/* =====================================
   INITIALIZE
===================================== */

loadToForm();

</script>
