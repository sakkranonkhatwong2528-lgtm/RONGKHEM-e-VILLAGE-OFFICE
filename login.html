<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Thai",sans-serif;
    background:#eef3f8;
    color:#182432;
}


/* HEADER */

.header{

    height:75px;

    background:
    linear-gradient(
        90deg,
        #061a32,
        #123f70
    );

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    position:sticky;

    top:0;

    z-index:100;

}


.header-title{

    display:flex;

    align-items:center;

    gap:12px;

}


.header-title h1{

    margin:0;

    font-size:20px;

}


.header-title p{

    margin:2px 0 0;

    font-size:12px;

    opacity:.7;

}


/* BUTTON */

.btn{

    border:0;

    border-radius:10px;

    padding:10px 15px;

    font-family:inherit;

    font-size:14px;

    cursor:pointer;

}


.btn-primary{

    background:#e8ad2e;

    color:#16233a;

}


.btn-danger{

    background:#c62828;

    color:#fff;

}


.btn-light{

    background:#e8eef5;

    color:#15263b;

}


.btn-success{

    background:#087a4b;

    color:#fff;

}


.header-btn{

    display:flex;

    gap:8px;

}


/* LAYOUT */

.app{

    display:grid;

    grid-template-columns:
    270px
    1fr;

    min-height:
    calc(100vh - 75px);

}


/* SIDEBAR */

.sidebar{

    background:#fff;

    padding:15px;

    border-right:
    1px solid #dce4ed;

}


.menu-title{

    color:#7b8794;

    font-size:12px;

    margin:
    14px
    10px
    5px;

}


.menu{

    width:100%;

    border:0;

    background:transparent;

    text-align:left;

    padding:11px 13px;

    border-radius:9px;

    font-family:inherit;

    cursor:pointer;

    margin-bottom:2px;

}


.menu:hover{

    background:#edf3f8;

}


.menu.active{

    background:#082b4d;

    color:#fff;

}


/* MAIN */

.main{

    padding:25px;

}


.page-title{

    margin:0 0 5px;

    color:#082b4d;

}


.page-description{

    margin:0 0 22px;

    color:#718093;

    font-size:14px;

}


/* GRID */

.stats{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

}


.stat-card{

    background:#fff;

    border-radius:15px;

    padding:18px;

    box-shadow:
    0 4px 20px
    rgba(0,0,0,.05);

}


.stat-card span{

    color:#718093;

    font-size:13px;

}


.stat-card strong{

    display:block;

    font-size:30px;

    margin-top:8px;

    color:#082b4d;

}


/* CONTENT */

.content-card{

    background:#fff;

    border-radius:16px;

    padding:20px;

    margin-top:20px;

    box-shadow:
    0 4px 20px
    rgba(0,0,0,.05);

}


.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

}


/* FORM */

.form-row{

    display:grid;

    grid-template-columns:
    1fr
    1fr;

    gap:15px;

}


.form-group{

    margin-bottom:15px;

}


label{

    display:block;

    font-size:14px;

    font-weight:600;

    margin-bottom:6px;

}


input,
textarea,
select{

    width:100%;

    padding:11px;

    border:
    1px solid #dce4ed;

    border-radius:9px;

    font-family:inherit;

}


textarea{

    min-height:100px;

    resize:vertical;

}


/* LIST ITEM */

.data-item{

    border:
    1px solid #e0e7ef;

    border-radius:14px;

    padding:16px;

    margin-top:12px;

}


.item-top{

    display:flex;

    justify-content:space-between;

    gap:10px;

}


.item-actions{

    display:flex;

    gap:5px;

}


.preview{

    width:120px;

    height:90px;

    object-fit:cover;

    border-radius:10px;

    margin-top:10px;

}


.empty{

    color:#8a97a5;

    padding:20px 0;

    text-align:center;

}


/* MOBILE */

@media(max-width:900px){

    .app{

        grid-template-columns:
        1fr;

    }

    .sidebar{

        border-right:0;

        border-bottom:
        1px solid #dce4ed;

    }

    .stats{

        grid-template-columns:
        repeat(2,1fr);

    }

}


@media(max-width:600px){

    .header{

        padding:0 15px;

    }

    .header-title h1{

        font-size:15px;

    }

    .header-title p{

        display:none;

    }

    .main{

        padding:15px;

    }

    .form-row{

        grid-template-columns:
        1fr;

    }

    .stats{

        grid-template-columns:
        1fr;

    }

}

</style>

</head>

<script>

/* ====================================
   DATABASE LOCAL STORAGE
==================================== */

const DATA_KEY =
"rongkhemVillageData";


const defaultData = {

    leader:[],

    assistants:[],

    committee:[],

    advisors:[],

    sao:[],

    health:[],

    news:[],

    activities:[],

    announcements:[],

    tourism:[],

    temples:[],

    maps:[],

    subnamjam:[],

    calendar:[],

    pm25:[],

    weather:[],

    ai:[]

};


/* โหลดข้อมูล */

let villageData =
JSON.parse(
    localStorage.getItem(DATA_KEY)
)
||
defaultData;


/* บันทึก */

function saveData(){

    localStorage.setItem(
        DATA_KEY,
        JSON.stringify(villageData)
    );

    alert(
        "บันทึกข้อมูลเรียบร้อย"
    );

}



/* ====================================
   LOGOUT
==================================== */

function logout(){

    if(
        confirm(
            "ต้องการออกจากระบบหรือไม่?"
        )
    ){

        localStorage.removeItem(
            "rongkhemAdminLoggedIn"
        );

        localStorage.removeItem(
            "rongkhemAdminUsername"
        );

        window.location.replace(
            "login.html"
        );

    }

}



/* ====================================
   MENU
==================================== */

function showPage(
    page,
    button
){

    document
    .querySelectorAll(".menu")
    .forEach(function(menu){

        menu.classList.remove(
            "active"
        );

    });


    if(button){

        button.classList.add(
            "active"
        );

    }


    switch(page){

        case "dashboard":
            renderDashboard();
            break;

        case "leader":
            renderList(
                "leader",
                "👨‍💼 ผู้ใหญ่บ้าน"
            );
            break;

        case "assistants":
            renderList(
                "assistants",
                "🤝 ผู้ช่วยผู้ใหญ่บ้าน"
            );
            break;

        case "committee":
            renderList(
                "committee",
                "🏛️ คณะกรรมการหมู่บ้าน"
            );
            break;

        case "advisors":
            renderList(
                "advisors",
                "🎓 คณะที่ปรึกษา / ผู้ทรงคุณวุฒิ"
            );
            break;

        case "sao":
            renderList(
                "sao",
                "🗳️ สมาชิก ส.อบต."
            );
            break;

        case "health":
            renderList(
                "health",
                "❤️ อสม."
            );
            break;

        case "news":
            renderList(
                "news",
                "📰 ข่าวประชาสัมพันธ์"
            );
            break;

        case "activities":
            renderList(
                "activities",
                "📅 กิจกรรม"
            );
            break;

        case "announcements":
            renderList(
                "announcements",
                "📣 ประกาศสำคัญ"
            );
            break;

        case "tourism":
            renderList(
                "tourism",
                "🌿 แหล่งท่องเที่ยว"
            );
            break;

        case "temples":
            renderList(
                "temples",
                "🛕 วัดและสถานที่สำคัญ"
            );
            break;

        case "maps":
            renderList(
                "maps",
                "🗺️ แผนที่หมู่บ้าน"
            );
            break;

        case "subnamjam":
            renderList(
                "subnamjam",
                "💧 แหล่งซับน้ำจำ"
            );
            break;

        case "calendar":
            renderList(
                "calendar",
                "🗓️ วันพระ / วันสำคัญ"
            );
            break;

        case "pm25":
            renderList(
                "pm25",
                "🌫️ ข้อมูล PM2.5"
            );
            break;

        case "weather":
            renderList(
                "weather",
                "☁️ พยากรณ์อากาศ"
            );
            break;

        case "ai":
            renderList(
                "ai",
                "🤖 ผู้ช่วย AI"
            );
            break;

        case "backup":
            renderBackup();
            break;

        case "settings":
            renderSettings();
            break;

    }

}



/* ====================================
   DASHBOARD
==================================== */

function renderDashboard(){

    mainContent.innerHTML = `

        <h2 class="page-title">
            📊 Dashboard
        </h2>

        <p class="page-description">
            ภาพรวมข้อมูลระบบหมู่บ้าน
        </p>


        <div class="stats">

            <div class="stat-card">

                <span>
                    ผู้ช่วยผู้ใหญ่บ้าน
                </span>

                <strong>
                    ${villageData.assistants.length}
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    คณะกรรมการ
                </span>

                <strong>
                    ${villageData.committee.length}
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    ข่าวประชาสัมพันธ์
                </span>

                <strong>
                    ${villageData.news.length}
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    กิจกรรม
                </span>

                <strong>
                    ${villageData.activities.length}
                </strong>

            </div>

        </div>


        <div class="content-card">

            <h3>
                ยินดีต้อนรับเข้าสู่ระบบ
            </h3>

            <p>
                คุณสามารถเพิ่ม แก้ไข ลบ
                และบันทึกข้อมูลของเว็บไซต์
                ได้จากเมนูด้านซ้าย
            </p>

        </div>

    `;

}



/* ====================================
   RENDER LIST
==================================== */

function renderList(
    type,
    title
){

    const data =
    villageData[type];


    let html = `

        <h2 class="page-title">
            ${title}
        </h2>

        <p class="page-description">

            เพิ่ม แก้ไข ลบ
            และอัปโหลดรูปภาพได้

        </p>


        <div class="content-card">

            <div class="toolbar">

                <strong>
                    จำนวน ${data.length} รายการ
                </strong>


                <button
                class="btn btn-primary"
                onclick="addItem('${type}')"
                >
                    + เพิ่มข้อมูล
                </button>

            </div>


    `;


    if(
        data.length === 0
    ){

        html += `

            <div class="empty">

                ยังไม่มีข้อมูล

            </div>

        `;

    }


    data.forEach(
        function(item,index){

            html += `

                <div class="data-item">

                    <div class="item-top">

                        <strong>

                            รายการที่
                            ${index + 1}

                        </strong>


                        <div class="item-actions">

                            <button
                            class="btn btn-danger"
                            onclick="deleteItem(
                                '${type}',
                                ${index}
                            )"
                            >

                                ลบ

                            </button>

                        </div>

                    </div>


                    <div class="form-row">

                        <div>

                            <div class="form-group">

                                <label>
                                    ชื่อ / หัวข้อ
                                </label>

                                <input
                                type="text"
                                value="${escapeHtml(
                                    item.title || ''
                                )}"
                                onchange="
                                updateField(
                                    '${type}',
                                    ${index},
                                    'title',
                                    this.value
                                )"
                                >

                            </div>


                            <div class="form-group">

                                <label>
                                    ตำแหน่ง / สถานที่
                                </label>

                                <input
                                type="text"
                                value="${escapeHtml(
                                    item.role || ''
                                )}"
                                onchange="
                                updateField(
                                    '${type}',
                                    ${index},
                                    'role',
                                    this.value
                                )"
                                >

                            </div>


                            <div class="form-group">

                                <label>
                                    เบอร์โทรศัพท์
                                </label>

                                <input
                                type="text"
                                value="${escapeHtml(
                                    item.phone || ''
                                )}"
                                onchange="
                                updateField(
                                    '${type}',
                                    ${index},
                                    'phone',
                                    this.value
                                )"
                                >

                            </div>

                        </div>


                        <div>

                            <div class="form-group">

                                <label>
                                    รายละเอียด
                                </label>

                                <textarea
                                onchange="
                                updateField(
                                    '${type}',
                                    ${index},
                                    'detail',
                                    this.value
                                )"
                                >${escapeHtml(
                                    item.detail || ''
                                )}</textarea>

                            </div>


                            <div class="form-group">

                                <label>
                                    อัปโหลดรูปภาพ
                                </label>

                                <input
                                type="file"
                                accept="image/*"
                                onchange="
                                uploadImage(
                                    event,
                                    '${type}',
                                    ${index}
                                )"
                                >

                            </div>


                            ${
                                item.image
                                ?
                                `

                                <img
                                src="${item.image}"
                                class="preview"
                                >

                                `
                                :
                                ""
                            }

                        </div>

                    </div>

                </div>

            `;

        }
    );


    html += `

        <br>

        <button
        class="btn btn-success"
        onclick="saveData()"
        >

            💾 บันทึกข้อมูลทั้งหมด

        </button>


        </div>

    `;


    mainContent.innerHTML =
    html;

}



/* ====================================
   ADD ITEM
==================================== */

function addItem(type){

    villageData[type].push({

        title:"",

        role:"",

        phone:"",

        detail:"",

        image:""

    });


    saveDataSilent();


    renderList(
        type,
        getTitle(type)
    );

}



/* ====================================
   DELETE
==================================== */

function deleteItem(
    type,
    index
){

    if(
        confirm(
            "ต้องการลบข้อมูลนี้หรือไม่?"
        )
    ){

        villageData[type].splice(
            index,
            1
        );


        saveDataSilent();


        renderList(
            type,
            getTitle(type)
        );

    }

}



/* ====================================
   UPDATE FIELD
==================================== */

function updateField(
    type,
    index,
    field,
    value
){

    villageData[type][index][field] =
    value;

}



/* ====================================
   UPLOAD IMAGE
==================================== */

function uploadImage(
    event,
    type,
    index
){

    const file =
    event.target.files[0];


    if(!file){

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        villageData[type][index].image =
        e.target.result;


        saveDataSilent();


        renderList(
            type,
            getTitle(type)
        );

    };


    reader.readAsDataURL(
        file
    );

}



/* ====================================
   SAVE SILENT
==================================== */

function saveDataSilent(){

    localStorage.setItem(
        DATA_KEY,
        JSON.stringify(villageData)
    );

}



/* ====================================
   TITLE
==================================== */

function getTitle(type){

    const titles = {

        leader:"👨‍💼 ผู้ใหญ่บ้าน",

        assistants:"🤝 ผู้ช่วยผู้ใหญ่บ้าน",

        committee:"🏛️ คณะกรรมการหมู่บ้าน",

        advisors:
        "🎓 คณะที่ปรึกษา / ผู้ทรงคุณวุฒิ",

        sao:
        "🗳️ สมาชิก ส.อบต.",

        health:
        "❤️ อสม.",

        news:
        "📰 ข่าวประชาสัมพันธ์",

        activities:
        "📅 กิจกรรม",

        announcements:
        "📣 ประกาศสำคัญ",

        tourism:

        temples:

/* ====================================
   BACKUP
==================================== */

function renderBackup(){

    mainContent.innerHTML = `

        <h2 class="page-title">
            💾 สำรองข้อมูล
        </h2>

        <p class="page-description">
            ดาวน์โหลดและกู้คืนข้อมูลระบบ
        </p>


        <div class="content-card">

            <button
            class="btn btn-primary"
            onclick="downloadBackup()"
            >
                ดาวน์โหลด Backup
            </button>


            <br><br>


            <label>
                กู้คืนข้อมูล
            </label>


            <input
            type="file"
            accept=".json"
            onchange="restoreBackup(event)"
            >

        </div>

    `;

}



function downloadBackup(){

    const data =
    JSON.stringify(
        villageData,
        null,
        2
    );


    const blob =
    new Blob(
        [data],
        {
            type:
            "application/json"
        }
    );


    const url =
    URL.createObjectURL(
        blob
    );


    const link =
    document.createElement("a");


    link.href =
    url;


    link.download =
    "rongkhem-backup.json";


    link.click();


    URL.revokeObjectURL(
        url
    );

}



function restoreBackup(event){

    const file =
    event.target.files[0];


    if(!file){

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        try{

            villageData =
            JSON.parse(
                e.target.result
            );


            saveData();


            renderDashboard();

        }

        catch(error){

            alert(
                "ไฟล์ Backup ไม่ถูกต้อง"
            );

        }

    };


    reader.readAsText(
        file
    );

}

/* ====================================
   ESCAPE HTML
==================================== */

function escapeHtml(text){

    return String(text)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    );

}
