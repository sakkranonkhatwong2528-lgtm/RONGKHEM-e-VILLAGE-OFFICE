<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เข้าสู่ระบบ | RONGKHEM e-VILLAGE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#021526,#063970,#0a5aa5);display:flex;align-items:center;justify-content:center;padding:20px}.login-wrapper{width:100%;max-width:440px}.login-box{background:#fff;border-radius:24px;padding:42px 35px 32px;box-shadow:0 25px 70px rgba(0,0,0,.35)}.logo{width:82px;height:82px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#075aa7,#0b8bd6);display:flex;align-items:center;justify-content:center;font-size:38px}h1{margin:0;text-align:center;color:#082b4d;font-size:26px}.subtitle{text-align:center;color:#6b7c8d;font-size:14px;line-height:1.7;margin:8px 0 30px}.form-group{margin-bottom:18px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:600;color:#28445e}input{width:100%;border:1px solid #d4dce5;background:#f8fafc;border-radius:11px;padding:14px 15px;font-size:15px}.login-btn{width:100%;border:0;border-radius:11px;padding:14px;margin-top:5px;background:#075ca8;color:#fff;font-size:16px;font-weight:600;cursor:pointer}.error,.success{display:none;padding:11px;border-radius:10px;margin-bottom:18px;text-align:center}.error{background:#fff0f0;color:#c62828;border:1px solid #ffcaca}.success{background:#effaf2;color:#198754;border:1px solid #ccebd6}.back{display:block;text-align:center;margin-top:24px;color:#075ca8;text-decoration:none}.footer{text-align:center;color:rgba(255,255,255,.7);font-size:11px;margin-top:18px}
</style></head>
<body><div class="login-wrapper"><div class="login-box"><div class="logo">🏛️</div><h1>RONGKHEM e-VILLAGE</h1><div class="subtitle">ระบบจัดการหลังบ้าน<br>ที่ทำการผู้ใหญ่บ้านออนไลน์<br>บ้านร่องเข็ม หมู่ที่ 6</div>
<div id="errorMessage" class="error"></div><div id="successMessage" class="success">เข้าสู่ระบบสำเร็จ กำลังเปิดระบบหลังบ้าน...</div>
<form id="loginForm"><div class="form-group"><label for="username">ชื่อผู้ใช้</label><input type="text" id="username" autocomplete="username" required></div><div class="form-group"><label for="password">รหัสผ่าน</label><input type="password" id="password" autocomplete="current-password" required></div><button type="submit" class="login-btn" id="loginButton">เข้าสู่ระบบ</button></form><a href="index.html" class="back">← กลับหน้าเว็บไซต์</a></div><div class="footer">© RONGKHEM e-VILLAGE OFFICE</div></div>
<script>
const ADMIN_USERNAME="sakkranon",ADMIN_PASSWORD="23122528",LOGIN="RONGKHEM_EVILLAGE_ADMIN_LOGIN";
const form=document.getElementById("loginForm"),u=document.getElementById("username"),p=document.getElementById("password"),err=document.getElementById("errorMessage"),ok=document.getElementById("successMessage"),btn=document.getElementById("loginButton");
form.addEventListener("submit",function(e){e.preventDefault();err.style.display="none";ok.style.display="none";if(u.value.trim()===ADMIN_USERNAME&&p.value===ADMIN_PASSWORD){localStorage.setItem("rongkhemAdminLoggedIn","true");localStorage.setItem("rongkhemAdminUsername",u.value.trim());sessionStorage.setItem(LOGIN,"1");ok.style.display="block";btn.disabled=true;btn.textContent="กำลังเข้าสู่ระบบ...";setTimeout(()=>location.href="admin.html",500)}else{err.textContent="ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";err.style.display="block";p.value="";p.focus()}});
</script></body></html>
