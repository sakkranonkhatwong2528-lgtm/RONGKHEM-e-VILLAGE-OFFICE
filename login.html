<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เข้าสู่ระบบ | RONGKHEM e-VILLAGE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#021526,#063970,#0a5aa5);display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:40px 32px;box-shadow:0 25px 70px #0005}.logo{text-align:center;font-size:52px}.title{text-align:center;color:#082b4d;margin:8px 0}.sub{text-align:center;color:#667;margin-bottom:25px}label{display:block;margin:14px 0 6px;font-weight:700;color:#28445e}input{width:100%;padding:14px;border:1px solid #d4dce5;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#075ca8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.msg{display:none;margin:15px 0;padding:10px;border-radius:9px;text-align:center}.err{background:#fff0f0;color:#b42318}.ok{background:#effaf2;color:#198754}.back{display:block;text-align:center;margin-top:22px;color:#075ca8;text-decoration:none}
</style></head><body><div class="box"><div class="logo">🏛️</div><h1 class="title">RONGKHEM e-VILLAGE</h1><div class="sub">เข้าสู่ระบบผู้ดูแล<br>ที่ทำการผู้ใหญ่บ้านออนไลน์</div><div id="msg" class="msg"></div>
<form id="loginForm"><label>ชื่อผู้ใช้</label><input id="username" required autocomplete="username"><label>รหัสผ่าน</label><input id="password" type="password" required autocomplete="current-password"><button id="loginButton" type="submit">เข้าสู่ระบบ</button></form><a class="back" href="index.html">← กลับหน้าเว็บไซต์</a></div>
<script>
const ADMIN_USERNAME="sakkranon", ADMIN_PASSWORD="23122528";
const form=document.getElementById("loginForm"), msg=document.getElementById("msg"), btn=document.getElementById("loginButton");
function show(text,ok=false){msg.textContent=text;msg.className="msg "+(ok?"ok":"err");msg.style.display="block"}
form.addEventListener("submit",function(e){e.preventDefault();const u=username.value.trim(),p=password.value;if(u!==ADMIN_USERNAME||p!==ADMIN_PASSWORD){show("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");password.value="";password.focus();return}localStorage.setItem("rongkhemAdminLoggedIn","true");localStorage.setItem("rongkhemAdminUsername",u);sessionStorage.setItem("RONGKHEM_EVILLAGE_LOGIN","1");show("เข้าสู่ระบบสำเร็จ กำลังเปิดระบบหลังบ้าน...",true);btn.disabled=true;btn.textContent="กำลังเข้าสู่ระบบ...";setTimeout(()=>location.href="admin.html",500)});
</script></body></html>
