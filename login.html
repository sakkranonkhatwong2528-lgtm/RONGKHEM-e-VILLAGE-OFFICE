<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RONGKHEM ADMIN</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#087565;font-family:Kanit}.box{width:min(400px,90%);background:#fff;padding:35px;border-radius:25px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:11px;font-family:inherit;border:1px solid #ddd}button{background:#087565;color:#fff;border:0}</style></head><body><div class="box"><h1>🏛️ RONGKHEM ADMIN</h1><p>เข้าสู่ระบบจัดการเว็บไซต์</p><input id="u" placeholder="ชื่อผู้ใช้"><input id="p" type="password" placeholder="รหัสผ่าน"><button onclick="go()">เข้าสู่ระบบ</button><small>ตัวอย่าง: admin / 1234</small></div><script>function go(){if(u.value==="admin"&&p.value==="1234")location="admin.html";else alert("ข้อมูลไม่ถูกต้อง")}</script></body></html>
