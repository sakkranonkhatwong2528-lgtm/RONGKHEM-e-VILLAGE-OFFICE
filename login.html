<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เข้าสู่ระบบ | RONGKHEM e-VILLAGE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:"Noto Sans Thai",sans-serif;
    background:linear-gradient(135deg,#021526,#063970,#0a5aa5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-wrapper{
    width:100%;
    max-width:440px;
}

.login-box{
    background:#ffffff;
    border-radius:24px;
    padding:42px 35px 32px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(135deg,#075aa7,#0b8bd6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    box-shadow:0 8px 20px rgba(0,86,170,.25);
}

h1{
    margin:0;
    text-align:center;
    color:#082b4d;
    font-size:26px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#6b7c8d;
    font-size:14px;
    line-height:1.7;
    margin:8px 0 30px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
    color:#28445e;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    border:1px solid #d4dce5;
    background:#f8fafc;
    color:#1d2b38;
    border-radius:11px;
    padding:14px 15px;
    font-family:"Noto Sans Thai",sans-serif;
    font-size:15px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#0871c9;
    background:#fff;
    box-shadow:0 0 0 3px rgba(8,113,201,.12);
}

.login-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    margin-top:5px;
    background:#075ca8;
    color:#fff;
    font-family:"Noto Sans Thai",sans-serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#03477f;
    transform:translateY(-1px);
}

.login-btn:active{
    transform:translateY(0);
}

.error{
    display:none;
    background:#fff0f0;
    color:#c62828;
    border:1px solid #ffcaca;
    padding:11px 13px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    text-align:center;
}

.success{
    display:none;
    background:#effaf2;
    color:#198754;
    border:1px solid #ccebd6;
    padding:11px 13px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:24px;
    color:#075ca8;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    text-decoration:underline;
}

.footer{
    text-align:center;
    color:rgba(255,255,255,.7);
    font-size:11px;
    margin-top:18px;
}

@media(max-width:480px){

    .login-box{
        padding:35px 24px 28px;
        border-radius:20px;
    }

    h1{
        font-size:22px;
    }

}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-box">

        <div class="logo">🏛️</div>

        <h1>RONGKHEM e-VILLAGE</h1>

        <div class="subtitle">
            ระบบจัดการหลังบ้าน<br>
            ที่ทำการผู้ใหญ่บ้านออนไลน์<br>
            บ้านร่องเข็ม หมู่ที่ 6
        </div>

        <div id="errorMessage" class="error"></div>

        <div id="successMessage" class="success">
            เข้าสู่ระบบสำเร็จ กำลังเปิดระบบหลังบ้าน...
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    ชื่อผู้ใช้
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="กรอกชื่อผู้ใช้"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    รหัสผ่าน
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="กรอกรหัสผ่าน"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit" class="login-btn" id="loginButton">
                เข้าสู่ระบบ
            </button>

        </form>

        <a href="index.html" class="back">
            ← กลับหน้าเว็บไซต์
        </a>

    </div>

    <div class="footer">
        © RONGKHEM e-VILLAGE OFFICE
    </div>

</div>

<script>

/* =========================
   ข้อมูลเข้าสู่ระบบ
========================= */

const ADMIN_USERNAME = "sakkranon";
const ADMIN_PASSWORD = "23122528";


/* =========================
   ตรวจสอบการเข้าสู่ระบบ
========================= */

const loginForm = document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");

const loginButton =
    document.getElementById("loginButton");


loginForm.addEventListener("submit", function(event){

    event.preventDefault();


    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;


    errorMessage.style.display = "none";

    successMessage.style.display = "none";


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        /*
        บันทึกสถานะการเข้าสู่ระบบ
        */

        localStorage.setItem(
            "rongkhemAdminLoggedIn",
            "true"
        );


        localStorage.setItem(
            "rongkhemAdminUsername",
            username
        );


        loginButton.textContent =
            "กำลังเข้าสู่ระบบ...";

        loginButton.disabled = true;


        successMessage.style.display =
            "block";


        setTimeout(function(){

            window.location.href =
                "admin.html";

        },800);


    }else{

        errorMessage.textContent =
            "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";

        errorMessage.style.display =
            "block";


        passwordInput.value = "";

        passwordInput.focus();

    }

});


/* =========================
   ถ้าเคยล็อกอินแล้ว
   เปิด admin.html ได้ทันที
========================= */

if(
    localStorage.getItem(
        "rongkhemAdminLoggedIn"
    ) === "true"
){

    window.location.href =
        "admin.html";

}

</script>

</body>
</html>
